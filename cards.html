"<ol><li>6⁶ equally likely rolls. Count x₁ + ⋯ + x₆ = 21 with 1 ≤ xᵢ ≤ 6.</li><li>Shift: yᵢ = xᵢ − 1, so y₁ + ⋯ + y₆ = 15 with 0 ≤ yᵢ ≤ 5.</li><li>No bounds: C(20, 5).</li><li>One yᵢ ≥ 6 → total 9 → C(14, 5), for each of 6 dice.</li><li>Two ≥ 6 → total 3 → C(8, 5), for each of C(6, 2) pairs. Three is impossible (18 &gt; 15).</li></ol><span class='f'>C(20,5) − 6·C(14,5) + C(6,2)·C(8,5) = 15504 − 12012 + 840 = 4332</span><p>Probability <b>4332/6⁶ ≈ 0.093</b>.</p>"],
["i","Dice sums","How many ways can 3 dice (in order) sum to 10?",
"<ol><li>yᵢ = xᵢ − 1: y₁ + y₂ + y₃ = 7 with yᵢ ≤ 5.</li><li>No bounds: C(9, 2) = 36.</li><li>One yᵢ ≥ 6 → total 1 → C(3, 2) = 3, for each of 3 dice: 9. Two ≥ 6 is impossible.</li><li>36 − 9 = <b>27</b>.</li></ol>"],
["i","Derangements","What is a derangement, and what is the formula for Dₙ?",
"<p>A <b>derangement</b> is a permutation of 1, …, n where <b>no</b> number is in its own position: i is never in spot i.</p><span class='f'>Dₙ = n! (1 − 1/1! + 1/2! − 1/3! + ⋯ + (−1)ⁿ/n!)</span><span class='lb'>Small cases</span><p class='ex'>D₃ = <b>2</b>: 231 and 312. D₄ = 24 − 24 + 12 − 4 + 1 = <b>9</b>.</p>"],
["i","Derangements","Derive the derangement formula with inclusion–exclusion.",
"<ol><li>Aᵢ = permutations with i in position i. Derangements = n! − |A₁ ∪ ⋯ ∪ Aₙ|.</li><li>Fixing r chosen numbers leaves the other n − r free to permute: each r-fold intersection has (n − r)! permutations.</li><li>There are C(n, r) choices of which r, and C(n, r)(n − r)! = n!/r!.</li><li>So Dₙ = n! − n!/1! + n!/2! − ⋯ + (−1)ⁿn!/n!, which factors into the formula.</li></ol>"],
["i","Derangements","What fraction of permutations are derangements when n is large?",
"<span class='f'>Dₙ/n! = 1 − 1/1! + 1/2! − ⋯ + (−1)ⁿ/n! → e⁻¹ ≈ 0.368</span><p>That’s the Taylor series e⁻¹ = Σ (−1)ᵏ/k!. So about <b>37%</b> of random permutations have no fixed point, almost regardless of n.</p>"],
["i","Hat-check problem","In a random permutation of 1, …, n, what is the expected number of i in position i?",
"<ol><li>Xᵢ = 1 if i is in position i, else 0. The count is X₁ + ⋯ + Xₙ.</li><li>E(Xᵢ) = (n − 1)!/n! = <b>1/n</b>: fix i, then permute the other n − 1 numbers.</li><li>Linearity: E = n · 1/n = <b>1</b>, for every n.</li></ol><p class='ex'>Much easier than derangements: expected values need only linearity, not inclusion–exclusion.</p>"],
["i","Onto functions","How many onto functions are there from an m-element set to an n-element set?",
"<span class='f'>Σ from r = 0 to n of (−1)ʳ C(n, r)(n − r)ᵐ = nᵐ − C(n,1)(n−1)ᵐ + C(n,2)(n−2)ᵐ − ⋯</span><span class='lb'>Why</span><ol><li>All functions: nᵐ (each of the m inputs picks one of n outputs).</li><li>Aᵢ = functions that <b>miss</b> output i. Onto = nᵐ − |A₁ ∪ ⋯ ∪ Aₙ|.</li><li>Missing r chosen outputs leaves n − r choices per input: (n − r)ᵐ functions, and C(n, r) ways to choose the r.</li></ol>"],
["i","Onto functions","Rosen: how many onto functions from a 5-element set to a 3-element set?",
"<span class='f'>3⁵ − 3·2⁵ + 3·1⁵ = 243 − 96 + 3 = 150</span><p><b>150.</b> The last term C(3, 3)·0⁵ = 0.</p>"],
["i","Onto functions","How many onto functions from a 4-element set to a 2-element set?",
"<span class='f'>2⁴ − 2·1⁴ = 14</span><p>All 16 functions except the 2 constant ones.</p>"],
// ================= QUIZ 7: RELATIONS (Lecture 23, Rosen 9.1) =================
["l","Relations","What is a binary relation from A to B?",
"<span class='f'>R ⊆ A × B</span><p>A relation is just a <b>set of ordered pairs</b> (a, b) with a ∈ A and b ∈ B. Write <b>aRb</b> when (a, b) ∈ R. Any set of pairs counts, with or without a pattern.</p><span class='lb'>Examples</span><ul><li>A = {1, 2, 3}, B = {a, b, c, d}, R = {(1,a), (1,b), (2,c), (2,d)}: 1Ra true, 3Ra false.</li><li>Classes and classrooms: Math 55 R Wheeler 150.</li><li>Web pages: aRb if page a links to page b.</li></ul><p class='trap'>Order matters: aRb doesn’t mean bRa.</p>"],
["l","Relations","Give the standard examples of relations on numbers and on sets.",
"<ul><li><b>Numbers:</b> =, &lt;, ≤ on ℝ; divisibility a | b; congruence a ≡ b (mod m); relatively prime (gcd(a, b) = 1).</li><li><b>Sets:</b> “element of” ∈ from A to P(A); subset ⊆ on P(C).</li><li><b>Empty relation</b> ∅: nothing is related. <b>Complete relation</b> A × B: everything is related.</li><li><b>Graph of a function f</b>: {(a, b) : f(a) = b}. For f(x) = x²: 2R4 is true, 4R2 is false.</li></ul>"],
["l","Relations","What is a relation on a set A, and how do you draw one?",
"<p>A relation on A is a relation from A to itself: a subset of A × A.</p><span class='lb'>Arrow diagram</span><p>Draw a dot for each element, an arrow a → b whenever aRb, and a <b>loop</b> at a whenever aRa.</p><p class='ex'>Running example: R = {(1,1), (1,2), (2,2), (1,3), (2,3)} on {1, 2, 3}: loops at 1 and 2, arrows 1→2, 1→3, 2→3.</p>"],
["l","Reflexive","When is a relation reflexive? Is R = {(1,1), (1,2), (2,2), (1,3), (2,3)} on {1, 2, 3} reflexive?",
"<span class='f'>reflexive: aRa for every a ∈ A</span><p>In the diagram, a loop at <b>every</b> dot. To show it fails, find one a with a R̸ a.</p><p><b>R is not reflexive</b>: (3, 3) ∉ R.</p>"],
["l","Reflexive","Which are reflexive: ⊆, divisibility on positive integers, congruence mod m, gcd(a, b) = 1, gcd(a, b) ≠ 1?",
"<ul><li>⊆: <b>yes</b>, every set is a subset of itself.</li><li>|: <b>yes</b>, a | a.</li><li>≡ (mod m): <b>yes</b>, a ≡ a.</li><li>gcd = 1: <b>no</b>, gcd(2, 2) = 2.</li><li>gcd ≠ 1: <b>no</b>, gcd(1, 1) = 1.</li></ul><p class='trap'>A relation and its opposite can both fail to be reflexive. One failing element is enough.</p>"],
["l","Symmetric & antisymmetric","Define symmetric and antisymmetric. Are they opposites?",
"<span class='f'>symmetric: aRb ⟹ bRa<br>antisymmetric: aRb and bRa ⟹ a = b</span><p><b>Symmetric:</b> every arrow has a return arrow. <b>Antisymmetric:</b> no two-way arrows between <b>different</b> elements (loops are fine).</p><p class='trap'>Not opposites. “Antisymmetric” is not “not symmetric”. A relation can be both (=), neither, or just one.</p>"],
["l","Symmetric & antisymmetric","Is R = {(1,1), (1,2), (2,2), (1,3), (2,3)} symmetric? Antisymmetric?",
"<p><b>Not symmetric:</b> 1R2 but 2 R̸ 1.</p><p><b>Antisymmetric:</b> there is no pair of different elements with arrows both ways.</p>"],
["l","Symmetric & antisymmetric","Symmetric? Antisymmetric? ≤ on ℝ, ⊆, divisibility on ℤ⁺, gcd = 1, congruence mod 3.",
"<ul><li>≤: not symmetric (1 ≤ 3, 3 ≰ 1); <b>antisymmetric</b>.</li><li>⊆: not symmetric; <b>antisymmetric</b> (A ⊆ B and B ⊆ A ⟹ A = B).</li><li>| on ℤ⁺: not symmetric (2 | 4, 4 ∤ 2); <b>antisymmetric</b>.</li><li>gcd = 1: <b>symmetric</b>; not antisymmetric (2R3, 3R2, 2 ≠ 3).</li><li>≡ mod 3: <b>symmetric</b>; not antisymmetric (1 ≡ 4 and 4 ≡ 1).</li></ul><p class='trap'>Divisibility on all of ℤ is <b>not</b> antisymmetric: 2 | −2 and −2 | 2.</p>"],
["l","Transitive","When is a relation transitive, and how do you check a finite one?",
"<span class='f'>transitive: aRb and bRc ⟹ aRc</span><p>In the diagram: any two-step path a → b → c needs a direct arrow a → c.</p><span class='lb'>How to check</span><ol><li>For each (a, b) in R, find every (b, c) in R starting where it ends.</li><li>Check (a, c) ∈ R. One missing pair disproves it.</li></ol><p class='ex'>Running example: 1R2 and 2R3, and 1R3 ✓; the other chains use loops. <b>Transitive.</b></p>"],
["l","Transitive","Is R = {(1, 2), (2, 1)} on {1, 2} transitive?",
"<p><b>No.</b> 1R2 and 2R1 would require 1R1, which is missing (and 2R2 too).</p><p class='trap'>Watch for chains that come back to where they started: they force loops.</p>"],
["l","Transitive","Transitive? ≤, ⊆, divisibility, congruence mod m, gcd = 1, gcd ≠ 1.",
"<ul><li>≤, ⊆, |, ≡ (mod m): all <b>transitive</b>.</li><li>gcd = 1: <b>not</b>: 2R3 and 3R4, but gcd(2, 4) = 2.</li><li>gcd ≠ 1: <b>not</b>: 2S6 and 6S3, but gcd(2, 3) = 1.</li></ul>"],
["l","Properties","Fill in reflexive / symmetric / antisymmetric / transitive for =, <, ≤, ⊆, | (ℤ⁺), ≡ (mod m), gcd = 1.",
"<ul><li><b>=</b>: R S A T (all four).</li><li><b>&lt;</b>: not R, not S, A, T.</li><li><b>≤, ⊆, |</b>: R, not S, A, T.</li><li><b>≡ mod m</b>: R, S, not A, T.</li><li><b>gcd = 1</b> (and gcd ≠ 1): not R, S, not A, not T.</li></ul><p class='ex'>&lt; is antisymmetric <b>vacuously</b>: a &lt; b and b &lt; a never both happen.</p>"],
["l","Properties","Which relations are both symmetric and antisymmetric? Give one that is neither symmetric nor transitive.",
"<p><b>Both:</b> exactly the relations with no arrows between different elements, i.e. only loops. Examples: = and ∅. If aRb with a ≠ b, symmetry gives bRa, and then antisymmetry would force a = b, a contradiction.</p><p><b>Neither symmetric nor transitive:</b> {(1, 2), (2, 3)} on {1, 2, 3}: 1R2 but 2 R̸ 1, and 1R2, 2R3 but 1 R̸ 3.</p>"],
["l","Counting relations","If |A| = n, how many relations, reflexive relations and symmetric relations are there on A?",
"<ul><li><b>All:</b> A × A has n² pairs, each in or out: <b>2^(n²)</b>.</li><li><b>Reflexive:</b> the n loops (a, a) are forced in, and the other n² − n pairs are free: <b>2^(n² − n)</b>.</li><li><b>Symmetric:</b> the n loops are free, and each of the C(n, 2) pairs {a, b} is decided together (both in or both out): <b>2^(n + C(n,2)) = 2^(n(n+1)/2)</b>.</li></ul><p class='ex'>n = 2: 16, 4, 8.</p>"],
["l","Counting relations","Rosen: how many antisymmetric relations on an n-element set?",
"<span class='f'>2ⁿ · 3^C(n,2)</span><p>The loops are free (2 choices each). For each pair {a, b} of different elements there are 3 allowed options: only (a, b), only (b, a), or neither. Both is forbidden.</p><p class='ex'>n = 2: 4 · 3 = 12.</p>"],
["l","Composition","What is the composition S ∘ R, and how do you compute it?",
"<span class='f'>S ∘ R = {(a, c) : there is b with aRb and bSc}</span><p>R goes from A to B, S from B to C; S ∘ R goes from A to C. Do <b>R first</b>, then S, just like g ∘ f for functions.</p><span class='lb'>How</span><ol><li>For each (a, b) in R, find every pair in S starting with b.</li><li>Each (b, c) found gives (a, c).</li></ol><p class='trap'>S ∘ R and R ∘ S are usually different.</p>"],
["l","Composition","R = {(1,a), (1,b), (2,c)} and S = {(a,x), (b,y), (c,x)}. Find S ∘ R.",
"<p>1 → a → x, 1 → b → y, 2 → c → x.</p><span class='f'>S ∘ R = {(1, x), (1, y), (2, x)}</span>"],
["l","Composition","Lecture 23: R is “gcd(a, b) = 1” on positive integers. What is R ∘ R?",
"<p><b>Every pair (a, b)</b>, even (2, 2).</p><p>For any a, b pick a prime p bigger than both. Then gcd(a, p) = 1 and gcd(p, b) = 1, so aRp and pRb, hence a (R ∘ R) b.</p>"],
["l","Powers","What are the powers Rⁿ of a relation, and what does a Rⁿ b mean?",
"<span class='f'>R¹ = R, &nbsp;Rⁿ⁺¹ = Rⁿ ∘ R</span><p>a Rⁿ b exactly when there’s a <b>path of length n</b> from a to b: a = a₀ → a₁ → ⋯ → aₙ = b, each step an arrow of R.</p><span class='lb'>Rosen 9.1</span><p>R is transitive ⟺ Rⁿ ⊆ R for every n ≥ 1: paths of any length must already be direct arrows.</p>"],
["l","Powers","Lecture 23: R = {(1,2), (2,3), (3,1)} on {1, 2, 3}. Find R², R³, R⁴.",
"<p>R is the cycle 1 → 2 → 3 → 1.</p><ol><li>R² (two steps): <b>{(1,3), (2,1), (3,2)}</b>.</li><li>R³ (three steps, back home): <b>{(1,1), (2,2), (3,3)}</b>.</li><li>R⁴ = <b>R</b> again.</li></ol><p class='ex'>So the powers repeat every 3: R = R⁴ = R⁷ = ⋯, R² = R⁵ = ⋯, R³ = R⁶ = ⋯</p>"],
];

const KEY='m55-quiz5-cards-v2';
let st={known:{},deck:'all'}; try{ st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
const card=document.getElementById('card'), deckSel=document.getElementById('deck');
// Quiz 6 deck was rebuilt (v2): clear old Quiz 6 progress once, since card positions changed.
const Q6=C.findIndex(c=>'erb'.includes(c[0]));
if(!st.q6v2){ Object.keys(st.known).forEach(k=>{ if(+k>=Q6) delete st.known[k]; }); st.deck='q6'; st.q6=1; st.q6v2=1; save(); }
if(!st.q7){ st.deck='q7'; st.q7=1; save(); }
deckSel.value=st.deck;
let queue=[], cur=null, shown=false;
const GROUPS={q6:['e','r','b'],q7:['r','k','i']};
const ids=()=>C.map((c,i)=>i).filter(i=>st.deck==='all'||(GROUPS[st.deck]||[st.deck]).includes(C[i][0]));
function build(){ queue=ids().filter(i=>!st.known[i]); cur=queue.shift(); shown=false; render(); }
function render(){
  const all=ids(), done=all.filter(i=>st.known[i]).length;
  document.getElementById('bar').style.width=(all.length?100*done/all.length:0)+'%';
  document.getElementById('count').textContent=done+' of '+all.length+' learned';
  document.getElementById('left').textContent=cur==null?'':(queue.length+1)+' left in this pass';
  if(cur==null){
    card.innerHTML='<div class="done"><h2>All learned ✓</h2><p>You got every card in this deck.</p><button class="show" type="button" id="again-all">Go through them again</button></div>';
    document.getElementById('again-all').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
    return;
  }
  const c=C[cur];
  card.innerHTML='<span class="tag">'+c[1]+'</span><div class="front">'+c[2]+'</div>'+
    (shown?'<div class="back">'+c[3]+'</div><div class="btns"><button type="button" class="again">Again</button><button type="button" class="got">Got it</button></div>'
          :'<p class="hint">Answer in your head first, then check.</p><button type="button" class="show">Show answer</button>');
  if(shown){
    card.querySelector('.again').onclick=()=>{ queue.splice(Math.min(3,queue.length),0,cur); next(); };
    card.querySelector('.got').onclick=()=>{ st.known[cur]=1; save(); next(); };
  } else card.querySelector('.show').onclick=()=>{ shown=true; render(); };
}
function next(){ cur=queue.length?queue.shift():null; shown=false; render(); window.scrollTo(0,0); }
deckSel.onchange=()=>{ st.deck=deckSel.value; save(); build(); };
document.getElementById('restart').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
document.addEventListener('keydown',e=>{
  if(cur==null) return;
  if(!shown&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); shown=true; render(); }
  else if(shown&&e.key==='1') card.querySelector('.again').click();
  else if(shown&&(e.key==='2'||e.key===' ')){ e.preventDefault(); card.querySelector('.got').click(); }
});
build();
</script>
