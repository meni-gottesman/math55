<script>
// Each card: [section, topic, front, back]. Cards go in teaching order; the back explains from scratch.
const C=[
// ---------- COUNTING ----------
["c","Product rule","What does the product rule say?","<p>If you make a choice in <b>steps</b>, multiply the number of options at each step.</p><span class='f'>n₁ ways, then n₂ ways for each ⟹ n₁ · n₂ total</span><p class='ex'><b>Example:</b> a time slot Mon–Fri at 1, 2, 3 or 4 pm: 5 days × 4 times = <b>20</b>.</p>"],
["c","Product rule","How many California-style license plates: 1 digit, then 3 letters, then 3 digits?","<span class='f'>10 · 26 · 26 · 26 · 10 · 10 · 10 = 175,760,000</span><p>Each position is a step: 10 choices for a digit, 26 for a letter.</p>"],
["c","Product rule","3 new faculty, 12 offices, everyone gets a different office. How many ways?","<span class='f'>12 · 11 · 10</span><p>The first person has 12 choices, the next has 11 (one is taken), then 10.</p><p class='ex'>Same idea: strings using all 26 letters once each = 26 · 25 ⋯ 1 = <b>26!</b></p>"],
["c","Product rule","How many subsets does a set with n elements have? Why?","<span class='f'>2ⁿ</span><p>Go element by element: each one is either <b>in</b> or <b>out</b>, 2 choices each, so 2 · 2 ⋯ 2 = 2ⁿ.</p>"],
["c","Product rule","How many one-to-one functions are there from a set of size n to a set of size m (m ≥ n)?","<span class='f'>m(m − 1)(m − 2) ⋯ (m − n + 1)</span><p>Pick the outputs one at a time. One-to-one means no output repeats, so each new input has one fewer option.</p>"],
["c","Sum rule","What does the sum rule say?","<p>If the possibilities split into cases that <b>don’t overlap</b>, add the counts.</p><span class='f'>A, B disjoint ⟹ |A ∪ B| = |A| + |B|</span><p class='ex'><b>Example:</b> passwords of 6 or 8 digits: 10⁶ + 10⁸. No password has both lengths.</p>"],
["c","Division rule","What is the division rule?","<p>If your method produces <b>every outcome exactly d times</b>, divide the count by d.</p><span class='f'>answer = (ways the method runs) / d</span><p>Use it when your method “overcounts” by putting things in an order that doesn’t matter.</p>"],
["c","Division rule","How many 2-element subsets does {1, …, 9} have, using the division rule?","<span class='f'>9 · 8 / 2 = 36</span><p>Pick x (9 ways), then y (8 ways). But {x, y} = {y, x}, so each subset was made twice. Divide by 2.</p>"],
["c","Division rule","8 people sit around a round table. Two seatings are the same if everyone has the same neighbors (rotations count as the same). How many seatings?","<span class='f'>8! / 8 = 7! = 5040</span><p>There are 8! ways to fill the seats, but each arrangement shows up in 8 rotations. Divide by 8.</p>"],
["c","Inclusion–exclusion","What is inclusion–exclusion for two sets, and why does it work?","<span class='f'>|A ∪ B| = |A| + |B| − |A ∩ B|</span><p>For “A <b>or</b> B”: adding |A| + |B| counts the things in <b>both</b> twice, so subtract them once.</p><p class='ex'>|A| means the number of elements in A.</p>"],
["c","Inclusion–exclusion","How many integers from 1 to 100 are divisible by 2 or by 3?","<span class='f'>50 + 33 − 16 = 67</span><p>Divisible by 2: 50. By 3: ⌊100/3⌋ = 33. By both = divisible by 6: ⌊100/6⌋ = 16.</p>"],
["c","Inclusion–exclusion","How many 4-bit strings start with 1 or end with 0?","<span class='f'>8 + 8 − 4 = 12</span><p>Start with 1: the other 3 bits are free, so 2³ = 8. End with 0: also 8. Both: 2 bits free, so 2² = 4.</p>"],
["c","Complement","When should you count the complement, and how?","<p>When “has the property” is messy, especially <b>“at least one”</b>. Count the ones <b>without</b> the property and subtract.</p><span class='f'># with = # total − # without</span>"],
["c","Complement","How many length-10 strings of uppercase letters contain at least one A?","<span class='f'>26¹⁰ − 25¹⁰</span><p>Total strings: 26¹⁰. With <b>no</b> A, each position has 25 choices: 25¹⁰. Subtract.</p>"],
["c","Permutations & combinations","What are a permutation, an r-permutation, and an r-combination?","<p><b>Permutation:</b> an <b>ordered</b> arrangement of all the objects.</p><p><b>r-permutation:</b> an ordered arrangement of r of them.</p><p><b>r-combination:</b> an <b>unordered</b> choice of r objects, i.e. a subset of size r.</p><p class='ex'>2-permutations of {A, B, C}: (A, B), (B, A), … ; 2-combinations: {A, B}, {A, C}, {B, C}.</p>"],
["c","Permutations & combinations","What is P(n, r), and why?","<span class='f'>P(n, r) = n! / (n − r)! = n(n − 1) ⋯ (n − r + 1)</span><p>Product rule: n choices for the first spot, n − 1 for the second, … , r spots in all. A set of n objects has n! full permutations.</p>"],
["c","Permutations & combinations","What is C(n, r), and why is it P(n, r) / r!?","<span class='f'>C(n, r) = n! / (r! (n − r)!)</span><p>Picking r things in order gives P(n, r). But each set of r things appears in r! different orders, so by the division rule divide by r!.</p>"],
["c","Permutations & combinations","What is 0!? And C(n, 0)?","<span class='f'>0! = 1, so C(n, 0) = C(n, n) = 1</span><p>There is exactly one way to choose nothing, and one way to choose everything.</p>"],
["c","Permutations & combinations","How do you tell whether to use P (order matters) or C (order doesn’t)?","<p><b>Swap test:</b> if you swap two of the chosen items, do you get a different outcome?</p><p>Yes ⟹ order matters ⟹ P. No ⟹ C.</p><p class='ex'><b>Example:</b> dealing one card each to 4 named players is P(52, 4) = 52·51·50·49 (who gets which matters). A 5-card hand is C(52, 5) = 2,598,960.</p>"],
["c","Pigeonhole","State the pigeonhole principle and why it’s true.","<span class='f'>k + 1 or more objects in k boxes ⟹ some box has at least 2</span><p><b>Why:</b> if every box had at most 1, there would be at most k objects. That’s a contradiction.</p>"],
["c","Pigeonhole","How do you write a pigeonhole proof?","<p>1. Say what the <b>pigeons</b> (objects) are, and how many.</p><p>2. Say what the <b>holes</b> (boxes) are, and that there are fewer.</p><p>3. Give the rule that puts each pigeon in a hole.</p><p>4. Conclude two pigeons share a hole, and explain what that means.</p>"],
["c","Pigeonhole","Show that any 27 English words include two that start with the same letter.","<p>Pigeons: the 27 words. Holes: the 26 possible first letters. Put each word in the hole of its first letter.</p><p>27 &gt; 26, so some hole has 2 words, which start with the same letter.</p>"],
["c","Pigeonhole","Why can’t a function f : A → B be one-to-one if |A| &gt; |B|?","<p>Pigeons: elements of A. Holes: elements of B. Put a in hole f(a).</p><p>More pigeons than holes, so two different a₁, a₂ land in the same hole: f(a₁) = f(a₂). So f isn’t one-to-one.</p>"],
["c","Pigeonhole","Pick any n + 1 numbers from {1, …, 2n}. Why must one divide another?","<p>Write each as 2ᵏ · (odd number). Use the <b>odd part</b> as the hole. There are only n odd numbers from 1 to 2n.</p><p>n + 1 pigeons, n holes, so two chosen numbers share an odd part b: 2ⁱb and 2ʲb. The smaller divides the larger.</p>"],
["c","Pigeonhole","Why does every positive integer n have a multiple written only with 0s and 1s?","<p>Take 1, 11, 111, …, up to n + 1 ones. Look at their remainders mod n: n + 1 numbers, only n remainders.</p><p>So two have the same remainder. Their difference (bigger − smaller) is divisible by n and looks like 11…100…0.</p>"],
["c","Pigeonhole","Why can no compression algorithm make every n-bit file shorter?","<p>There are 2ⁿ files of length n (pigeons), but only 2⁰ + 2¹ + ⋯ + 2ⁿ⁻¹ = 2ⁿ − 1 shorter files (holes).</p><p>So two files compress to the same file, and decompression can’t tell them apart.</p>"],
["c","Stars and bars","How many ways can you choose r identical items from n types? Why?","<span class='f'>C(r + n − 1, r) = C(r + n − 1, n − 1)</span><p>Write r stars and n − 1 bars in a row. The bars split the stars into n groups (one per type). So you’re choosing which r of the r + n − 1 spots are stars.</p>"],
["c","Stars and bars","How many ways to pick 8 bills from $1, $5, $10, $20 (same-type bills identical)?","<span class='f'>C(11, 3) = 165</span><p>8 stars + 3 bars = 11 symbols. Choose where the 3 bars go.</p><p class='ex'>★★|★★★★||★★ = two $1, four $5, no $10, two $20.</p>"],
["c","Stars and bars","How many solutions does x₁ + x₂ + x₃ = 17 have with every xᵢ ≥ 0?","<span class='f'>C(19, 2) = 171</span><p>17 stars, 2 bars (3 variables − 1). Each arrangement gives one solution.</p>"],
["c","Stars and bars","How many solutions does y₁ + y₂ + y₃ = 14 have with every yᵢ ≥ 1?","<span class='f'>C(13, 2) = 78</span><p>Give each variable its 1 up front: zᵢ = yᵢ − 1 ≥ 0. Then z₁ + z₂ + z₃ = 11, so 11 stars and 2 bars.</p><p class='ex'><b>Rule:</b> with lower bounds, subtract them from the total first.</p>"],
["c","Choosing r from n","Choosing r things from n: what are the four formulas?","<p><b>Order matters, no repeats:</b> P(n, r) = n!/(n − r)!</p><p><b>Order matters, repeats allowed:</b> nʳ</p><p><b>Order doesn’t matter, no repeats:</b> C(n, r)</p><p><b>Order doesn’t matter, repeats allowed:</b> C(n + r − 1, r) (stars and bars)</p>"],
["c","Repeated letters","How many arrangements of n objects when some are identical? Why?","<span class='f'>n! / (n₁! n₂! ⋯ nₖ!)</span><p>Arrange as if every object were different (n!). Swapping identical copies doesn’t change anything, so divide by each type’s count!.</p><p class='ex'><b>SENSELESSNESS</b> (6 S, 4 E, 2 N, 1 L): 13!/(6!·4!·2!·1!) = 180,180.</p>"],
["c","Combinatorial proofs","What is a combinatorial proof, and what’s the template?","<p>Prove two expressions are equal by showing they <b>count the same collection</b> in two ways.</p><p>1. Name the collection. 2. Count it one way ⟹ left side. 3. Count it another way ⟹ right side. 4. Same collection, so the two sides are equal.</p>"],
["c","Combinatorial proofs","Prove C(n, r) = C(n, n − r) combinatorially.","<p>Choosing the r things you <b>take</b> is the same as choosing the n − r things you <b>leave</b>.</p><p>Each choice of one matches exactly one choice of the other (a bijection).</p>"],
["c","Combinatorial proofs","Prove the committee–chair identity k · C(n, k) = n · C(n − 1, k − 1).","<p>Count committees of k people from n, with one member as chair.</p><p><b>Way 1:</b> pick the committee, C(n, k), then the chair from it, k.</p><p><b>Way 2:</b> pick the chair first, n, then the other k − 1 members from the remaining n − 1.</p>"],
["c","Combinatorial proofs","State and prove Pascal’s identity.","<span class='f'>C(n + 1, k) = C(n, k − 1) + C(n, k)</span><p>Choose k people from n + 1, one of whom is Alice.</p><p>Alice is in: pick k − 1 more from the other n, C(n, k − 1). Alice is out: pick all k from the other n, C(n, k).</p>"],
["c","Combinatorial proofs","Why is C(n, 0) + C(n, 1) + ⋯ + C(n, n) = 2ⁿ?","<p>Both sides count <b>all subsets</b> of an n-element set.</p><p>Left: group the subsets by size k. Right: each element is in or out.</p><p class='ex'>Or: set x = y = 1 in the binomial theorem.</p>"],
["c","Pascal’s triangle","How is Pascal’s triangle built, and what are its rows?","<p>Each inside number is the sum of the two above it (that’s Pascal’s identity). Row n lists C(n, 0), …, C(n, n).</p><span class='f'>1<br>1 1<br>1 2 1<br>1 3 3 1<br>1 4 6 4 1</span>"],
["c","Combinatorial proofs","If p is prime and 0 &lt; k &lt; p, why does p divide C(p, k)?","<p>From the committee–chair identity: k · C(p, k) = p · C(p − 1, k − 1). So p divides k · C(p, k).</p><p>p is prime and doesn’t divide k (since 0 &lt; k &lt; p), so p divides C(p, k).</p>"],
["c","Binomial theorem","State the binomial theorem.","<span class='f'>(x + y)ⁿ = Σ<sub>j=0</sub><sup>n</sup> C(n, j) xⁿ⁻ʲ yʲ</span><p class='ex'>(x + y)³ = x³ + 3x²y + 3xy² + y³</p>"],
["c","Binomial theorem","Why does C(n, j) show up in the binomial theorem?","<p>(x + y)ⁿ = (x + y)(x + y) ⋯ (x + y). Each term comes from picking x or y from <b>every</b> factor.</p><p>You get xⁿ⁻ʲyʲ exactly when y is picked from j of the n factors, and there are C(n, j) ways to choose which ones.</p>"],
["c","Binomial theorem","What is the coefficient of x³y² in (2x − y)⁵?","<span class='f'>C(5, 2) · 2³ · (−1)² = 10 · 8 · 1 = 80</span><p>Think (A + B)⁵ with A = 2x, B = −y. You need B² for y², which goes with A³.</p><p class='ex'><b>Trap:</b> raise the <b>whole</b> term: (2x)³ = 8x³, (−y)² = +y².</p>"],
// ---------- PROBABILITY ----------
["p","Basics","What are an experiment, a sample space, and an event?","<p><b>Experiment:</b> something with a random result (flip two coins).</p><p><b>Sample space S:</b> the set of all outcomes ({HH, HT, TH, TT}).</p><p><b>Event E:</b> any subset of S (“both the same” = {HH, TT}).</p>"],
["p","Basics","If all outcomes are equally likely, what is p(E)?","<span class='f'>p(E) = |E| / |S|</span><p>“Counting with a denominator”: count what you want, divide by everything.</p><p class='ex'><b>Two dice sum to 7:</b> 6 of 36 outcomes ⟹ <b>1/6</b>. <b>A number from 1–1000 divisible by 5:</b> 200/1000 = <b>1/5</b>.</p>"],
["p","Basics","What is a probability distribution (when outcomes aren’t equally likely)?","<p>Each outcome s gets a number p(s) with 0 ≤ p(s) ≤ 1, and all of them add up to 1. Then:</p><span class='f'>p(E) = sum of p(s) over s in E</span><p class='ex'>The <b>uniform</b> distribution on n outcomes is p(s) = 1/n each.</p>"],
["p","Basics","A loaded die has p(6) = 1/2 and every other face 1/10. What is p(even)?","<span class='f'>p(2) + p(4) + p(6) = 1/10 + 1/10 + 1/2 = 7/10</span><p>With unequal outcomes, <b>add</b> the probabilities of the outcomes in E. Don’t count them.</p>"],
["p","Poker","What is the probability a 5-card hand has all 5 cards in the same suit?","<span class='f'>4 · C(13, 5) / C(52, 5)</span><p>Pick the suit (4), then 5 of its 13 cards. All C(52, 5) hands are equally likely.</p>"],
["p","Poker","How many full houses (3 of one rank + 2 of another)?","<span class='f'>13 · 12 · C(4, 3) · C(4, 2) = 3744</span><p>Rank for the triple (13), rank for the pair (12), which 3 suits, which 2 suits.</p><p class='ex'>13 · 12 (not C(13, 2)) because the two ranks play <b>different roles</b>.</p>"],
["p","Poker","How many two-pair hands? Why C(13, 2) and not 13 · 12?","<span class='f'>C(13, 2) · C(4, 2)² · 44</span><p>Choose the 2 pair ranks <b>together</b>: the two pairs play the same role, so 13 · 12 would count each hand twice. Then 2 suits for each pair, then the 5th card from the other 44 cards.</p>"],
["p","Complement & union","What is the complement rule? Use it: 5 fair coins, p(at least one head)?","<span class='f'>p(not E) = 1 − p(E)</span><p>Only “all tails” has no head: 1 of 2⁵ outcomes. So p = 1 − 1/32 = <b>31/32</b>.</p>"],
["p","Complement & union","What is the union rule? Use it: a number from 1–100, p(divisible by 2 or 5)?","<span class='f'>p(E ∪ F) = p(E) + p(F) − p(E ∩ F)</span><p>(50 + 20 − 10)/100 = <b>3/5</b>. “Both” means divisible by 10.</p><p class='ex'>40% rain, 30% snow, 10% both ⟹ rain or snow = 60%.</p>"],
["p","Union bound","What is the union bound, and why is it always true?","<span class='f'>p(E₁ ∪ ⋯ ∪ Eₙ) ≤ p(E₁) + ⋯ + p(Eₙ)</span><p>Adding the probabilities counts overlaps more than once, so the sum can only be too big, never too small. Use it when the exact union is hard.</p>"],
["p","Conditional","What is p(E | F), and what does it mean?","<span class='f'>p(E | F) = p(E ∩ F) / p(F) (needs p(F) &gt; 0)</span><p>“Probability of E <b>given</b> F happened.” Once you know F, F is the whole world: what fraction of it is also E?</p>"],
["p","Conditional","Two fair coins. p(both heads | at least one head)? And p(2nd heads | 1st heads)?","<p><b>At least one head:</b> F = {HH, HT, TH}, E ∩ F = {HH} ⟹ <b>1/3</b>.</p><p><b>1st heads:</b> F = {HH, HT}, E ∩ F = {HH} ⟹ <b>1/2</b>.</p><p class='ex'>They sound alike but condition on different F.</p>"],
["p","Conditional","What is the multiplication rule?","<span class='f'>p(E ∩ F) = p(E | F) · p(F)</span><p>It’s the definition of conditional probability, rearranged. Use it to build “first this, then that” probabilities.</p>"],
["p","Total probability","State the law of total probability and the idea behind it.","<p>If F₁, …, Fₙ are disjoint cases that cover S:</p><span class='f'>p(E) = p(E | F₁)p(F₁) + ⋯ + p(E | Fₙ)p(Fₙ)</span><p>Split into cases, find E inside each case, and weight by how likely the case is. Two cases: p(E) = p(E | F)p(F) + p(E | not F)p(not F).</p>"],
["p","Total probability","Monty Hall: 3 doors, 1 car. You pick, the host opens another door showing a goat. Switch?","<p><b>Yes. Switching wins with probability 2/3.</b></p><p>G = your first pick was a goat (p = 2/3). If G, switching wins for sure; if not, it loses.</p><span class='f'>p(win) = 1 · ⅔ + 0 · ⅓ = 2/3</span>"],
["p","Total probability","Survey: flip a coin; heads means say “yes”, tails means answer honestly. 60% say yes. What fraction of honest answers are yes?","<span class='f'>0.6 = 1 · ½ + x · ½ ⟹ x = 20%</span><p>Law of total probability over the cases heads and tails.</p>"],
["p","Independence","When are E and F independent?","<span class='f'>p(E ∩ F) = p(E) · p(F)</span><p>If p(F) &gt; 0, that’s the same as p(E | F) = p(E): knowing F tells you nothing about E.</p><p class='ex'><b>To check:</b> compute p(E), p(F), p(E ∩ F) and compare. Never assume it unless the problem says so.</p>"],
["p","Independence","Random 4-bit string. E = first bit is 1, F = even number of 1s. Independent?","<p>p(E) = 8/16 = ½, p(F) = 8/16 = ½.</p><p>E ∩ F = {1001, 1010, 1100, 1111} ⟹ 4/16 = ¼.</p><p>¼ = ½ · ½ ⟹ <b>independent</b>.</p>"],
["p","Independence","What’s the difference between pairwise and mutual independence?","<p><b>Pairwise:</b> every pair Eᵢ, Eⱼ satisfies the product rule.</p><p><b>Mutual:</b> the product rule holds for <b>every group</b>, including all of them at once.</p><p>Pairwise does <b>not</b> imply mutual.</p>"],
["p","Independence","Give the lecture’s example of events that are pairwise but not mutually independent.","<p>Alice, Bob and Charlotte each pick a random number from 1–100. E₁ = A, B match; E₂ = A, C match; E₃ = B, C match.</p><p>Each has probability 1/100, and any two together have 1/100², so they’re pairwise independent.</p><p>But E₁ and E₂ force E₃: p(all three) = 1/100² ≠ 1/100³.</p>"],
["p","Bernoulli trials","What are Bernoulli trials?","<p>Repeat a try n times, <b>independently</b>. Each try succeeds with probability p and fails with 1 − p.</p><p class='ex'>Count heads in n flips (p = ½), or count 1s in n die rolls (p = 1/6).</p>"],
["p","Bernoulli trials","What’s the probability of exactly k successes in n Bernoulli trials? Why?","<span class='f'>C(n, k) · pᵏ · (1 − p)ⁿ⁻ᵏ</span><p>One specific pattern of k successes and n − k failures has probability pᵏ(1 − p)ⁿ⁻ᵏ, since independent probabilities multiply. C(n, k) chooses which tries succeed.</p>"],
["p","Bernoulli trials","A coin with p(H) = ¼ is flipped 4 times. p(exactly 2 heads)? p(at least one head)?","<p>Exactly 2: C(4, 2)(¼)²(¾)² = 6 · 1/16 · 9/16 = <b>27/128</b>.</p><p>At least one: 1 − (¾)⁴ = <b>175/256</b> (complement).</p>"],
["p","Birthday paradox","n people with random birthdays (365 days). p(some two share)? What is it for n = 23?","<span class='f'>1 − (365 · 364 ⋯ (365 − n + 1)) / 365ⁿ</span><p>Complement: everyone different. Person 1 has 365 options, person 2 has 364, …</p><p>For n = 23 it’s about <b>50.7%</b>.</p>"],
["p","Birthday paradox","What’s the rule of thumb for collisions, and the lecture’s security example?","<p>Picking n items at random from d possibilities, p(two match) ≈ <b>C(n, 2)/d</b>. There are C(n, 2) pairs, each matching with probability 1/d (union bound).</p><p class='ex'>64-bit secrets (d = 2⁶⁴): just 2³² of them give about a 39% chance of a match.</p>"],
["p","Probabilistic method","What is the probabilistic method?","<p>To prove something with a property <b>exists</b>, build one at random and show the probability it has the property is <b>&gt; 0</b>.</p><p>Usual tool: the union bound, to show p(something goes wrong) &lt; 1.</p>"],
["p","Probabilistic method","10 clubs of 5 students each. Why can students be split into red and blue so no club is all one color?","<p>Assign each student by a fair coin flip. One club is all one color with probability 2/2⁵ = 1/16.</p><p>Union bound: p(some club is one color) ≤ 10/16 &lt; 1.</p><p>So p(no club is one color) &gt; 0, which means a good split exists.</p>"],
["p","Probabilistic method","Sketch the lecture’s probabilistic proof that there are infinitely many primes.","<p>If there were only m primes, there would be only 2ᵐ <b>squarefree</b> numbers. Pick x from 1 to n: p(squarefree) ≤ 2ᵐ/n, which is tiny for large n.</p><p>But by the union bound, p(not squarefree) ≤ 1/4 + 1/9 + 1/16 + ⋯ &lt; 1, so p(squarefree) stays bounded below by a positive constant. That’s a contradiction.</p>"],
["p","Bayes’ theorem","State Bayes’ theorem and where it comes from.","<span class='f'>p(F | E) = p(E | F) p(F) / p(E)</span><span class='f'>p(E) = p(E | F)p(F) + p(E | not F)p(not F)</span><p>Both p(F | E)p(E) and p(E | F)p(F) equal p(E ∩ F). Divide by p(E), and expand p(E) by total probability.</p>"],
["p","Bayes’ theorem","1% have a disease. The test is positive for 90% of the sick and wrongly positive for 10% of the healthy. p(sick | positive)?","<span class='f'>(0.9 · 0.01) / (0.9 · 0.01 + 0.1 · 0.99) = 0.009/0.108 ≈ 8.3%</span><p class='ex'><b>Check with 1000 people:</b> 10 sick, 9 test positive. 990 healthy, 99 test positive. Only 9 of 108 positives are real.</p>"],
["p","Bayes’ theorem","Someone loves to read. 99% of librarians and 40% of farmers do, and there are about 30 farmers per librarian. Librarian or farmer?","<span class='f'>p(librarian | reads) = 0.99 · 1 / (0.99 · 1 + 0.4 · 30) ≈ 7.6%</span><p><b>Farmer</b> is much more likely: there are so many more farmers.</p>"],
["p","Bayes’ theorem","What is the big trap Bayes’ theorem fixes?","<p>p(A | B) ≠ p(B | A). How common something is to begin with (the base rate, like 1%, or 30 farmers per librarian) matters a lot.</p>"]
];

const KEY='m55-quiz5-cards';
let st={known:{},deck:'all'}; try{ st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
const card=document.getElementById('card'), deckSel=document.getElementById('deck');
deckSel.value=st.deck;
let queue=[], cur=null, shown=false;
const ids=()=>C.map((c,i)=>i).filter(i=>st.deck==='all'||C[i][0]===st.deck);
function build(){ queue=ids().filter(i=>!st.known[i]); cur=queue.shift(); shown=false; render(); }
function render(){
  const all=ids(), done=all.filter(i=>st.known[i]).length;
  document.getElementById('bar').style.width=(all.length?100*done/all.length:0)+'%';
  document.getElementById('count').textContent=done+' of '+all.length+' learned';
  document.getElementById('left').textContent=cur==null?'':(queue.length+1)+' left in this pass';
  if(cur==null){
    card.innerHTML='<div class="done"><h2>All learned ✓</h2><p>You got every card in this deck.</p><button class="show" type="button" id="again-all">Go through them again</button></div>';
    document.getElementById('again-all').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
    return;
  }
  const c=C[cur];
  card.innerHTML='<span class="tag">'+c[1]+'</span><div class="front">'+c[2]+'</div>'+
    (shown?'<div class="back">'+c[3]+'</div><div class="btns"><button type="button" class="again">Again</button><button type="button" class="got">Got it</button></div>'
          :'<p class="hint">Answer in your head first, then check.</p><button type="button" class="show">Show answer</button>');
  if(shown){
    card.querySelector('.again').onclick=()=>{ queue.splice(Math.min(3,queue.length),0,cur); next(); };
    card.querySelector('.got').onclick=()=>{ st.known[cur]=1; save(); next(); };
  } else card.querySelector('.show').onclick=()=>{ shown=true; render(); };
}
function next(){ cur=queue.length?queue.shift():null; shown=false; render(); window.scrollTo(0,0); }
deckSel.onchange=()=>{ st.deck=deckSel.value; save(); build(); };
document.getElementById('restart').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
document.addEventListener('keydown',e=>{
  if(cur==null) return;
  if(!shown&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); shown=true; render(); }
  else if(shown&&e.key==='1') card.querySelector('.again').click();
  else if(shown&&(e.key==='2'||e.key===' ')){ e.preventDefault(); card.querySelector('.got').click(); }
});
build();
</script>
</body>
</html>
