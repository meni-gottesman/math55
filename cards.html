<script>
// Each card: [section, topic, front, back]. Cards go in teaching order; the back explains from scratch.
const C=[
// ================= COUNTING (Lectures 14–16) =================
["c","Product rule","What does the product rule say?",
"<span class='lb'>Meaning</span><p>If you build something in <b>steps</b>, and the number of options at each step doesn’t depend on what you picked earlier, multiply the counts.</p><span class='f'>n₁ ways, then n₂ ways for each of those ⟹ n₁ · n₂ total<br>k steps ⟹ n₁ · n₂ ⋯ nₖ</span><span class='lb'>Why</span><p>Picture a tree: n₁ branches, each splitting into n₂ more, so n₁ · n₂ leaves. Each leaf is one complete outcome.</p><span class='lb'>Example</span><p class='ex'>A weekday 1-hour slot starting at 1, 2, 3 or 4 pm: pick the day (5), then the time (4) ⟹ <b>20</b>.</p><p class='trap'>Only multiply when every outcome is built exactly <b>one</b> way. If two different step sequences give the same outcome, you’ve overcounted (see the division rule).</p>"],
["c","Product rule","How many California-style license plates are there: 1 digit, then 3 letters, then 3 digits?",
"<span class='f'>10 · 26 · 26 · 26 · 10 · 10 · 10 = 175,760,000</span><span class='lb'>How</span><ol><li>Treat each of the 7 positions as a step.</li><li>Digit positions have 10 options; letter positions have 26.</li><li>Repeats are allowed, so every position keeps its full count.</li><li>Multiply.</li></ol>"],
["c","Product rule","3 new faculty, 12 offices, everyone gets a different office. How many ways?",
"<span class='f'>12 · 11 · 10 = 1320</span><span class='lb'>How</span><p>Assign people one at a time. Alice has 12 options. Whatever she picked, Bob has 11 (hers is taken), then Charlotte has 10.</p><span class='lb'>Same idea</span><p class='ex'>Strings using each of the 26 letters exactly once: 26 · 25 ⋯ 2 · 1 = <b>26!</b> The options shrink by one each step because nothing can repeat.</p>"],
["c","Product rule","How many subsets does a set with n elements have? Why?",
"<span class='f'>2ⁿ</span><span class='lb'>Why</span><p>Build a subset by walking through the elements one at a time. Each one is either <b>in</b> or <b>out</b>: 2 choices, n times ⟹ 2 · 2 ⋯ 2 = 2ⁿ.</p><span class='lb'>Check</span><p class='ex'>{A, B} has 2² = 4 subsets: ∅, {A}, {B}, {A, B}.</p>"],
["c","Product rule","How many one-to-one functions are there from a set of size n to a set of size m (m ≥ n)?",
"<span class='f'>m(m − 1)(m − 2) ⋯ (m − n + 1)</span><span class='lb'>Why</span><p>Choose the outputs input by input. One-to-one means no two inputs share an output, so the 1st input has m options, the 2nd has m − 1, …, the nth has m − n + 1.</p><span class='lb'>Example</span><p class='ex'>From {1, 2, 3} to {a, b, c, d, e}: 5 · 4 · 3 = <b>60</b>.</p><p class='trap'>Without the one-to-one condition, each input has all m options: mⁿ functions.</p>"],
["c","Sum rule","What does the sum rule say?",
"<span class='lb'>Meaning</span><p>If the things you’re counting split into cases that <b>don’t overlap</b> and together cover everything, count each case and add.</p><span class='f'>A, B disjoint ⟹ |A ∪ B| = |A| + |B|</span><span class='lb'>Example</span><p class='ex'>Passwords that are 6 or 8 digits long: 10⁶ + 10⁸. A password can’t have both lengths, so nothing is counted twice.</p><p class='trap'>“And then” (steps) means multiply. “Or” (separate cases) means add. If the cases overlap, use inclusion–exclusion instead.</p>"],
["c","Sum rule","Count the 2-element subsets of {1, …, 9} using the sum rule (the lecture’s second method).",
"<span class='f'>8 + 7 + 6 + ⋯ + 1 = 36</span><span class='lb'>How</span><p>Split by the <b>smaller</b> element x. Then the larger one must be bigger than x.</p><ul><li>x = 1: 8 choices for the larger (2–9).</li><li>x = 2: 7 choices.</li><li>…</li><li>x = 8: 1 choice (9).</li></ul><p>The cases don’t overlap, so add them: 36. That matches 9 · 8 / 2 from the division rule, which is a good check.</p>"],
["c","Division rule","What is the division rule, and when do you need it?",
"<span class='lb'>Meaning</span><p>If your counting method produces <b>every outcome exactly d times</b>, divide by d.</p><span class='f'>answer = (number of ways the method runs) / d</span><span class='lb'>When</span><p>Usually when you pick things in order but order doesn’t matter, or when rotations or other symmetries count as the same.</p><p class='trap'>Every outcome must be overcounted by the <b>same</b> d. If some are counted 2 times and others 3 times, dividing doesn’t work.</p>"],
["c","Division rule","How many 2-element subsets does {1, …, 9} have, using the division rule?",
"<span class='f'>9 · 8 / 2 = 36</span><span class='lb'>How</span><ol><li>Pick a first element x (9 ways), then a different y (8 ways): 72 ordered picks.</li><li>The subset {x, y} comes up twice: once as (x, y), once as (y, x).</li><li>Every subset is counted exactly twice ⟹ divide by 2.</li></ol>"],
["c","Division rule","How many 7-element subsets does {1, …, 9} have, using the division rule?",
"<span class='f'>(9 · 8 · 7 · 6 · 5 · 4 · 3) / 7! = 36</span><span class='lb'>How</span><p>Picking 7 elements in order gives 9 · 8 ⋯ 3 ways. Each subset of 7 shows up in 7! orders (7 choices for which came first, 6 for second, …). Divide by 7!.</p><p class='ex'>This is exactly why C(n, r) = P(n, r) / r!. Also C(9, 7) = C(9, 2) = 36.</p>"],
["c","Division rule","8 people sit around a round table. Two seatings are the same if everyone has the same left and right neighbors. How many seatings?",
"<span class='f'>8! / 8 = 7! = 5040</span><span class='lb'>How</span><ol><li>Number the seats and fill them: 8! ways.</li><li>Rotating everyone one seat gives the same neighbors, so it’s the same seating. Each seating appears in 8 rotations.</li><li>Divide by 8.</li></ol>"],
["c","Inclusion–exclusion","What is inclusion–exclusion for two sets, and why does it work?",
"<span class='f'>|A ∪ B| = |A| + |B| − |A ∩ B|</span><span class='lb'>Why</span><p>A ∪ B means “in A <b>or</b> B”. Adding |A| + |B| counts anything in <b>both</b> twice, once in each. Subtract |A ∩ B| to count it once.</p><span class='lb'>Use it when</span><p>The question says <b>or</b> and the two groups can overlap.</p><p class='ex'>|A| means the number of elements in A.</p>"],
["c","Inclusion–exclusion","How many integers from 1 to 100 are divisible by 2 or by 3?",
"<span class='f'>50 + 33 − 16 = 67</span><span class='lb'>How</span><ol><li>A = divisible by 2: ⌊100/2⌋ = 50.</li><li>B = divisible by 3: ⌊100/3⌋ = 33.</li><li>A ∩ B = divisible by 2 and 3 = divisible by 6: ⌊100/6⌋ = 16.</li><li>|A ∪ B| = 50 + 33 − 16.</li></ol><p class='trap'>“Divisible by both a and b” means divisible by lcm(a, b), not a · b. Here they’re equal (6) only because 2 and 3 share no factor.</p>"],
["c","Inclusion–exclusion","How many 4-bit strings start with 1 or end with 0?",
"<span class='f'>8 + 8 − 4 = 12</span><span class='lb'>How</span><ul><li>Start with 1: the other 3 bits are free ⟹ 2³ = 8.</li><li>End with 0: the other 3 bits are free ⟹ 8.</li><li>Both: 2 bits are fixed, 2 free ⟹ 2² = 4.</li></ul>"],
["c","Inclusion–exclusion","8-character passwords from 10 digits, 26 letters and 10 special characters. How many have no special character or no digit?",
"<span class='f'>36⁸ + 36⁸ − 26⁸</span><span class='lb'>How</span><ol><li>No special character: 36 symbols allowed ⟹ 36⁸.</li><li>No digit: 26 + 10 = 36 symbols allowed ⟹ 36⁸.</li><li>Both (no special and no digit): letters only ⟹ 26⁸.</li><li>Inclusion–exclusion.</li></ol>"],
["c","Complement","When should you count the complement, and how?",
"<span class='f'># with property = # total − # without property</span><span class='lb'>When</span><p>When the property is messy to count directly, especially <b>“at least one”</b>. “At least one” splits into many cases (exactly 1, exactly 2, …), but its opposite, “none”, is usually one simple case.</p><span class='lb'>Why it works</span><p>Every object either has the property or doesn’t, never both.</p>"],
["c","Complement","How many length-10 strings of uppercase letters contain at least one A?",
"<span class='f'>26¹⁰ − 25¹⁰</span><span class='lb'>How</span><ol><li>Total strings: 26 choices per position ⟹ 26¹⁰.</li><li>Opposite of “at least one A” is “no A”: 25 choices per position ⟹ 25¹⁰.</li><li>Subtract.</li></ol><p class='trap'>Don’t try 10 · 26⁹ (“put an A somewhere, fill the rest”). Strings with several A’s get counted several times.</p>"],
["c","Permutations & combinations","What are a permutation, an r-permutation, and an r-combination?",
"<p><b>Permutation:</b> an <b>ordered</b> arrangement of all the objects.</p><p><b>r-permutation:</b> an ordered arrangement of exactly r of them.</p><p><b>r-combination:</b> an <b>unordered</b> choice of r of them, i.e. a subset of size r.</p><span class='lb'>Example with {A, B, C}</span><p class='ex'>Permutations: ABC, ACB, BAC, BCA, CAB, CBA (6). 2-permutations: AB, BA, AC, CA, BC, CB (6). 2-combinations: {A, B}, {A, C}, {B, C} (3).</p>"],
["c","Permutations & combinations","What is P(n, r), and why?",
"<span class='f'>P(n, r) = n! / (n − r)! = n(n − 1) ⋯ (n − r + 1)</span><span class='lb'>Why</span><p>Fill r spots in order with no repeats: n choices for the 1st spot, n − 1 for the 2nd, …, n − r + 1 for the rth. The product rule gives n(n − 1)⋯(n − r + 1), which is n! with the last (n − r)! factors cancelled.</p><p class='ex'>All n objects in order: P(n, n) = n!. Example: P(5, 3) = 5 · 4 · 3 = 60.</p>"],
["c","Permutations & combinations","What is C(n, r), and why is it P(n, r) / r!?",
"<span class='f'>C(n, r) = n! / (r! (n − r)!)</span><span class='lb'>Why</span><ol><li>Choose r things <b>in order</b>: P(n, r) ways.</li><li>Each set of r things shows up in r! different orders.</li><li>Division rule: divide by r!.</li></ol><p class='ex'>Example: C(5, 2) = 5 · 4 / 2 = 10. Also written as the binomial coefficient (n choose r).</p>"],
["c","Permutations & combinations","What is 0!? And C(n, 0) and C(n, n)?",
"<span class='f'>0! = 1, so C(n, 0) = C(n, n) = 1</span><p>There is exactly one way to choose nothing (the empty set) and one way to choose everything. Defining 0! = 1 makes the formula n!/(r!(n − r)!) give those answers.</p><p class='ex'>Lecture: P(5, 5) = 5!/0! = 120, and C(5, 0) = 1.</p>"],
["c","Permutations & combinations","How do you decide between P (order matters) and C (order doesn’t)?",
"<span class='lb'>Swap test</span><p>Take an outcome and swap two of the chosen items. Is it now a <b>different</b> outcome?</p><ul><li>Yes ⟹ order matters ⟹ P(n, r).</li><li>No ⟹ order doesn’t matter ⟹ C(n, r).</li></ul><span class='lb'>Lecture examples</span><p class='ex'><b>Deal one card each to Alice, Bob, Charlotte and Dave:</b> swapping two people’s cards changes the deal ⟹ P(52, 4) = 52·51·50·49.<br><b>A 5-card hand:</b> the same cards in any order are the same hand ⟹ C(52, 5) = 2,598,960.</p>"],
["c","Pigeonhole","State the pigeonhole principle and prove it.",
"<span class='f'>k + 1 or more objects in k boxes ⟹ some box has at least 2</span><span class='lb'>Proof (by contradiction)</span><p>Suppose every box had at most 1 object. With k boxes, that’s at most k objects in total. But there are at least k + 1. Contradiction.</p><span class='lb'>Use it to prove</span><p>“Some two things must share a property”, without finding which two.</p>"],
["c","Pigeonhole","How do you write a pigeonhole proof?",
"<ol><li><b>Pigeons:</b> say what the objects are and how many (say N).</li><li><b>Holes:</b> say what the boxes are and how many (fewer than N).</li><li><b>Rule:</b> say exactly which hole each pigeon goes in.</li><li><b>Conclude:</b> by pigeonhole, two pigeons share a hole. Then say what that <b>means</b> for the problem.</li></ol><p class='trap'>The hard part is choosing holes so that “two in the same hole” gives what you want. Write the holes out explicitly.</p>"],
["c","Pigeonhole","Show that any 27 English words include two that start with the same letter.",
"<ul><li><b>Pigeons:</b> the 27 words.</li><li><b>Holes:</b> the 26 letters a–z.</li><li><b>Rule:</b> put each word in the hole of its first letter.</li></ul><p>27 pigeons, 26 holes ⟹ some hole has 2 words ⟹ they start with the same letter.</p>"],
["c","Pigeonhole","Why can’t a function f : A → B be one-to-one if |A| &gt; |B|?",
"<ul><li><b>Pigeons:</b> the elements of A (at least |B| + 1 of them).</li><li><b>Holes:</b> the elements of B.</li><li><b>Rule:</b> a goes in hole f(a).</li></ul><p>Two different a₁ ≠ a₂ land in the same hole b, so f(a₁) = b = f(a₂). That breaks one-to-one.</p>"],
["c","Pigeonhole","Pick any n + 1 numbers from {1, …, 2n}. Why must one of them divide another?",
"<ol><li>Write each chosen number as 2ᵏ · b with b odd (pull out all the factors of 2). For example, 12 = 2² · 3.</li><li><b>Holes:</b> the odd part b. The odd numbers from 1 to 2n are 1, 3, …, 2n − 1, so there are n holes.</li><li>n + 1 pigeons, n holes ⟹ two chosen numbers have the same odd part: 2ⁱb and 2ʲb with i &lt; j.</li><li>2ʲb = 2ʲ⁻ⁱ · (2ⁱb), so the smaller divides the larger.</li></ol>"],
["c","Pigeonhole","Why does every positive integer n have a positive multiple written only with 0s and 1s?",
"<ol><li>Look at the numbers 1, 11, 111, …, up to the one with n + 1 ones. That’s n + 1 numbers.</li><li><b>Holes:</b> their remainders mod n (0, 1, …, n − 1), so n holes.</li><li>Two of them, a &lt; b, have the same remainder ⟹ n divides b − a.</li><li>b − a looks like 11…1100…0 (ones, then zeros), a multiple of n written with only 0s and 1s.</li></ol><p class='ex'>Example from lecture: n = 3 ⟹ 111 = 3 · 37.</p>"],
["c","Pigeonhole","Why can no compression algorithm make every n-bit file shorter?",
"<ol><li>Lossless compression must be undoable, so the compression function must be one-to-one.</li><li><b>Pigeons:</b> all 2ⁿ files of length n.</li><li><b>Holes:</b> all shorter files: 2⁰ + 2¹ + ⋯ + 2ⁿ⁻¹ = 2ⁿ − 1 of them.</li><li>More pigeons than holes ⟹ two files compress to the same thing ⟹ not one-to-one. Contradiction.</li></ol>"],
["c","Stars and bars","How many ways can you choose r identical items from n types? Why?",
"<span class='f'>C(r + n − 1, r) = C(r + n − 1, n − 1)</span><span class='lb'>Why</span><p>Write a choice as a row of r stars (the items) and n − 1 bars (dividers between the types). Stars before the 1st bar are type 1, between bars 1 and 2 are type 2, and so on.</p><p>Every choice gives exactly one row, and every row gives one choice. A row has r + n − 1 symbols, and you pick which r of them are stars.</p><p class='trap'>Bars = number of <b>types</b> − 1, not the number of types.</p>"],
["c","Stars and bars","How many ways to pick 8 bills from $1, $5, $10 and $20 (bills of the same type are identical)?",
"<span class='f'>C(11, 8) = C(11, 3) = 165</span><span class='lb'>How</span><ol><li>8 items ⟹ 8 stars. 4 types ⟹ 3 bars.</li><li>11 symbols in total; choose the 3 bar positions.</li></ol><p class='ex'>★★|★★★★||★★ = two $1s, four $5s, no $10s, two $20s.</p>"],
["c","Stars and bars","How many solutions does x₁ + x₂ + x₃ = 17 have with every xᵢ ≥ 0 an integer?",
"<span class='f'>C(19, 2) = 171</span><span class='lb'>How</span><p>Each xᵢ is “how many items of type i”: 17 identical stars split into 3 groups by 2 bars. 19 symbols, choose the 2 bar spots.</p>"],
["c","Stars and bars","How many solutions does y₁ + y₂ + y₃ = 14 have with every yᵢ ≥ 1?",
"<span class='f'>C(13, 2) = 78</span><span class='lb'>How (handle lower bounds first)</span><ol><li>Give each variable its required 1 up front: zᵢ = yᵢ − 1 ≥ 0.</li><li>Then z₁ + z₂ + z₃ = 14 − 3 = 11.</li><li>Stars and bars: 11 stars, 2 bars ⟹ C(13, 2).</li></ol><p class='trap'>Stars and bars needs every variable ≥ 0. Always shift lower bounds away first.</p>"],
["c","Choosing r from n","Choosing r things from n: what are the four formulas?",
"<p><b>Order matters, no repeats:</b> P(n, r) = n!/(n − r)! (e.g. officers chosen from a club)</p><p><b>Order matters, repeats allowed:</b> nʳ (e.g. strings, PINs)</p><p><b>Order doesn’t matter, no repeats:</b> C(n, r) (e.g. committees, hands)</p><p><b>Order doesn’t matter, repeats allowed:</b> C(n + r − 1, r) (e.g. a bag of donuts)</p><p class='ex'>Ask two questions: does order matter (swap test)? Can the same thing be picked twice?</p>"],
["c","Repeated letters","How many arrangements of n objects when some are identical? Why?",
"<span class='f'>n! / (n₁! n₂! ⋯ nₖ!)</span><span class='lb'>Why</span><ol><li>Pretend every object is different (label the copies): n! arrangements.</li><li>Rearranging the n₁ copies of type 1 among their own spots gives the same word: n₁! ways for each word. Same for each other type.</li><li>So each real word was counted n₁! n₂! ⋯ nₖ! times. Divide.</li></ol><p class='ex'><b>SENSELESSNESS:</b> 13 letters with 6 S, 4 E, 2 N, 1 L ⟹ 13!/(6!·4!·2!·1!) = 180,180.</p>"],
["c","Combinatorial proofs","What is a combinatorial proof, and what’s the template?",
"<span class='lb'>Idea</span><p>Prove two expressions are equal by showing they <b>count the same collection</b> in two different ways.</p><span class='lb'>Template</span><ol><li>Name a specific collection (“committees of k people from n, with a chair”).</li><li>Count it one way and explain each factor ⟹ the left side.</li><li>Count it another way ⟹ the right side.</li><li>Same collection ⟹ the two counts are equal.</li></ol><p class='trap'>Algebra doesn’t count as a combinatorial proof. You must explain what is being counted.</p>"],
["c","Combinatorial proofs","Prove C(n, r) = C(n, n − r) combinatorially.",
"<p><b>Collection:</b> ways to choose r of n objects.</p><p>Choosing the r objects you <b>take</b> is the same as choosing the n − r you <b>leave out</b>.</p><p>The two counts are C(n, r) and C(n, n − r). Matching each chosen set with its complement is a bijection, so they’re equal.</p><p class='ex'>Algebra also works: n!/(r!(n − r)!) is symmetric in r and n − r.</p>"],
["c","Combinatorial proofs","Prove the committee–chair identity k · C(n, k) = n · C(n − 1, k − 1).",
"<p><b>Collection:</b> committees of k people from n, with one member named chair.</p><p><b>Way 1:</b> choose the committee (C(n, k)), then choose its chair from the k members (k) ⟹ k · C(n, k).</p><p><b>Way 2:</b> choose the chair first from all n people (n), then the other k − 1 members from the remaining n − 1 (C(n − 1, k − 1)) ⟹ n · C(n − 1, k − 1).</p><p>Same collection ⟹ equal.</p>"],
["c","Combinatorial proofs","State and prove Pascal’s identity.",
"<span class='f'>C(n + 1, k) = C(n, k − 1) + C(n, k)</span><p><b>Collection:</b> groups of k people from n + 1 people, one of whom is Alice. There are C(n + 1, k) of them.</p><p>Split by whether Alice is in the group, two cases that don’t overlap:</p><ul><li><b>Alice is in:</b> pick the other k − 1 from the remaining n ⟹ C(n, k − 1).</li><li><b>Alice is out:</b> pick all k from the other n ⟹ C(n, k).</li></ul><p>Sum rule ⟹ the identity.</p>"],
["c","Combinatorial proofs","Why is C(n, 0) + C(n, 1) + ⋯ + C(n, n) = 2ⁿ?",
"<p><b>Collection:</b> all subsets of an n-element set.</p><p><b>Way 1:</b> group by size. There are C(n, k) subsets of size k, for k = 0, …, n; add them.</p><p><b>Way 2:</b> each element is in or out ⟹ 2ⁿ.</p><p class='ex'>Or: put x = y = 1 in the binomial theorem: (1 + 1)ⁿ = Σ C(n, k).</p>"],
["c","Pascal’s triangle","How is Pascal’s triangle built, and what are its rows?",
"<p>Row n lists C(n, 0), C(n, 1), …, C(n, n). Each inside number is the sum of the two above it, which is Pascal’s identity. Each row starts and ends with 1.</p><span class='f'>1<br>1 1<br>1 2 1<br>1 3 3 1<br>1 4 6 4 1<br>1 5 10 10 5 1</span><p class='ex'>Row 3 gives (x + y)³ = x³ + 3x²y + 3xy² + y³.</p>"],
["c","Combinatorial proofs","If p is prime and 0 &lt; k &lt; p, why does p divide C(p, k)?",
"<ol><li>Committee–chair identity: k · C(p, k) = p · C(p − 1, k − 1). So p divides k · C(p, k).</li><li>p is prime: if p divides a product, it divides one of the factors.</li><li>p doesn’t divide k, because 0 &lt; k &lt; p.</li><li>So p divides C(p, k).</li></ol><p class='ex'>Example: row 5 is 1 5 10 10 5 1, and all the middle numbers are multiples of 5. This was used to prove the freshman’s dream and Fermat’s little theorem.</p>"],
["c","Binomial theorem","State the binomial theorem.",
"<span class='f'>(x + y)ⁿ = Σ<sub>j=0</sub><sup>n</sup> C(n, j) xⁿ⁻ʲ yʲ</span><p>The exponents always add to n, and the coefficient of xⁿ⁻ʲyʲ is C(n, j).</p><p class='ex'>(x + y)³ = x³ + 3x²y + 3xy² + y³ (coefficients from row 3 of Pascal’s triangle).</p>"],
["c","Binomial theorem","Why does C(n, j) show up in the binomial theorem?",
"<ol><li>(x + y)ⁿ = (x + y)(x + y) ⋯ (x + y), n factors.</li><li>Expanding means picking x <b>or</b> y from each factor and multiplying.</li><li>You get xⁿ⁻ʲyʲ exactly when y is picked from j of the factors and x from the rest.</li><li>There are C(n, j) ways to choose which j factors give the y, so xⁿ⁻ʲyʲ appears C(n, j) times.</li></ol>"],
["c","Binomial theorem","What is the coefficient of x³y² in (2x − y)⁵?",
"<span class='f'>C(5, 2) · 2³ · (−1)² = 10 · 8 · 1 = 80</span><span class='lb'>How</span><ol><li>Treat it as (A + B)⁵ with A = 2x and B = −y.</li><li>y² needs B²; the exponents add to 5, so it pairs with A³.</li><li>That term is C(5, 2) · A³ · B² = 10 · (2x)³ · (−y)² = 10 · 8x³ · y².</li></ol><p class='trap'>Raise the <b>whole</b> term, including its number and sign: (2x)³ = 8x³, and (−y)² = +y² (an odd power would make it negative).</p>"],
["c","Binomial theorem","Lecture exercise: what is the coefficient of z⁴w⁶ in (3z + 2w²)⁷?",
"<span class='f'>C(7, 3) · 3⁴ · 2³ = 35 · 81 · 8 = 22,680</span><span class='lb'>How</span><ol><li>Let x = 3z and y = 2w², so it’s (x + y)⁷.</li><li>w⁶ = (w²)³ needs y³, which pairs with x⁴ (4 + 3 = 7). That also gives z⁴. ✓</li><li>The term is C(7, 3) x⁴ y³ = C(7, 3)(3z)⁴(2w²)³ = C(7, 3) · 3⁴ · 2³ · z⁴w⁶.</li></ol><p class='trap'>Match the exponent on the <b>variable</b>, not the term: w⁶ comes from (w²)³, so j = 3, not 6.</p>"],
// ================= PROBABILITY (Lectures 16, 18, 19) =================
["p","Basics","What are an experiment, a sample space, and an event?",
"<p><b>Experiment:</b> a process with a random result (flip two different coins).</p><p><b>Sample space S:</b> the set of <b>all</b> possible outcomes: {HH, HT, TH, TT}.</p><p><b>Event E:</b> any subset of S, i.e. the outcomes you care about. “Both the same” = {HH, TT}.</p><p class='ex'>Other lecture examples: roll two dice (36 outcomes), event “sum is 7”. Pick a number from 1–1000, event “divisible by 5”.</p>"],
["p","Basics","If all outcomes are equally likely, what is p(E)?",
"<span class='f'>p(E) = |E| / |S|</span><p>Probability is <b>counting with a denominator</b>: count the outcomes in E, divide by all outcomes.</p><span class='lb'>Examples</span><p class='ex'><b>Two coins, both the same:</b> {HH, TT} ⟹ 2/4 = 1/2.<br><b>Two dice sum to 7:</b> (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) ⟹ 6/36 = 1/6.<br><b>Number from 1–1000 divisible by 5:</b> 200/1000 = 1/5.</p><p class='trap'>The two dice must be treated as different (first, second), or the 36 outcomes aren’t equally likely.</p>"],
["p","Basics","What is a probability distribution (outcomes not equally likely)?",
"<p>Each outcome s gets a number p(s) with 0 ≤ p(s) ≤ 1, and all of them add up to 1. The probability of an event is then:</p><span class='f'>p(E) = sum of p(s) over all s in E</span><p>The <b>uniform distribution</b> on n outcomes is p(s) = 1/n for each, which brings back p(E) = |E|/|S|.</p>"],
["p","Basics","A loaded die has p(6) = 1/2 and each other face 1/10. What is p(even)?",
"<span class='f'>p(2) + p(4) + p(6) = 1/10 + 1/10 + 1/2 = 7/10</span><span class='lb'>How</span><ol><li>Check it’s a distribution: 5 · (1/10) + 1/2 = 1 ✓.</li><li>Even = {2, 4, 6}. <b>Add</b> their probabilities.</li></ol><p class='trap'>With unequal outcomes you can’t use “3 even faces out of 6 = 1/2”.</p>"],
["p","Poker","What is the probability a 5-card hand has all 5 cards in the same suit?",
"<span class='f'>4 · C(13, 5) / C(52, 5)</span><span class='lb'>How</span><ol><li>All C(52, 5) = 2,598,960 hands are equally likely, so count the good ones.</li><li>Pick the suit: 4 ways.</li><li>Pick 5 of that suit’s 13 cards: C(13, 5).</li><li>Divide by the total.</li></ol><p class='ex'>About 0.2%. Leaving it as a formula is fine.</p>"],
["p","Poker","How many full houses (3 cards of one rank + 2 of another)?",
"<span class='f'>13 · 12 · C(4, 3) · C(4, 2) = 3744</span><span class='lb'>Steps</span><ol><li>Rank for the three of a kind: 13.</li><li>A different rank for the pair: 12.</li><li>Which 3 of the 4 suits for the triple: C(4, 3) = 4.</li><li>Which 2 of the 4 suits for the pair: C(4, 2) = 6.</li></ol><p class='ex'>13 · 12 (not C(13, 2)) because the two ranks play <b>different roles</b>: three kings and two 5s is a different hand from three 5s and two kings.</p>"],
["p","Poker","How many two-pair hands? Why C(13, 2) and not 13 · 12?",
"<span class='f'>C(13, 2) · C(4, 2)² · 44</span><span class='lb'>Steps</span><ol><li>The two ranks for the pairs: C(13, 2). The pairs play the <b>same role</b>, so order doesn’t matter.</li><li>Two suits for each pair: C(4, 2) · C(4, 2).</li><li>The 5th card: any of the 52 − 8 = 44 cards of the other 11 ranks.</li></ol><p class='trap'>13 · 12 would count “kings and 5s” and “5s and kings” as different, so every hand would be counted twice.</p>"],
["p","Complement & union","State the complement rule and use it: 5 fair coins, p(at least one head)?",
"<span class='f'>p(not E) = 1 − p(E)</span><span class='lb'>Why</span><p>E and “not E” split S, so their probabilities add to 1.</p><span class='lb'>Example</span><p>The opposite of “at least one head” is “no heads” = all tails, which is 1 of the 2⁵ = 32 outcomes. So p = 1 − 1/32 = <b>31/32</b>.</p>"],
["p","Complement & union","5-card hand: what’s the probability at least two cards have the same rank?",
"<span class='f'>1 − C(13, 5) · 4⁵ / C(52, 5) ≈ 0.49</span><span class='lb'>How (complement)</span><ol><li>The opposite is “all 5 ranks different”.</li><li>Choose 5 different ranks: C(13, 5).</li><li>Each of those cards can be any of 4 suits: 4⁵.</li><li>Subtract that probability from 1.</li></ol>"],
["p","Complement & union","State the union rule and use it: a number from 1–100, p(divisible by 2 or 5)?",
"<span class='f'>p(E ∪ F) = p(E) + p(F) − p(E ∩ F)</span><p>It’s inclusion–exclusion divided by |S|, and it holds for any distribution.</p><span class='lb'>Example</span><p>Divisible by 2: 50. By 5: 20. By both = by 10: 10. So (50 + 20 − 10)/100 = <b>3/5</b>.</p><p class='ex'>Weather: 40% rain, 30% snow, 10% both ⟹ rain or snow = 40 + 30 − 10 = 60%.</p>"],
["p","Union bound","What is the union bound, and why is it always true?",
"<span class='f'>p(E₁ ∪ E₂ ∪ ⋯ ∪ Eₙ) ≤ p(E₁) + p(E₂) + ⋯ + p(Eₙ)</span><span class='lb'>Why</span><p>For two events, p(E₁ ∪ E₂) = p(E₁) + p(E₂) − p(E₁ ∩ E₂), and the subtracted part is ≥ 0. With more events, adding counts every overlap at least once extra, so the sum can only be too <b>big</b>.</p><span class='lb'>Use</span><p>When the exact union is hard but each event is easy, the union bound gives an upper limit. This is key in the probabilistic method and the birthday rule of thumb.</p>"],
["p","Conditional","What is p(E | F), and what does it mean?",
"<span class='f'>p(E | F) = p(E ∩ F) / p(F) (needs p(F) &gt; 0)</span><span class='lb'>Meaning</span><p>“The probability of E <b>given</b> that F happened.” Once you know F happened, every outcome outside F is ruled out. F becomes the new sample space, and you ask what share of it is also in E.</p><p class='ex'>With equally likely outcomes: p(E | F) = |E ∩ F| / |F|.</p>"],
["p","Conditional","Two fair coins. p(both heads | at least one head)? And p(2nd heads | 1st heads)?",
"<p><b>Given at least one head:</b> F = {HH, HT, TH} (3 outcomes), E ∩ F = {HH} ⟹ <b>1/3</b>.</p><p><b>Given the 1st is heads:</b> F = {HH, HT}, E ∩ F = {HH} ⟹ <b>1/2</b>.</p><p class='trap'>They sound alike, but “at least one head” leaves 3 possibilities and “the first is heads” leaves 2. Always write out F.</p>"],
["p","Conditional","What is the multiplication rule?",
"<span class='f'>p(E ∩ F) = p(E | F) · p(F)</span><p>It’s the definition of conditional probability, multiplied out. Use it for “first F happens, then E happens”.</p><p class='ex'>Example: draw 2 cards. p(both aces) = p(1st ace) · p(2nd ace | 1st ace) = (4/52)(3/51).</p>"],
["p","Total probability","State the law of total probability and explain it.",
"<p>If F₁, …, Fₙ are disjoint cases that cover all of S (each with p(Fᵢ) &gt; 0):</p><span class='f'>p(E) = p(E | F₁)p(F₁) + ⋯ + p(E | Fₙ)p(Fₙ)</span><span class='lb'>Why</span><p>E splits into the pieces E ∩ F₁, …, E ∩ Fₙ, which don’t overlap. Add their probabilities, and write each one as p(E | Fᵢ)p(Fᵢ) (the multiplication rule).</p><p class='ex'>Two cases: p(E) = p(E | F)p(F) + p(E | not F)p(not F).</p>"],
["p","Total probability","Monty Hall: 3 doors, 1 car, 2 goats. You pick a door; the host (who knows) opens another door with a goat. Should you switch?",
"<p><b>Yes. Switching wins with probability 2/3.</b></p><span class='lb'>Intuition</span><p>Your first pick is right only 1/3 of the time, and the host opening a goat door doesn’t change that. So the other unopened door has the remaining 2/3.</p><span class='lb'>With total probability</span><p>Let G = your first pick was a goat, so p(G) = 2/3. If G, the host must reveal the other goat, and switching gets the car. If not G, switching gets a goat.</p><span class='f'>p(win by switching) = 1 · ⅔ + 0 · ⅓ = 2/3</span>"],
["p","Total probability","Survey trick: flip a coin; heads means say “yes”, tails means answer honestly. 60% say yes. What fraction of honest answers are yes?",
"<span class='f'>0.6 = 1 · ½ + x · ½ ⟹ x = 0.2 = 20%</span><span class='lb'>How</span><ol><li>Cases: heads (p = ½) or tails (p = ½).</li><li>p(yes | heads) = 1. p(yes | tails) = x, the unknown.</li><li>Total probability: p(yes) = 1 · ½ + x · ½ = 0.6, so x = 0.2.</li></ol><p class='ex'>Why it’s useful: nobody knows whether a given “yes” is honest, so people answer truthfully.</p>"],
["p","Independence","When are E and F independent?",
"<span class='f'>p(E ∩ F) = p(E) · p(F)</span><p>If p(F) &gt; 0, that’s the same as <b>p(E | F) = p(E)</b>: learning F doesn’t change the chance of E.</p><span class='lb'>How to check</span><ol><li>Compute p(E), p(F) and p(E ∩ F) separately.</li><li>Check whether p(E ∩ F) = p(E) · p(F).</li></ol><p class='trap'>Never assume independence unless the problem gives it. The lecture called assuming it wrongly a very common real-world mistake.</p>"],
["p","Independence","Random 4-bit string. E = first bit is 1, F = even number of 1s. Are they independent?",
"<span class='lb'>Work</span><ol><li>16 equally likely strings.</li><li>p(E) = 8/16 = ½ (the first bit is 1, the other 3 are free).</li><li>p(F) = 8/16 = ½ (0, 2 or 4 ones: 1 + 6 + 1 = 8 strings).</li><li>E ∩ F = strings starting with 1 that have an even number of 1s: 1001, 1010, 1100, 1111 ⟹ 4/16 = ¼.</li></ol><p>¼ = ½ · ½ ⟹ <b>independent</b>.</p>"],
["p","Independence","What’s the difference between pairwise and mutual independence?",
"<p><b>Pairwise:</b> every <b>pair</b> Eᵢ, Eⱼ (i ≠ j) satisfies p(Eᵢ ∩ Eⱼ) = p(Eᵢ)p(Eⱼ).</p><p><b>Mutual:</b> the product rule holds for <b>every group</b> of the events, all pairs, triples, …, and all of them at once:</p><span class='f'>p(Eᵢ₁ ∩ ⋯ ∩ Eᵢₘ) = p(Eᵢ₁) ⋯ p(Eᵢₘ)</span><p>Intuition: mutual means knowing any of the events tells you nothing about the others.</p><p class='trap'>Pairwise does <b>not</b> imply mutual.</p>"],
["p","Independence","Give the lecture’s example of events that are pairwise but not mutually independent.",
"<p>Alice, Bob and Charlotte each pick a random number from 1–100.</p><ul><li>E₁ = Alice and Bob match</li><li>E₂ = Alice and Charlotte match</li><li>E₃ = Bob and Charlotte match</li></ul><p><b>Each</b> has probability 1/100. <b>Any two</b> together means all three match: 1/100² = (1/100)(1/100) ⟹ pairwise independent.</p><p><b>All three:</b> E₁ and E₂ already force E₃, so p(E₁ ∩ E₂ ∩ E₃) = 1/100², not 1/100³ ⟹ <b>not mutually independent</b>.</p>"],
["p","Bernoulli trials","What are Bernoulli trials?",
"<p>The same try repeated n times, <b>independently</b>. Each try succeeds with the same probability p and fails with probability 1 − p.</p><p class='ex'>Flip a coin n times and count heads (p = ½). Roll a die n times and count the 1s (p = 1/6).</p>"],
["p","Bernoulli trials","What’s the probability of exactly k successes in n Bernoulli trials? Why?",
"<span class='f'>C(n, k) · pᵏ · (1 − p)ⁿ⁻ᵏ</span><span class='lb'>Why</span><ol><li>Take one specific pattern, like SSFF…: the tries are independent, so multiply, giving pᵏ(1 − p)ⁿ⁻ᵏ.</li><li>Every pattern with k successes has this same probability.</li><li>There are C(n, k) patterns (choose which k tries succeed). They don’t overlap, so add them.</li></ol><p class='ex'>Example: a die rolled 3 times, exactly one 1: C(3, 1)(1/6)(5/6)² = 75/216 ≈ 0.35.</p>"],
["p","Bernoulli trials","A coin with p(H) = ¼ is flipped 4 times. p(exactly 2 heads)? p(at least one head)?",
"<p><b>Exactly 2:</b> C(4, 2)(¼)²(¾)² = 6 · 1/16 · 9/16 = <b>27/128</b>.</p><p><b>At least one:</b> the complement is “no heads” = (¾)⁴ ⟹ 1 − 81/256 = <b>175/256</b>.</p><p class='trap'>Don’t forget the C(n, k): (¼)²(¾)² alone is the probability of one specific pattern, like HHTT.</p>"],
["p","Birthday paradox","n people with random birthdays (365 equally likely days). p(some two share a birthday)? For n = 23?",
"<span class='f'>1 − (365 · 364 ⋯ (365 − n + 1)) / 365ⁿ</span><span class='lb'>Why</span><ol><li>Use the complement: everyone has a <b>different</b> birthday.</li><li>Total possibilities: 365ⁿ.</li><li>All different: the 1st person has 365 options, the 2nd 364, …, the nth 365 − n + 1.</li><li>Subtract that probability from 1.</li></ol><p>For n = 23, about <b>50.7%</b>. It’s surprisingly big because 23 people make C(23, 2) = 253 pairs.</p>"],
["p","Birthday paradox","What’s the rule of thumb for collisions, and the lecture’s security example?",
"<span class='f'>p(two match) ≈ C(n, 2) / d (n random picks from d possibilities)</span><p>There are C(n, 2) pairs, and each matches with probability 1/d. The union bound adds them up (it’s an upper bound, and accurate when it’s small).</p><p class='ex'><b>Security:</b> 64-bit secrets give d = 2⁶⁴ ≈ 1.8 × 10¹⁹. But just 2³² ≈ 4 billion of them already give about a 39% chance that two collide, and 4 billion is easy for a computer.</p>"],
["p","Probabilistic method","What is the probabilistic method?",
"<span class='lb'>Idea (Erdős)</span><p>To prove that something with a property <b>exists</b>, describe a random way to build one and show p(it has the property) &gt; 0. If the probability is positive, at least one good outcome must exist.</p><span class='lb'>Usual tool</span><p>Union bound: p(something goes wrong) ≤ sum of the bad-event probabilities &lt; 1 ⟹ p(nothing goes wrong) &gt; 0.</p>"],
["p","Probabilistic method","10 clubs of exactly 5 students each. Why can students be split into red and blue so that no club is all one color?",
"<ol><li>Put each student on a team by an independent fair coin flip.</li><li>For one club: p(all red) = (½)⁵ and p(all blue) = (½)⁵ ⟹ p(one color) = 2/32 = 1/16.</li><li>Union bound over the 10 clubs: p(some club is one color) ≤ 10 · 1/16 = 10/16 &lt; 1.</li><li>So p(no club is one color) ≥ 6/16 &gt; 0, which means some assignment works.</li></ol><p class='ex'>It doesn’t matter that clubs share students: the union bound needs no independence.</p>"],
["p","Probabilistic method","What does squarefree mean, and how does the lecture use it to prove there are infinitely many primes?",
"<p><b>Squarefree:</b> no k ≥ 2 has k² dividing the number. 3 · 7 · 11 is squarefree; 5 · 7 · 11 · 11 is not.</p><span class='lb'>Proof sketch</span><ol><li>Suppose there were only m primes. A squarefree number uses each prime 0 or 1 times, so there are only 2ᵐ of them.</li><li>Pick x uniformly from 1 to n: p(x squarefree) ≤ 2ᵐ/n, which is tiny for large n.</li><li>But by the union bound, p(x not squarefree) ≤ 1/4 + 1/9 + 1/16 + ⋯ &lt; 1. So p(squarefree) stays above a fixed positive amount.</li><li>Contradiction for large n.</li></ol>"],
["p","Bayes’ theorem","State Bayes’ theorem and derive it.",
"<span class='f'>p(F | E) = p(E | F) · p(F) / p(E)</span><span class='f'>with p(E) = p(E | F)p(F) + p(E | not F)p(not F)</span><span class='lb'>Derivation</span><ol><li>By the definition of conditional probability, p(F | E)p(E) = p(E ∩ F) = p(E | F)p(F).</li><li>Divide by p(E).</li><li>Expand p(E) with the law of total probability.</li></ol><p class='ex'>Use it when you know p(evidence | cause) but want p(cause | evidence).</p>"],
["p","Bayes’ theorem","1% of people have a cancer. The test is positive for 90% of people with it and negative for 90% without it. A random person tests positive: p(cancer | positive)?",
"<span class='f'>(0.9 · 0.01) / (0.9 · 0.01 + 0.1 · 0.99) = 0.009 / 0.108 = 1/12 ≈ 8.3%</span><span class='lb'>Setup</span><p>F = cancer, E = positive. p(F) = 0.01, p(E | F) = 0.9, p(E | not F) = 0.1 (false positives).</p><span class='lb'>Check with 1000 people</span><p class='ex'>10 have cancer ⟹ 9 test positive. 990 don’t ⟹ 99 test positive. 108 positives, only 9 real ⟹ 9/108 ≈ 8.3%.</p><p class='trap'>Most people guess about 90%. That mixes up p(positive | cancer) with p(cancer | positive).</p>"],
["p","Bayes’ theorem","Someone says they love to read. 99% of librarians and 40% of farmers do, and there are about 30 farmers per librarian. More likely a librarian or a farmer?",
"<span class='f'>p(librarian | reads) = 0.99 · 1 / (0.99 · 1 + 0.4 · 30) ≈ 7.6%</span><p><b>Farmer</b>, by far. Reading fits librarians better, but there are 30 times as many farmers, and that base rate wins.</p><p class='ex'>Using counts: per 1 librarian there are 30 farmers. Readers: 0.99 librarians vs 0.4 · 30 = 12 farmers.</p>"],
["p","Bayes’ theorem","How does Bayes’ theorem “update” a probability with evidence, and what was the lecture’s point about how much a test can change it?",

const KEY='m55-quiz5-cards-v2';
let st={known:{},deck:'all'}; try{ st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
const card=document.getElementById('card'), deckSel=document.getElementById('deck');
deckSel.value=st.deck;
let queue=[], cur=null, shown=false;
const ids=()=>C.map((c,i)=>i).filter(i=>st.deck==='all'||C[i][0]===st.deck);
function build(){ queue=ids().filter(i=>!st.known[i]); cur=queue.shift(); shown=false; render(); }
function render(){
  const all=ids(), done=all.filter(i=>st.known[i]).length;
  document.getElementById('bar').style.width=(all.length?100*done/all.length:0)+'%';
  document.getElementById('count').textContent=done+' of '+all.length+' learned';
  document.getElementById('left').textContent=cur==null?'':(queue.length+1)+' left in this pass';
  if(cur==null){
    card.innerHTML='<div class="done"><h2>All learned ✓</h2><p>You got every card in this deck.</p><button class="show" type="button" id="again-all">Go through them again</button></div>';
    document.getElementById('again-all').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
    return;
  }
  const c=C[cur];
  card.innerHTML='<span class="tag">'+c[1]+'</span><div class="front">'+c[2]+'</div>'+
    (shown?'<div class="back">'+c[3]+'</div><div class="btns"><button type="button" class="again">Again</button><button type="button" class="got">Got it</button></div>'
          :'<p class="hint">Answer in your head first, then check.</p><button type="button" class="show">Show answer</button>');
  if(shown){
    card.querySelector('.again').onclick=()=>{ queue.splice(Math.min(3,queue.length),0,cur); next(); };
    card.querySelector('.got').onclick=()=>{ st.known[cur]=1; save(); next(); };
  } else card.querySelector('.show').onclick=()=>{ shown=true; render(); };
}
function next(){ cur=queue.length?queue.shift():null; shown=false; render(); window.scrollTo(0,0); }
deckSel.onchange=()=>{ st.deck=deckSel.value; save(); build(); };
document.getElementById('restart').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
document.addEventListener('keydown',e=>{
  if(cur==null) return;
  if(!shown&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); shown=true; render(); }
  else if(shown&&e.key==='1') card.querySelector('.again').click();
  else if(shown&&(e.key==='2'||e.key===' ')){ e.preventDefault(); card.querySelector('.got').click(); }
});
build();
</script>
