["j1","Recursion","What two parts does every recursive method need, and what is the leap of faith?","<span class='f'>base case + recursive case that shrinks the input</span><p><b>Leap of faith:</b> assume the call on the smaller input returns the right answer; just check you build the full answer from it correctly. Induction does the rest.</p><p class='ex'><code>sum(a, i)</code>: if i ≥ a.length return 0; else return a[i] + sum(a, i + 1).</p><p class='trap'>A base case the input can skip (n == 0 while stepping by 2) recurses forever → StackOverflowError.</p>"],
["j1","Recursion","What does <code>f(4)</code> return for <code>f(n) = n &lt;= 1 ? 1 : f(n-1) + f(n-2)</code>?","<span class='f'>5</span><p>f(0) = f(1) = 1, f(2) = 2, f(3) = 3, f(4) = 5. Build up from the base cases instead of tracing every call.</p><p class='trap'>The call tree recomputes the same values over and over, so the number of calls grows exponentially.</p>"],
["j1","IntLists","What is an IntList and how is <code>15 → 10 → 5</code> built?","<span class='lb'>Meaning</span><p>A node with <code>int first</code> and <code>IntList rest</code>; the rest of a list is itself a list (or null at the end).</p><p class='ex'><code>L = new IntList(5, null); L = new IntList(10, L); L = new IntList(15, L);</code></p><span class='f'>each new node goes in front</span><p class='trap'>get(i) costs Θ(i): you must follow i arrows. Arrays index in Θ(1).</p>"],
["j1","IntLists","Destructive vs non-destructive list methods: how do you tell them apart?","<span class='f'>calls new for each node → non-destructive</span><p><b>incrList</b> returns <code>new IntList(L.first + x, incrList(L.rest, x))</code>: L is untouched. <b>dincrList</b> does <code>L.first += x</code> and returns L: the original list changes and the result <code>== L</code>.</p><p class='ex'>L = [15 10 5]: incrList(L, 2) → [17 12 7], L same. dincrList(L, 1) → L becomes [16 11 6].</p>"],
["j1","IntLists","After an in-place reverse <code>reverse(R)</code> of R = [1 2 3] (without reassigning R), what does R show?","<span class='f'>[1]</span><p>R still points at the node holding 1, which is now the <b>last</b> node with rest = null. The reversed list [3 2 1] is only reachable through the returned value.</p><span class='lb'>How</span><p>Loop: save next = p.rest; set p.rest = prev; prev = p; p = next. Return prev.</p><p class='trap'>Write <code>R = reverse(R);</code>. Save p.rest before overwriting it or you lose the list.</p>"],
["j1","Testing","What is a unit test, and what does a JUnit/Truth assertion look like?","<span class='lb'>Meaning</span><p>A unit test runs one small piece of code on an input with a known answer and fails if the result differs.</p><p class='ex'><code>assertThat(L.size()).isEqualTo(2);</code> inside a method marked <code>@Test</code>.</p><span class='lb'>Good suites test</span><p>empty, one item, remove-to-empty then add again, exactly-full and one-past-full resizes, mixed sequences.</p><p class='trap'>Passing tests show correctness only on the cases tested.</p>"],
["j1","Testing","What is randomized comparison testing?","<p>Run your implementation and a trusted one (e.g. <code>java.util.ArrayDeque</code>) on the same long random sequence of operations, asserting their outputs agree after every step.</p><span class='f'>finds bugs in sequences you didn’t think to write</span><p class='ex'>Random addFirst/addLast/removeFirst/removeLast calls compared against ArrayDeque catch wrap-around and resize bugs.</p><p>When it fails, shrink the sequence to the shortest one that still fails.</p>"],
["j1","SLList","Why wrap IntNodes in an SLList class, and why is the node class <code>private static</code>?","<p>The SLList hides the nodes from users, keeps a cached <code>size</code> (Θ(1) size()), and maintains invariants.</p><p><b>private</b>: users never touch nodes. <b>static</b>: a node never needs to look at its enclosing list, so it doesn’t carry a hidden pointer to one.</p><span class='f'>nested class: a class defined inside another</span>"],
["j1","SLList","What is a sentinel node and what problem does it solve?","<span class='lb'>Meaning</span><p>A permanent dummy node at the front holding a junk item. The real first item is <code>sentinel.next</code>.</p><span class='lb'>Why</span><p>Without it, addLast on an empty list needs a special case (there is no node to start walking from). With it, there is always a node, so one loop handles every case.</p><span class='f'>invariant: sentinel is never null</span><p class='trap'>The sentinel’s item is never a real element; don’t count it in size.</p>"],
["j1","SLList","Why is removeLast Θ(n) in an SLList even with a <code>last</code> pointer?","<p>After removing the last node you must set <code>last</code> to the <b>second-to-last</b> node. Singly linked nodes have no backward arrow, so the only way to find it is to walk from the front.</p><span class='f'>fix: doubly linked nodes (prev pointers)</span><p class='ex'>addLast does become Θ(1) with a last pointer; removeLast does not.</p>"],
["j1","DLList","Describe the circular-sentinel DLList.","<span class='lb'>Meaning</span><p>Nodes have prev and next. One sentinel: <code>sentinel.next</code> is the first item, <code>sentinel.prev</code> the last, and the last item’s next is the sentinel.</p><span class='f'>empty: sentinel.next = sentinel.prev = sentinel</span><span class='lb'>Why</span><p>No null checks anywhere; both ends are Θ(1); every add/remove rewires 4 arrows.</p><p class='trap'>When removing, fix both neighbours’ arrows (next and prev) or the list breaks when traversed backward.</p>"],
["j1","AList","How does an AList work, and what are its invariants?","<p>Items live in an array; <code>size</code> counts them. The next item goes at <code>items[size]</code>; the last item is <code>items[size − 1]</code>. When the array is full, copy everything into a bigger array.</p><span class='f'>get(i) Θ(1), addLast Θ(1) amortized</span><p class='trap'><code>new T[8]</code> is a compile error; use <code>(T[]) new Object[8]</code>. Null out removed slots so objects can be garbage collected.</p>"],
["j1","AList","Why must an AList resize by multiplying (e.g. ×2) instead of adding a constant?","<span class='lb'>Why</span><p>Doubling: the resizes copy 1 + 2 + 4 + ⋯ + n/2 &lt; n items in total, so n adds cost Θ(n): <b>Θ(1) amortized</b>. Adding +1 (or +100): copies 1 + 2 + ⋯ ≈ n²/2: Θ(n) per add.</p><p class='ex'>1000 adds from capacity 1: doubling copies 1023 items; +1 copies 499,500.</p><span class='f'>geometric sum ≤ 2 × last term</span><p class='trap'>One single add can still cost Θ(n): amortized is an average over a sequence.</p>"],
["j1","AList","What does “amortized Θ(1)” mean?","<span class='lb'>Meaning</span><p>Over any sequence of n operations the <b>total</b> cost is Θ(n), so the average per operation is Θ(1), even though an individual operation may be expensive.</p><span class='f'>total cost ÷ number of operations</span><p class='ex'>AList addLast: most adds cost 1; the occasional resize costs n but happens only after ~n/2 cheap adds since the last one.</p><p class='trap'>Not the same as average over random inputs. It’s a worst-case guarantee on sequences.</p>"],
["j1","AList","When should an AList shrink, and why not at half full?","<span class='f'>halve when usage falls to ¼</span><p>If you halved at ½, a user alternating add/remove at the boundary would trigger a Θ(n) resize on every operation (grow, shrink, grow…).</p><p>At ¼, after shrinking the array is half full, so many operations must happen before the next resize.</p>"],
["j1","Circular arrays","In a circular array deque, where is logical item i stored, and how do addFirst/addLast work?","<span class='f'>index (front + i) mod capacity</span><p><b>addFirst</b>: front = floorMod(front − 1, cap), write there. <b>addLast</b>: write at (front + size) % cap.</p><p class='ex'>cap 8: addLast 1, addLast 2, addFirst 9, addFirst 8 → [1, 2, _, _, _, _, 8, 9], front = 6; order 8 9 1 2.</p><p class='trap'>On resize, copy items in logical order (get(0), get(1), …) into the new array starting at 0. A plain arraycopy keeps the wrap in the wrong place.</p>"],
["j1","Interfaces","What is an interface, and what does <code>implements</code> promise?","<span class='lb'>Meaning</span><p>An interface lists method signatures: <b>what</b> a type can do. A class that implements it must provide bodies for all of them (<b>how</b>), as <code>public</code> methods.</p><span class='f'>is-a: List61B&lt;T&gt; L = new AList&lt;&gt;(); is legal</span><p class='ex'>Code written for List61B works on both AList and SLList.</p><p class='trap'>You can’t <code>new</code> an interface. Leaving off <code>public</code> on an implementing method is a compile error.</p>"],
["j1","Interfaces","What is a default method?","<p>A method with a body inside an interface, marked <code>default</code>, written only using the interface’s other methods. Implementing classes inherit it and may override it.</p><p class='ex'><code>default void print()</code> loops over <code>get(i)</code>. If Arr overrides print, then <code>Lst l = new Arr(); l.print();</code> runs Arr’s version.</p><span class='f'>overrides chosen by dynamic type, even for default methods</span>"],
["j1","Inheritance","What does a subclass inherit with <code>extends</code>, and what about constructors?","<p>B gets A’s fields and methods (it can override methods and add new ones). Private members exist but can’t be named.</p><span class='f'>constructors are NOT inherited; each one starts with super(…)</span><p>If you don’t write <code>super(…)</code> first, Java inserts <code>super()</code>. If A has no no-argument constructor, that’s a compile error.</p><p class='ex'><code>new Puppy()</code> prints Animal(), Dog(), Puppy(): parents first.</p>"],
["j1","Inheritance","Is-a vs has-a: when should you use extends?","<p>Use <code>extends</code> only for a true <b>is-a</b>: every operation valid on the parent must make sense on the child. Otherwise use <b>has-a</b> (a field).</p><p class='ex'>A Stack <b>has a</b> list inside it. If Stack extended a list, users could call get(i) or addFirst and break the stack’s rules.</p><p class='trap'>Inheritance ties you to the parent’s implementation: overriding one method can change the behaviour of another parent method that calls it.</p>"],
["j1","Static & dynamic type","Define static type and dynamic type.","<span class='f'>Animal a = new Dog(); static Animal, dynamic Dog</span><p><b>Static type</b>: the declared type, fixed at compile time; the only thing the compiler knows. <b>Dynamic type</b>: the class of the object the variable points to right now, decided at runtime by <code>new</code>.</p><p class='trap'>The compiler rejects <code>Dog d = a;</code> and <code>a.fetch()</code> (Dog-only method) even though a really holds a Dog.</p>"],
["j1","Static & dynamic type","What uses the dynamic type, and what uses the static type?","<ul><li><b>Dynamic type</b>: choosing which <b>overridden instance method</b> body runs.</li><li><b>Static type</b>: all compile checks, choosing <b>overloads</b>, <b>static methods</b> (hidden, not overridden) and <b>fields</b> (hidden).</li></ul><p class='ex'><code>Animal a = new Dog();</code>: <code>a.speak()</code> → Woof (Dog’s), <code>a.sniff()</code> (static) → Animal’s, <code>a.name</code> → Animal’s field.</p>"],
["j1","Overloading & overriding","What is the two-step rule for resolving <code>x.m(arg)</code>?","<ol><li><b>Compile time:</b> in x’s static type, pick the overload of m that best fits the <b>static type of arg</b>. Lock in that exact signature (or compile error).</li><li><b>Runtime:</b> if x’s dynamic type overrides that exact signature, run the override; else the inherited one.</li></ol><span class='f'>the argument’s dynamic type is never consulted</span><p class='trap'>Java dispatches on the receiver only (single dispatch).</p>"],
["j1","Overloading & overriding","A has <code>f(A)</code>; B extends A, overrides <code>f(A)</code> and adds <code>f(B)</code>. With <code>A a = new B();</code>, what does <code>a.f(new B())</code> run?","<span class='f'>B.f(A)</span><p>The compiler looks in A (a’s static type), which only has f(A), so it locks in f(A). At runtime a is a B, which overrides f(A).</p><p class='ex'><code>b.f(b)</code> → B.f(B). <code>b.f(a)</code> → B.f(A). Inside A’s method g, <code>f(this)</code> → this has static type A → B.f(A).</p><p class='trap'>B.f(B) is invisible when the receiver’s static type is A.</p>"],
["j1","Casting","What does a cast do at compile time and at runtime?","<span class='lb'>Compile time</span><p>Changes the <b>static type</b> of that one expression. Error if the types are unrelated (e.g. <code>(String) someAnimal</code>).</p><span class='lb'>Runtime</span><p>Checks the object really is that type (or a subtype); if not, <b>ClassCastException</b>.</p><p class='ex'><code>Object o = new Animal(); Dog d = (Dog) o;</code> compiles, then throws.</p><p class='trap'>A cast never changes the object, so it never changes which override runs.</p>"],
["j1","Casting","With <code>Animal a = new Dog(); Object o = a;</code>: does <code>Animal b = o;</code> compile? Does <code>Dog d = (Dog) o;</code> work?","<span class='f'>first: compile error; second: fine</span><p><code>Animal b = o;</code>: the static type of o is Object, which is not necessarily an Animal, so the compiler refuses without a cast.</p><p><code>(Dog) o</code>: Object and Dog are related, so it compiles; the object is a Dog, so no exception.</p>"],
["j1","Higher-order functions","How does Java pass a function as an argument?","<p>Pass an <b>object</b> whose class implements a one-method (functional) interface. The receiver calls that method.</p><p class='ex'><code>doTwice(IntUnaryOperator f, int x)</code> returns <code>f.applyAsInt(f.applyAsInt(x))</code>; <code>doTwice(x -&gt; 10 * x, 2)</code> is 200.</p><span class='f'>a lambda is shorthand for such an object</span><p>Comparator is exactly this pattern.</p>"],
["j1","Iterators","What do Iterable and Iterator require, and what does a for-each loop expand to?","<p><b>Iterable&lt;T&gt;</b>: <code>Iterator&lt;T&gt; iterator()</code>. <b>Iterator&lt;T&gt;</b>: <code>hasNext()</code> and <code>next()</code>.</p><span class='f'>for (T x : c) ≡ it = c.iterator(); while (it.hasNext()) { x = it.next(); … }</span><p class='ex'>A circular DLList iterator: p = sentinel.next; hasNext is p != sentinel; next returns p.item and advances.</p><p class='trap'>Only Iterables go in for-each. Keep the position in the iterator object, so two loops don’t interfere.</p>"],
["j1","Iterators","What happens if you remove from an ArrayList inside a for-each loop over it?","<span class='f'>usually ConcurrentModificationException</span><p>The list’s iterator notices the list changed behind its back and throws on the next <code>next()</code>.</p><p>Fix: use the iterator’s own <code>remove()</code>, or <code>list.removeIf(…)</code>, or loop over a copy.</p>"],
["j1","equals","What is the difference between <code>==</code> and <code>.equals</code>?","<span class='f'>== compares bits (addresses for objects); equals compares meaning</span><p>Object’s default equals is just ==, so you override it to compare contents.</p><p class='ex'><code>new String(&quot;cat&quot;) == new String(&quot;cat&quot;)</code> is false; <code>.equals</code> is true.</p><p class='trap'>Integer caching: <code>Integer a = 127, b = 127;</code> a == b is true, but with 128 it’s false. Never use == on objects for equality.</p>"],
["j1","equals","How do you write a correct equals, and what rules must it obey?","<p>Signature <code>public boolean equals(Object o)</code>. Return true if <code>this == o</code>; return false if o is null or not the right type (<code>o instanceof Pt other</code>); else compare fields.</p><span class='f'>reflexive, symmetric, transitive, consistent, x.equals(null) is false</span><p class='trap'><code>equals(Pt o)</code> is an <b>overload</b>, not an override. HashSet and ArrayList.contains call equals(Object), which is still ==.</p>"],
["j1","equals","What is the equals/hashCode contract and why does breaking it break HashSet?","<span class='f'>a.equals(b) ⟹ a.hashCode() == b.hashCode()</span><p>A HashSet looks only in the bucket given by hashCode, then uses equals there. If equal objects have different hash codes, contains looks in the wrong bucket and says false.</p><p class='ex'>Override equals without hashCode: add new Pt(1,2), then contains(new Pt(1,2)) is (almost surely) false.</p><p class='trap'>The converse isn’t required: unequal objects may share a hash code.</p>"],
["j1","Comparable","What does <code>compareTo</code> return, and how should you implement it?","<span class='f'>negative / 0 / positive = before / tie / after</span><p>Only the sign matters: <code>&quot;apple&quot;.compareTo(&quot;banana&quot;)</code> is −1.</p><p class='ex'><code>public int compareTo(Dog o) { return Integer.compare(size, o.size); }</code></p><p class='trap'>Returning <code>size - o.size</code> can overflow for large values. Comparable’s method takes one argument; Comparator’s <code>compare</code> takes two.</p>"],
["j1","Comparator","Comparable vs Comparator: when do you use each?","<p><b>Comparable</b>: the class’s one natural order, built into the class (<code>compareTo</code>). <b>Comparator</b>: an external ordering object (<code>compare(a, b)</code>); make as many as you like.</p><p class='ex'><code>dogs.sort(Comparator.comparingInt((Dog d) -&gt; d.size).reversed().thenComparing(d -&gt; d.name));</code> → biggest first, ties by name.</p><span class='f'>Comparator = a higher-order function for sorting</span>"],
["j1","Comparator","Why is <code>&lt;T extends Comparable&lt;T&gt;&gt; T max(T[] a)</code> better than a max that casts Objects?","<p>With the bound, the compiler knows every T has compareTo, so passing an array of non-comparable things is a <b>compile error</b>. A version that casts each Object fails only at runtime with ClassCastException.</p><span class='f'>generics move errors from runtime to compile time</span>"],
["j2","Asymptotics","Why do we measure runtime with Θ instead of seconds?","<span class='lb'>Meaning</span><p>Count basic steps as a function of input size N, then keep only how that count <b>grows</b>.</p><span class='lb'>Why</span><p>Seconds depend on the machine; growth rate doesn’t. Doubling N doubles a Θ(N) cost but quadruples a Θ(N²) cost on every computer.</p><span class='f'>drop lower-order terms and constants</span><p class='ex'>3N² + 10N log N + 500 ∈ Θ(N²)</p>"],
["j2","Asymptotics","Define Θ, O and Ω.","<span class='f'>R ∈ Θ(f) ⇔ k₁f ≤ R ≤ k₂f for large N</span><p><b>O</b>: only the upper half (R grows no faster than f). <b>Ω</b>: only the lower half (R grows at least as fast). <b>Θ</b>: both.</p><p class='ex'>5N² is Θ(N²), O(N³), Ω(N), but not Ω(N³).</p><p class='trap'>O is not “worst case” and Θ is not “average case.” They bound functions; each case gets its own bound.</p>"],
["j2","Asymptotics","Order these: N log N, 2ᴺ, √N, N!, log N, N², 1.","<span class='f'>1 ≺ log N ≺ √N ≺ N log N ≺ N² ≺ 2ᴺ ≺ N!</span><p>Log base doesn’t matter (bases differ by a constant factor), so Θ(log₂N) = Θ(log₁₀N).</p><p class='trap'>Constants in an exponent do matter: 4ᴺ is not Θ(2ᴺ), but 2ᴺ⁺¹ = 2·2ᴺ is.</p>"],
["j2","Sums","What are the arithmetic and geometric sums, in Θ form?","<span class='f'>1 + 2 + ⋯ + N = N(N+1)/2 ∈ Θ(N²)</span><span class='f'>1 + 2 + 4 + ⋯ + N = 2N − 1 ∈ Θ(N)</span><span class='lb'>Why geometric is Θ(last term)</span><p>Each term doubles, so the last term outweighs all earlier terms combined (1024 &gt; 1023).</p><p class='trap'>The geometric sum has only log N terms, yet it’s Θ(N), not Θ(log N) or Θ(N log N).</p>"],
["j2","Sums","What is log 1 + log 2 + ⋯ + log N in Θ?","<span class='f'>log(N!) ∈ Θ(N log N)</span><span class='lb'>Why</span><p>Upper: N terms each ≤ log N. Lower: the top half of the terms are each ≥ log(N/2), giving (N/2)·log(N/2).</p><p class='ex'>Shows up in loops like <code>for i &lt; N: for (j = i; j &gt; 0; j /= 2)</code>.</p>"],
["j2","Loops","How do you find the runtime of nested loops safely?","<ol><li>List the values the outer variable takes.</li><li>For each, count inner iterations as a formula in that variable.</li><li>Add them with a known sum.</li></ol><p>Multiplying outer × inner lengths only works when the inner loop doesn’t depend on the outer variable.</p><p class='ex'><code>for i &lt; N: for j from i to N</code> → N + (N−1) + ⋯ + 1 ∈ Θ(N²)</p>"],
["j2","Loops","<code>for (i = 1; i &lt; N; i *= 2) for (j = 0; j &lt; i; j++)</code>: Θ?","<span class='f'>Θ(N)</span><p>Inner counts are 1, 2, 4, …, N/2: a geometric sum, under N total (N = 1024 → 1023).</p><p class='trap'>“log N outer × N inner = N log N” overcounts: most outer iterations are cheap.</p>"],
["j2","Loops","<code>for (i = 0; i &lt; N; i++) for (j = 1; j &lt; N; j *= 2)</code>: Θ? And <code>for (i = 1; i * i &lt; N; i++)</code>?","<span class='f'>Θ(N log N) and Θ(√N)</span><p>First: the inner loop ignores i and always runs log₂N times, so multiplying is fine. Second: it stops once i ≥ √N.</p>"],
["j2","Recursion trees","How do you analyze a recursive method with a recursion tree?","<ol><li>Each node = one call; label it with the work done outside its recursive calls.</li><li>Per level: (number of nodes) × (work per node).</li><li>Count levels (log N for halving, N for subtracting 1).</li><li>Add the levels.</li></ol><p class='trap'>Height of the tree ≠ runtime. With two calls per level, the bottom level alone has about N nodes.</p>"],
["j2","Recursion trees","Give Θ for: T(N/2)+1, 2T(N/2)+1, T(N/2)+N, 2T(N/2)+N.","<ul><li>T(N/2) + 1: <b>log N</b> (single chain)</li><li>2T(N/2) + 1: <b>N</b> (1 + 2 + 4 + ⋯ + N calls)</li><li>T(N/2) + N: <b>N</b> (N + N/2 + ⋯ &lt; 2N)</li><li>2T(N/2) + N: <b>N log N</b> (N per level × log N levels; mergesort)</li></ul>"],
["j2","Recursion trees","<code>int h(int n) { if (n &lt;= 1) return 1; return h(n-1) + h(n-1); }</code>: Θ?","<span class='f'>Θ(2ᴺ)</span><p>N levels; level k has 2ᵏ calls; total 2ᴺ − 1 (h(20) makes 1,048,575 calls).</p><span class='lb'>Fix</span><p>Call <code>h(n-1)</code> once, store it, return <code>2 * x</code>: now Θ(N).</p>"],
["j2","Amortized","What does “amortized Θ(1)” mean for AList <code>addLast</code>?","<span class='lb'>Meaning</span><p>Over any sequence of N adds, total cost is Θ(N), so the average per add is Θ(1), even though a single resizing add costs Θ(N).</p><span class='lb'>Why ×2 works</span><p>Copies = 1 + 2 + 4 + ⋯ ≤ 2N (geometric). For 1000 adds: 1023 copies.</p><p class='trap'>Growing by +10 gives 49,600 copies for 1000 adds: Θ(N²) total, Θ(N) amortized.</p>"],
["j2","Best/worst case","Linear search for x in an array of N items: best and worst case?","<span class='f'>best Θ(1) (x first) · worst Θ(N) (x absent)</span><p>Overall you can say O(N) and Ω(1), but no single Θ.</p><p class='trap'>The best case must keep N large. “Best case: empty array” is wrong.</p>"],
["j2","Disjoint sets","What problem do disjoint sets solve, and what do they store?","<span class='lb'>Meaning</span><p>Items 0…N−1; <code>connect(p, q)</code> merges groups; <code>isConnected(p, q)</code> asks if they’re in the same group. Connectivity is transitive, and nothing is ever disconnected.</p><span class='f'>store only each item’s group, not the individual connections</span>"],
["j2","Disjoint sets","How does Quick Find work, and what does it cost?","<p><code>id[i]</code> = group label. isConnected compares labels: <b>Θ(1)</b>. connect relabels every item with p’s label to q’s: <b>Θ(N)</b>.</p><p class='ex'>[0,1,2,3] → connect(0,1) → [1,1,2,3] → connect(2,3) → [1,1,3,3] → connect(0,3) → [3,3,3,3]</p>"],
["j2","Disjoint sets","How does Quick Union work, and why can it be slow?","<p><code>parent[i]</code> forms trees; a root is its own parent and names the group. connect: <code>parent[find(p)] = find(q)</code>.</p><span class='f'>cost = height of tree; worst case Θ(N)</span><p class='ex'>connect(0,1), (1,2), (2,3), … builds a chain 0 → 1 → 2 → ⋯</p><p class='trap'>Link roots, never items: <code>parent[p] = q</code> cuts p away from its old group.</p>"],
["j2","Weighted QU","What is weighted quick union, and how does 61B store sizes?","<p>Always hang the root of the <b>smaller</b> tree (by node count) under the larger root.</p><span class='lb'>Storage</span><p>A root holds −(size); a negative entry marks a root. Lab tie rule: equal sizes → first argument’s root under second’s.</p><p class='ex'>0–7: connect(0,1) → [1,-2,-1,-1,-1,-1,-1,-1]</p>"],
["j2","Weighted QU","Prove weighted quick union trees have height ≤ log₂N.","<ol><li>Item x’s depth only grows when its tree is hung under another root.</li><li>That only happens when x’s tree is not larger, so the merged tree is at least double its old size.</li><li>After d increases, x’s tree has ≥ 2ᵈ items ≤ N, so d ≤ log₂N.</li></ol><p class='ex'>Merging 1+1, 2+2, 4+4 on 8 items reaches height exactly 3.</p>"],
["j2","Path compression","What is path compression, and what does it buy?","<p>During find(x), after locating the root, re-point every node on the walked path straight at the root.</p><span class='f'>WQU + compression: amortized ≈ constant (inverse Ackermann α(N))</span><p class='ex'>Path 0 → 1 → 3 → 7: afterwards parent[0] = parent[1] = 7.</p><p class='trap'>Only nodes on the path change; sizes stay the same; one find can still take Θ(log N).</p>"],
["j2","BSTs","State the BST property and the cost of search/insert.","<span class='f'>left subtree keys &lt; node &lt; right subtree keys (whole subtrees)</span><p>Search and insert cost <b>Θ(height)</b>. Height is ~log N when bushy, up to N − 1 when spindly.</p><p class='trap'>Inserting in sorted order builds a chain: worst case Θ(N). Checking each node only against its children doesn’t verify the property.</p>"],
["j2","BSTs","Why does 61B write <code>t.left = insert(t.left, key)</code> and <code>return t</code>?","<p>Each call returns the root of its (possibly new) subtree. At a null link, the call returns a new node, and the parent’s reassignment attaches it.</p><p>Reassigning an unchanged link is harmless, and it removes special cases for empty trees.</p>"],
["j2","Hibbard deletion","How do you delete a BST node in each of the three cases?","<ul><li><b>0 children:</b> remove it.</li><li><b>1 child:</b> parent’s link skips to that child.</li><li><b>2 children:</b> copy in the successor (go right once, then left all the way), then delete the successor from the right subtree.</li></ul><p class='trap'>The successor is not the right child. Deleting 50 with right child 70 whose left child is 60: the successor is 60.</p>"],
["j2","B-trees","Why are B-trees always balanced?","<p>New keys go into an existing <b>leaf</b>; overflowing nodes split and push a key up. New levels appear only when the root splits, which lifts every leaf at once.</p><span class='f'>all leaves at the same depth → height Θ(log N)</span><p class='trap'>Never insert directly into an internal node; keys only get there by being pushed up.</p>"],
["j2","B-trees","Insert 50, 20, 10, 30, 40 into an empty 2-3 tree.","<ol><li>[50] → [20 50] → [10 20 50] overflows: 20 up (root split).</li><li>30 → leaf [30 50].</li><li>40 → [30 40 50] overflows: 40 up into root → [20 40] with leaves [10] [30] [50].</li></ol><span class='f'>overflow: 2-3 pushes the middle up; 61B’s 2-3-4 pushes the left-middle</span>"],
["j2","LLRBs","How does an LLRB represent a 2-3 tree?","<p>A 3-node [a b] becomes two BST nodes: b, with a as its left child, joined by a <b>red</b> link. Black links are the real 2-3 edges.</p><ul><li>Red links lean left.</li><li>No node touches two red links.</li><li>Every root-to-null path has the same number of black links.</li></ul><span class='f'>1–1 with 2-3 trees; height ≤ ~2 log₂N</span>"],
["j2","LLRBs","What does <code>rotateLeft(h)</code> do?","<p>h’s right child x becomes the subtree root; h becomes x’s left child; x’s old left subtree moves to h’s right. x takes h’s color; h becomes red.</p><span class='f'>in-order (A &lt; h &lt; B &lt; x &lt; C) is unchanged</span><p class='trap'>The middle subtree B is the one that switches parents.</p>"],
["j2","LLRBs","What are the LLRB insertion fix-ups, in order?","<ol><li>Insert with a red link.</li><li>Right child red, left not → <b>rotateLeft</b>.</li><li>Left child and its left child both red → <b>rotateRight</b>.</li><li>Both children red → <b>color flip</b> (a 2-3 split: middle key moves up).</li><li>Repeat up the tree; paint the root black.</li></ol>"],
["j2","LLRBs","Insert 3, 1, 2 into an empty LLRB. What happens on the last insert?","<p>2 is a red right child of 1 → <b>rotateLeft(1)</b>; now 3 has two left reds (2, 1) → <b>rotateRight(3)</b>; 2 has two red children → <b>flip(2)</b>; root black.</p><p class='ex'>Result: 2 with black children 1 and 3, matching the 2-3 split of [1 2 3].</p>"],
["j2","Balanced trees","Worst-case search/insert: BST vs 2-3 tree vs LLRB?","<span class='f'>BST Θ(N) · 2-3 tree Θ(log N) · LLRB Θ(log N)</span><p>Balance comes from B-tree splitting; the LLRB imitates it inside a plain binary tree with rotations and flips.</p>"],
["j2","Heaps","What two properties make a binary min-heap?","<ol><li><b>Complete:</b> all levels full except the last, filled left to right.</li><li><b>Heap order:</b> every node ≤ its children.</li></ol><span class='f'>minimum always at the root</span><p class='trap'>No left-vs-right order and no sorting: a heap is much weaker than a BST, which is why updates are cheap.</p>"],
["j2","Heaps","How is a heap stored in an array (61B style)?","<span class='f'>root at index 1 · parent k/2 · children 2k, 2k+1</span><p>Completeness means reading level by level leaves no gaps, so no pointers are needed.</p><p class='ex'>[1, 3, 2, 5, 4, 8, 7]: 3 and 2 are children of 1; 5, 4 of 3; 8, 7 of 2.</p><p class='trap'>If the root is at index 0: children 2k+1, 2k+2, parent (k−1)/2.</p>"],
["j2","Heaps","How do add and removeSmallest work in a min-heap?","<ul><li><b>add:</b> place at the end, then <b>swim</b>: swap with parent while smaller.</li><li><b>removeSmallest:</b> move the last item to the root, then <b>sink</b>: swap with the <b>smaller</b> child while bigger.</li></ul><span class='f'>both Θ(log N); getSmallest Θ(1)</span><p class='trap'>Sinking toward the larger child breaks heap order.</p>"],
["j2","Heaps","Trace: add 5, 3, 8, 1, 4, 7, 2 to a min-heap, then removeSmallest.","<p>[5] → [3,5] → [3,5,8] → [1,3,8,5] → [1,3,8,5,4] → [1,3,7,5,4,8] → [1,3,2,5,4,8,7]</p><p>removeSmallest returns 1: 7 to root, sinks past 2 → <b>[2,3,7,5,4,8]</b>.</p>"],
["j2","Heaps","Is [2, 4, 3, 5, 1] a valid min-heap (root at index 1)? Where is the max of a min-heap?","<p><b>No.</b> 1 is at index 5; its parent (index 2) holds 4 &gt; 1.</p><span class='f'>the max is always a leaf (second half of the array)</span><p>Finding it costs Θ(N): a heap only knows its minimum.</p>"],
["j2","Priority queues","Compare PQ implementations: unordered array, sorted array, balanced BST, heap.","<ul><li>Unordered array: add Θ(1), remove min Θ(N)</li><li>Sorted array: add Θ(N), remove min Θ(1)</li><li>Balanced BST: all Θ(log N); awkward with duplicates</li><li>Heap: add Θ(log N), peek Θ(1), remove min Θ(log N)</li></ul>"],
["j2","Traversals","Define pre-, in-, post- and level order.","<ul><li><b>Pre:</b> node, left, right</li><li><b>In:</b> left, node, right (sorted on a BST)</li><li><b>Post:</b> left, right, node</li><li><b>Level:</b> depth by depth, left to right, using a queue</li></ul><p class='trap'>Level order is not depth-first; it needs a queue, not recursion.</p>"],
["j2","Traversals","Tree: A(B(D, E(G, ·)), C(·, F(H, I))). Give all four traversals.","<ul><li>Pre: A B D E G C F H I</li><li>In: D B G E A C H F I</li><li>Post: D G E B H I F C A</li><li>Level: A B C D E F G H I</li></ul><span class='lb'>Trick</span><p>Walk around the outside, down the left first: record a node when you pass its left side (pre), underneath (in), or its right side (post).</p>"],
["j2","Traversals","When is each traversal the natural choice?","<ul><li><b>Pre:</b> directory listing, copying a tree</li><li><b>In:</b> BST keys in sorted order</li><li><b>Post:</b> node needs children’s results first: folder sizes, deleting a tree</li><li><b>Level:</b> closest to the root first; a heap’s array is level order</li></ul>"],
["j2","Traversals","A BST has preorder 8 3 1 6 10 14. What is its postorder?","<p>Root 8; the keys &lt; 8 (3 1 6) form the left subtree rooted at 3; the keys &gt; 8 (10 14) form the right subtree rooted at 10.</p><span class='f'>postorder: 1 6 3 14 10 8</span><p class='ex'>Shortcut: inserting a BST’s preorder into an empty BST rebuilds the same tree.</p>"],
["j3","Graph basics","What is a graph, and what do “directed”, “weighted”, “connected” and “DAG” mean?","<span class='lb'>Meaning</span><p>A graph is a set of <b>vertices</b> plus a set of <b>edges</b> joining pairs of them.</p><ul><li><b>Directed</b>: edges are one-way arrows u → v.</li><li><b>Weighted</b>: each edge carries a number.</li><li><b>Connected</b> (undirected): every vertex can reach every other.</li><li><b>DAG</b>: directed graph with no directed cycle.</li></ul><span class='f'>tree = connected + acyclic → exactly V − 1 edges</span><p class='trap'>Graph traversals need a <b>marked</b> set; tree traversals don’t, because a tree has only one way to reach each node.</p>"],
["j3","Graph basics","Why does “visit every vertex and scan all its neighbors” cost Θ(V + E) and not Θ(V·E)?","<span class='lb'>Why</span><p>Each vertex v costs Θ(1 + deg v). Summing over all vertices gives Θ(V + Σ deg v).</p><span class='f'>Σ deg(v) = 2E (each edge counted from both ends)</span><p>So the total is Θ(V + 2E) = Θ(V + E).</p><p class='trap'>Keep the V term: a graph with no edges still costs Θ(V) to traverse.</p>"],
["j3","Representations","Compare an adjacency matrix and an adjacency list: space, edge test, iterate neighbors, full traversal.","<span class='lb'>Costs</span><ul><li><b>Matrix</b>: space Θ(V²); is u–v an edge? Θ(1); neighbors of v Θ(V); DFS/BFS Θ(V²).</li><li><b>List</b>: space Θ(V + E); edge test Θ(deg u); neighbors Θ(deg v); DFS/BFS Θ(V + E).</li></ul><span class='f'>real graphs are sparse → use adjacency lists</span><p class='ex'>In an undirected graph each edge is stored in <b>two</b> lists.</p>"],
["j3","DFS","How does depth-first search work, and what do preorder and postorder mean?","<span class='lb'>How</span><p>dfs(v): mark v; for each neighbor w, if w is unmarked, set edgeTo[w] = v and call dfs(w).</p><ul><li><b>Preorder</b>: order vertices are marked (entered).</li><li><b>Postorder</b>: order vertices finish (call returns).</li></ul><span class='f'>Θ(V + E) time with adjacency lists</span><p class='trap'>Postorder is not reversed preorder in general. DFS paths via edgeTo are valid but not necessarily shortest.</p>"],
["j3","DFS","Graph 0–1, 0–2, 1–3, 2–3, 3–4, 2–5, 4–6, 5–6, neighbors ascending. DFS from 0: preorder and postorder?","<span class='lb'>Trace</span><p>0 → 1 → 3 → 2 → 5 → 6 → 4. At 4 everything is marked, so 4 finishes first, then the calls unwind.</p><span class='f'>pre 0 1 3 2 5 6 4 · post 4 6 5 2 3 1 0</span><p class='ex'>edgeTo path to 6: 0 1 3 2 5 6 (5 edges), even though 0 2 5 6 has 3.</p>"],
["j3","BFS","How does breadth-first search work, and what does it guarantee?","<span class='lb'>How</span><p>Queue the source. Repeatedly dequeue v; for each unmarked neighbor w: mark it, set edgeTo[w] = v, distTo[w] = distTo[v] + 1, enqueue it.</p><span class='f'>BFS finds paths with the fewest edges</span><p>The queue always holds distance-d vertices then distance-(d+1) vertices, so vertices are discovered ring by ring.</p><p class='trap'>Fewest edges ≠ least total weight. Weighted graphs need Dijkstra.</p>"],
["j3","BFS","Same graph (0–1, 0–2, 1–3, 2–3, 3–4, 2–5, 4–6, 5–6), ascending neighbors. BFS order and distTo from 0?","<span class='lb'>Trace</span><p>Queue [0] → [1,2] → [2,3] → [3,5] → [5,4] → [4,6] → [6] → [].</p><span class='f'>order 0 1 2 3 5 4 6</span><p>distTo: 1, 2 → 1; 3, 5 → 2; 4, 6 → 3. Path to 6: 0 2 5 6.</p><p class='trap'>Mark when you <b>enqueue</b>, or a vertex can be enqueued many times.</p>"],
["j3","DFS vs BFS","DFS or BFS: which data structure, which path guarantee, which gives topological sort, worst-case extra space?","<ul><li><b>DFS</b>: recursion/stack; finds <b>some</b> path; postorder gives topological sort; Θ(V) stack on a long path.</li><li><b>BFS</b>: queue; finds <b>fewest-edge</b> paths; no topo sort; Θ(V) queue on a star (all neighbors of the center at once).</li></ul><span class='f'>both Θ(V + E) time with adjacency lists</span>"],
["j3","Topological sort","What is a topological order and how do you compute one?","<span class='lb'>Meaning</span><p>A listing of a DAG’s vertices with every edge pointing forward (u before v for each u → v), like a legal course order.</p><span class='f'>topological order = reverse DFS postorder</span><span class='lb'>How</span><p>Run DFS from <b>every</b> unmarked vertex, record postorder, reverse it. Θ(V + E).</p><p class='trap'>Exists only if there is no directed cycle, and is usually not unique. Preorder doesn’t work.</p>"],
["j3","Topological sort","Why does reverse postorder put u before v for every edge u → v?","<span class='lb'>Why</span><p>When DFS examines u → v, v is either unvisited (then dfs(v) runs and finishes inside u’s call, before u finishes) or already finished. It can’t be on the stack, because that would mean v reaches u: a cycle.</p><span class='f'>for every edge u → v: v finishes before u</span><p>So reversing postorder puts u first.</p>"],
["j3","Topological sort","DAG 0→1, 0→2, 1→3, 2→3, 3→4, 5→2, 5→6, 6→4; outer loop 0..6, neighbors ascending. Postorder and topological order?","<span class='lb'>Trace</span><p>dfs(0): 1 → 3 → 4, finishing 4, 3, 1; then 2 (3 already marked) finishes, then 0. Outer loop reaches 5: 6 finishes, then 5.</p><span class='f'>post 4 3 1 2 0 6 5 · topo 5 6 0 2 1 3 4</span><p class='trap'>Starting only from 0 would never visit 5 and 6.</p>"],
["j3","Cycles","How do you detect a cycle in a directed graph? In an undirected graph?","<ul><li><b>Directed</b>: DFS with an onStack flag. An edge to a vertex <b>on the current DFS path</b> means a cycle.</li><li><b>Undirected</b>: during DFS, a marked neighbor other than the vertex you came from; or union-find: an edge whose endpoints are already connected closes a cycle.</li></ul><p class='trap'>In a digraph, reaching an already <b>finished</b> vertex is not a cycle (0→1→3 and 0→2→3 just meet).</p>"],
["j3","Dijkstra","What does it mean to relax an edge, and what is Dijkstra’s algorithm?","<span class='lb'>Relax v → w (weight c)</span><p>If distTo[v] + c &lt; distTo[w]: set distTo[w] = distTo[v] + c, edgeTo[w] = v, lower w’s priority.</p><span class='lb'>Dijkstra</span><ol><li>distTo[s] = 0, others ∞, all in a min-PQ.</li><li>Remove the smallest; it is final.</li><li>Relax its out-edges; repeat.</li></ol><span class='f'>O((V + E) log V) with a binary heap, usually written O(E log V)</span>"],
["j3","Dijkstra","Edges A→B 2, A→C 5, B→C 1, B→D 6, C→D 2, C→E 7, D→E 1, D→F 4, E→F 1. Dijkstra from A: visit order and distances?","<span class='lb'>Trace</span><ol><li>A: B 2, C 5.</li><li>B: C → 3, D 8.</li><li>C: D → 5, E 10.</li><li>D: E → 6, F 9.</li><li>E: F → 7.</li></ol><span class='f'>order A B C D E F · dist 0 2 3 5 6 7</span><p class='ex'>C’s distance dropped twice (∞ → 5 → 3) before it was popped.</p>"],
["j3","Dijkstra","Why is Dijkstra correct, and why do negative edges break it?","<span class='lb'>Why</span><p>The popped vertex v has the smallest distTo of all unvisited vertices. Any other path to v leaves the visited set through an unvisited u with distTo[u] ≥ distTo[v], then adds edges that are ≥ 0. So it can’t be shorter.</p><span class='f'>non-negative weights ⇒ popped = final</span><p class='ex'>A→B 1, A→C 3, C→B −3, B→D 1: Dijkstra finalizes D = 2, but A→C→B→D = 1.</p><p class='trap'>Adding a constant to every edge doesn’t fix it: it penalizes paths with more edges.</p>"],
["j3","DAG paths","How do you find shortest paths in a DAG, even with negative edges? Longest paths?","<span class='lb'>How</span><p>Relax vertices in <b>topological order</b>. Every edge into v is relaxed before v is processed, so distTo[v] is final.</p><span class='f'>Θ(V + E), negative weights allowed, no PQ</span><p><b>Longest path</b> in a DAG: negate all weights, find shortest, negate back (a reduction).</p><p class='trap'>Longest path in a general graph has no known efficient algorithm.</p>"],
["j3","A*","What does A* change about Dijkstra, and when is it correct?","<span class='lb'>Meaning</span><p>PQ priority is <b>distTo[v] + h(v)</b>, where h guesses the remaining distance to the goal. Stop when the goal is popped.</p><ul><li><b>Admissible</b>: h(v) ≤ true distance to goal.</li><li><b>Consistent</b>: h(v) ≤ c(v, w) + h(w) for every edge, h(goal) = 0.</li></ul><span class='f'>consistent ⇒ correct (and ⇒ admissible); h = 0 is Dijkstra</span><p class='trap'>Only the goal’s distance is guaranteed; other vertices may be unvisited.</p>"],
["j3","A*","Show that an admissible but inconsistent heuristic can make (visit-once) A* wrong.","<p class='ex'>S→A 1, S→B 1, A→C 1, B→C 2, C→G 3 (true S→G = 5). h(A) = 4, h(B) = 1, h(C) = h(G) = h(S) = 0.</p><ol><li>Pop S: A priority 5, B priority 2.</li><li>Pop B: C distTo 3, priority 3.</li><li>Pop C at 3 (true 2), G gets 6.</li><li>Pop A: too late to fix C. G reported as 6.</li></ol><span class='f'>h(A) = 4 &gt; c(A,C) + h(C) = 1 → inconsistent</span>"],
["j3","MST","What is a minimum spanning tree, and what is the cut property?","<span class='lb'>Meaning</span><p>For a connected undirected weighted graph: a set of V − 1 edges that connects all vertices with no cycle and least total weight.</p><span class='f'>cut property: the lightest edge crossing any cut is in the MST</span><span class='lb'>Why</span><p>If the lightest crossing edge e were missing, adding it forms a cycle that crosses the cut again on a heavier edge f. Swap f for e: lighter tree, contradiction.</p><p class='trap'>An MST is not a shortest-paths tree.</p>"],
["j3","MST","True or false: (a) MST unique if weights are distinct; (b) the graph’s heaviest edge is never in the MST; (c) MST contains the shortest path between any two vertices.","<ul><li>(a) <b>True.</b></li><li>(b) <b>False</b>: if it is a bridge, every spanning tree needs it. True version: the heaviest edge <b>on a cycle</b> isn’t in the MST.</li><li>(c) <b>False</b>: triangle A–B 3, B–C 3, A–C 5. MST {A–B, B–C} but shortest A→C is the direct 5.</li></ul>"],
["j3","Prim","How does Prim’s algorithm work, and how does it differ from Dijkstra?","<span class='lb'>How</span><p>Grow one tree from a start vertex; repeatedly add the lightest edge leaving the tree (cut = tree vs rest).</p><span class='f'>priority(w) = weight of best single edge to the tree</span><p>Dijkstra uses distTo[v] + c; Prim uses just c. Same code shape, same O(E log V).</p><p class='trap'>Edges are added in the order the tree reaches them, not in sorted order.</p>"],
["j3","Prim","Edges A–C 1, B–D 2, B–C 3, A–B 4, C–D 5, D–E 6, D–F 7, C–E 8, E–F 9, E–G 10, F–G 11. Prim from A: edges in order added?","<span class='lb'>Trace</span><ol><li>A–C 1 (B 4 via A).</li><li>C–B 3 (B improves to 3; D 5, E 8).</li><li>B–D 2 (D improves to 2).</li><li>D–E 6, then D–F 7.</li><li>E–G 10.</li></ol><span class='f'>A–C, C–B, B–D, D–E, D–F, E–G · total 29</span>"],
["j3","Kruskal","How does Kruskal’s algorithm work and why is it correct?","<span class='lb'>How</span><p>Sort edges by weight. For each, lightest first: if its endpoints are not yet connected (WQU <code>connected</code>), accept it and <code>union</code> them; otherwise skip (it would make a cycle). Stop at V − 1 edges.</p><span class='lb'>Why</span><p>An accepted edge is the lightest crossing the cut (its component, rest), so the cut property applies.</p><span class='f'>O(E log E) = O(E log V), dominated by sorting</span><p class='trap'>Mid-run it is a forest, not one tree.</p>"],
["j3","Kruskal","Same 11-edge graph (weights 1…11). Which edges does Kruskal accept and reject?","<span class='lb'>Trace</span><p>Accept A–C 1, B–D 2, B–C 3. Reject A–B 4, C–D 5 (already connected). Accept D–E 6, D–F 7. Reject C–E 8, E–F 9. Accept E–G 10: now 6 = V − 1 edges.</p><span class='f'>accepted weights 1, 2, 3, 6, 7, 10 · total 29</span><p class='ex'>Same tree as Prim: distinct weights → unique MST.</p>"],
["j3","Hashing","What are the steps of a hash table lookup?","<ol><li><code>h = key.hashCode()</code> (any int, maybe negative).</li><li><code>i = Math.floorMod(h, M)</code>.</li><li>Search bucket i, comparing with <code>equals</code>.</li></ol><span class='f'>hashCode picks the bucket; equals finds the key in it</span><p class='trap'><code>-5 % 4</code> is −1 in Java; <code>Math.floorMod(-5, 4)</code> is 3. <code>Math.abs(Integer.MIN_VALUE)</code> is still negative.</p>"],
["j3","Hashing","How does Java compute a String’s hashCode? Give \"a\" and \"ab\".","<span class='f'>s[0]·31ⁿ⁻¹ + s[1]·31ⁿ⁻² + ⋯ + s[n−1]</span><p>Int arithmetic, so it overflows and wraps.</p><p class='ex'><code>\"a\"</code> → 97, <code>\"ab\"</code> → 97·31 + 98 = 3105. <code>\"Aa\"</code> and <code>\"BB\"</code> are both 2112.</p><p>Multiplying by 31 makes order matter, so anagrams don’t all collide.</p><p class='trap'>Hash codes aren’t unique: more strings than ints.</p>"],
["j3","Hashing","What is the load factor, and why does resizing keep operations Θ(1)?","<span class='f'>load factor = N / M</span><p>The average chain length is N/M. Double M when N/M passes a threshold, rehashing every item into floorMod(hash, newM). Then chains stay constant length on average.</p><p>Total resize work is M + 2M + 4M + ⋯ &lt; 2N, so <b>amortized Θ(1)</b> per insert.</p><p class='trap'>If every key has the same hashCode, resizing doesn’t help: Θ(N) per operation.</p>"],
["j3","Hashing","Integer keys 7, 12, 3, −5, 20, 15, 6 into M = 4 (append to chain). Bucket contents? After doubling to 8?","<span class='lb'>M = 4</span><p>0: 12, 20 · 1: — · 2: 6 · 3: 7, 3, −5, 15 (floorMod(−5, 4) = 3).</p><span class='lb'>M = 8 (rehash in bucket order)</span><p>3: 3, −5 · 4: 12, 20 · 6: 6 · 7: 7, 15 · others empty.</p><span class='f'>doubling M: bucket b splits into b and b + old M</span>"],
["j3","Hashing","Runtime of hash table operations: good hash with resizing vs every key colliding?","<ul><li><b>Good hash, resizing</b>: get/contains Θ(1) average; put Θ(1) amortized; one resize Θ(N); N puts Θ(N).</li><li><b>All collide</b>: every op Θ(N); N puts Θ(N²).</li></ul><span class='f'>hash tables are fast on average, not in the worst case</span>"],
["j3","equals/hashCode","State the equals/hashCode contract and why HashSet needs it.","<span class='f'>a.equals(b) ⟹ a.hashCode() == b.hashCode()</span><p>HashSet only looks in the bucket hashCode selects. If equal objects hashed differently, it would search the wrong bucket and miss the match.</p><p>The converse isn’t required: unequal objects may collide.</p><p class='trap'>Override both or neither. Object’s default hashCode is identity-based.</p>"],
["j3","equals/hashCode","A Pt class overrides equals (compares x, y) but not hashCode. What do p1.equals(p2) and set.contains(new Pt(1,2)) print after adding new Pt(1,2)?","<p><b>true</b>, then (almost surely) <b>false</b>.</p><span class='lb'>Why</span><p>The two Pt objects have different identity-based hash codes, so contains looks in a different bucket and never calls equals.</p><span class='f'>fix: <code>public int hashCode() { return Objects.hash(x, y); }</code></span>"],
["j3","equals/hashCode","Valid vs good hashCode: classify return 0;, return x + y;, a random number, and one using a field equals ignores.","<ul><li><code>return 0;</code> — <b>valid</b>, terrible (one bucket).</li><li><code>x + y</code> — valid, mediocre ((1,2) and (2,1) collide).</li><li>random — <b>invalid</b>: not deterministic.</li><li>uses a field equals ignores — <b>invalid</b>: equal objects can hash differently.</li></ul><span class='f'>valid = obeys contract; good = also spreads keys evenly</span><p class='trap'>Ignoring some fields equals uses is still valid.</p>"],
["j3","Mutable keys","Add list [1, 2] to a HashSet, then call key.add(3). What do contains(key), contains(List.of(1,2)), size() return?","<span class='f'>false, false, 1</span><ul><li><code>contains(key)</code>: new hash → wrong bucket.</li><li><code>contains([1,2])</code>: right bucket, but [1,2,3] doesn’t equal [1,2].</li><li><code>size()</code>: the list is still stored, just unreachable.</li></ul><p class='trap'>Never mutate a key in a way that changes its hashCode while it is in a hash table. Immutable keys (String, Integer) are safe.</p>"],
["j3","Tries","What is a trie and how do insert and contains work?","<span class='lb'>Meaning</span><p>A tree for strings: each link is labeled by a character, each node stands for a prefix, and a node is <b>marked</b> when its path spells a full key. Shared prefixes share nodes.</p><ul><li><b>insert</b>: walk down, creating missing children, mark the last node.</li><li><b>contains</b>: walk down; false on a missing link; else return the last node’s mark.</li></ul><span class='f'>Θ(L) for key length L, independent of N</span><p class='trap'>Reaching a node isn’t enough: with “sam” stored, contains(\"sa\") is false.</p>"],
["j3","Tries","Keys sam, sad, sap, same, a, awls. What do keysWithPrefix(\"sa\") and longestPrefixOf(\"sample\") return?","<span class='lb'>keysWithPrefix</span><p>Walk to node “sa”, collect every marked node below it (alphabetical child order): <b>sad, sam, same, sap</b>.</p><span class='lb'>longestPrefixOf</span><p>Walk s, a, m* (remember “sam”); no p child → <b>\"sam\"</b>.</p><span class='f'>longestPrefixOf = last marked node passed on the walk</span><p class='ex'>longestPrefixOf(\"awl\") = \"a\"; longestPrefixOf(\"s\") = \"\".</p>"],
["j3","Tries","How can a trie node store its children, and what does each cost?","<ul><li><b>Array of size R</b> indexed by char: Θ(1) child lookup, Θ(R) memory per node (mostly null).</li><li><b>TreeMap/BST</b>: O(log R) lookup, memory ∝ children, sorted.</li><li><b>HashMap</b>: Θ(1) average lookup, memory ∝ children, unordered.</li></ul><span class='f'>speed vs memory trade-off</span><p class='ex'>TST (ternary search trie): one char per node with less/equal/greater links, a memory-light variant.</p>"],
["j3","Tries","Trie vs balanced BST vs hash table for string keys of length L, N keys?","<ul><li><b>Trie</b>: Θ(L) contains/insert; prefix queries natural; lots of memory.</li><li><b>Balanced BST</b>: Θ(log N) compares, each up to L chars → O(L log N).</li><li><b>Hash table</b>: Θ(L) average (hashing reads the string); no prefix queries.</li></ul><span class='f'>tries win on prefix operations and misses that stop early</span><p class='trap'>“Hash is Θ(1)” ignores the Θ(L) cost of computing a String hash.</p>"],
["j4","Sorting vocabulary","What is an inversion, and how many can an array of n items have?","<span class='lb'>Meaning</span><p>A pair of positions i &lt; j whose items are out of order: a[i] &gt; a[j]. Sorting = removing every inversion.</p><span class='f'>0 (sorted) up to n(n−1)/2 (reversed)</span><p class='ex'>[1, 2, 4, 3, 5, 7, 6] has 2 inversions: (4,3) and (7,6). [5,4,3,2,1] has 10.</p><p class='trap'>Count pairs, not misplaced items: one far-away item can cause many inversions.</p>"],
["j4","Sorting vocabulary","What do “stable” and “in-place” mean for a sort?","<span class='lb'>Meaning</span><p><b>Stable:</b> items that compare equal keep their original relative order. <b>In-place:</b> Θ(1) extra memory (sometimes Θ(log n) stack allowed).</p><span class='lb'>Why stability matters</span><p>Sort by name, then stably by age: people of the same age stay alphabetical.</p><p class='trap'>Stability is invisible for primitives (two equal ints look the same), which is why Java can use an unstable quicksort for <code>int[]</code>.</p>"],
["j4","Selection sort","How does selection sort work, and what is its runtime?","<span class='lb'>How</span><p>For each position i, scan the rest for the minimum and swap it into position i.</p><span class='f'>Θ(n²) best and worst · Θ(1) space · not stable</span><p>It must scan everything remaining each pass to be sure of the minimum, even on sorted input: (n−1)+⋯+1 comparisons.</p><p class='ex'>[6,3,9,1,5,2] → pass 1: [1,3,9,6,5,2] → pass 2: [1,2,9,6,5,3].</p><p class='trap'>Not stable: [2x, 2y, 1] → [1, 2y, 2x]. Fingerprint mid-sort: prefix = globally smallest items.</p>"],
["j4","Insertion sort","How does insertion sort work? Trace [6, 3, 9, 1, 5, 2].","<span class='lb'>How</span><p>Grow a sorted prefix; slide each new item left past larger neighbors.</p><ol><li>3 6 9 1 5 2 (1 swap)</li><li>3 6 9 1 5 2 (0)</li><li>1 3 6 9 5 2 (3)</li><li>1 3 5 6 9 2 (2)</li><li>1 2 3 5 6 9 (4)</li></ol><span class='f'>10 swaps = 10 inversions</span><p class='trap'>Mid-sort fingerprint: sorted prefix, untouched suffix (the prefix isn’t the global smallest).</p>"],
["j4","Insertion sort","Why does insertion sort do exactly as many swaps as there are inversions, and what is its runtime?","<span class='lb'>Why</span><p>Each swap exchanges two <b>adjacent</b> out-of-order items, fixing exactly that one inversion and no others. It stops when none remain.</p><span class='f'>Θ(n + k), k = number of inversions</span><p>Best (sorted) Θ(n); worst (reversed) Θ(n²). Stable and in place; the fastest sort for small or nearly sorted arrays.</p><p class='ex'>Each item at most d spots from home → k ≤ nd → Θ(nd).</p>"],
["j4","Heapsort","How does heapsort work?","<span class='lb'>How</span><ol><li><b>Bottom-up heapify:</b> sink each non-leaf from the last one (index n/2−1, 0-indexed) back to the root → max-heap.</li><li>Repeat: swap root (max) with the last heap item, shrink the heap by 1, sink the new root.</li></ol><span class='f'>Θ(n log n) worst · Θ(1) space · not stable</span><p class='trap'>Uses a <b>max</b>-heap, so the largest items collect at the back. Heapify alone is Θ(n).</p>"],
["j4","Heapsort","Heapsort [6, 3, 9, 1, 5, 2] (0-indexed max-heap). What is the heap after heapify, and after the first removal?","<span class='lb'>Heapify</span><p>sink(2): no change. sink(1): 3↔5 → 6 5 9 1 3 2. sink(0): 6↔9 → <b>9 5 6 1 3 2</b>.</p><span class='lb'>First removal</span><p>Swap 9 to the end, sink 2: <b>6 5 2 1 3 | 9</b>.</p><p class='ex'>Next: 5 3 2 1 | 6 9, then 3 1 2 | 5 6 9.</p><p class='trap'>Children of k are 2k+1, 2k+2 when 0-indexed; 2k, 2k+1 when the root is at index 1.</p>"],
["j4","Mergesort","How does mergesort work, and why is it Θ(n log n)?","<span class='lb'>How</span><p>Split in half, sort each half recursively, merge by repeatedly taking the smaller front item.</p><span class='lb'>Why</span><p>Recursion tree: log₂ n levels, each level merges n items total → Θ(n) per level.</p><span class='f'>Θ(n log n) always · Θ(n) extra · stable</span><p class='ex'>Merge [3,6,9] + [1,2,5]: take 1, 2, 3, 5, then copy 6, 9.</p><p class='trap'>Stable only if ties take from the <b>left</b> half (<code>&lt;=</code>).</p>"],
["j4","Stability","Which sorts are stable, and which sorts does Java use?","<span class='lb'>Stable</span><p>Insertion, mergesort, counting, LSD/MSD radix, TimSort.</p><span class='lb'>Not stable</span><p>Selection, heapsort, Hoare-partition quicksort.</p><span class='f'>Java: primitives → dual-pivot quicksort; objects/List.sort → TimSort (stable)</span><p class='ex'>List of (Ann 20, Bo 19, Cy 20, Di 19) sorted by age → Bo Di Ann Cy.</p>"],
["j4", "Choosing a sort", "Pick a sort: (a) 20 items, nearly sorted; (b) millions of objects, must be stable; (c) tiny memory, need guaranteed n log n.", "<ul><li>(a) <b>Insertion sort</b>: Θ(n + k), tiny constants.</li><li>(b) <b>Mergesort</b>/TimSort: stable, Θ(n log n) worst.</li><li>(c) <b>Heapsort</b>: Θ(n log n) worst, Θ(1) extra.</li></ul><p class='trap'>Quicksort is usually fastest overall, but has no worst-case guarantee and isn’t stable.</p>"],
["j4","Sort table","Give best / worst / extra space for selection, insertion, heap, merge, quick.","<ul><li><b>Selection:</b> n² / n² / 1</li><li><b>Insertion:</b> n / n² / 1</li><li><b>Heap:</b> n (all equal) / n log n / 1</li><li><b>Merge:</b> n log n / n log n / n</li><li><b>Quick:</b> n log n / n² (expected n log n) / log n stack</li></ul><span class='f'>All Θ(·)</span><p class='trap'>“Quicksort is n log n” is only true of best/expected, not worst case.</p>"],
["j4","Spot the sort","Mid-sort fingerprints: how do you recognize insertion, selection, heap, merge, quick?","<ul><li><b>Insertion:</b> sorted prefix, rest untouched.</li><li><b>Selection:</b> prefix = the smallest items overall, in order.</li><li><b>Heapsort:</b> largest items sorted at the back, a max-heap in front.</li><li><b>Mergesort:</b> sorted runs of length 2, 4, 8 (or a sorted left half).</li><li><b>Quicksort:</b> some pivot in its final place, all smaller left, all larger right.</li></ul><p class='ex'>[6,3,9,1,5,2] → [3,6,1,9,2,5] is one round of bottom-up mergesort.</p>"],
["j4","Quicksort","What is the idea of quicksort?","<span class='lb'>How</span><p>Pick a pivot, <b>partition</b> so smaller items are left of it and larger are right. The pivot is now in its final position; recursively sort both sides.</p><span class='f'>Partitioned ≠ sorted: only the pivot is final</span><p class='ex'>Simple 3-way partition with leftmost pivot 5: [5,8,1,9,3,5,7,2] → [1,3,2] [5,5] [8,9,7].</p><p class='trap'>The simple 3-list version is stable but uses Θ(n) extra space.</p>"],
["j4","Hoare partition","How does Hoare partitioning work?","<span class='lb'>How</span><ol><li>Pivot = leftmost. L starts right of it, G at the right end.</li><li>L moves right past items &lt; pivot (stops at ≥).</li><li>G moves left past items &gt; pivot (stops at ≤).</li><li>Not crossed: swap, step both inward, repeat.</li><li>Crossed: swap pivot with item at G.</li></ol><p class='ex'>[5,8,1,9,3,6,7,2] → swap 8,2 → swap 9,3 → <b>[3,2,1,5,9,6,7,8]</b>.</p><p class='trap'>Stopping on equal items spreads duplicates to both sides, keeping all-equal arrays Θ(n log n).</p>"],
["j4","Quicksort runtime","Best, worst and expected runtime of quicksort, and when does the worst case happen?","<span class='f'>best Θ(n log n) · worst Θ(n²) · expected Θ(n log n)</span><span class='lb'>Worst case</span><p>Pivot is always min or max: n + (n−1) + ⋯ = Θ(n²), depth Θ(n). With a leftmost pivot, that is <b>sorted or reversed</b> input.</p><span class='lb'>Expected</span><p>A random pivot lands in the middle half half the time, so depth is O(log n), with Θ(n) work per level.</p><p class='trap'>Even 10%/90% splits give Θ(log n) depth.</p>"],
["j4", "Quicksort runtime", "Quicksort with leftmost pivot on 1000 already-sorted items: roughly how many comparisons?", "<p>Every pivot is the minimum, so each partition removes one item: 999 + 998 + ⋯ + 1 = 999·1000/2 ≈ <b>500,000</b>.</p><span class='f'>Θ(n²), recursion depth Θ(n)</span><p class='ex'>Compare: n log₂ n ≈ 10,000 for a balanced run.</p><p class='trap'>Shuffling first fixes this.</p>"],
["j4","Quicksort pivots","How do you avoid quicksort’s worst case?","<ul><li><b>Shuffle</b> first or choose a <b>random</b> pivot: worst case becomes vanishingly unlikely for every input.</li><li><b>Median of three</b>: cheap fix for sorted input.</li><li><b>Exact median</b> (linear-time select): guaranteed n log n but slow constants.</li><li><b>Introsort</b>: switch to heapsort when recursion is too deep.</li></ul><p class='trap'>A 2-way partition that sends all equal keys one way is Θ(n²) on all-duplicate input.</p>"],
["j4", "Quicksort in practice", "Mergesort and quicksort are both n log n on average. Why is quicksort usually faster?", "<p>Hoare partitioning is <b>in place</b> (no merge buffer, no copying), its inner loop is tiny, and it scans memory sequentially (good cache use).</p><span class='f'>≈ 1.39 n log₂ n comparisons expected, but fewer data moves</span><p class='trap'>Mergesort still wins when you need stability or a worst-case guarantee.</p>"],
["j4","Quickselect","How does quickselect find the k-th smallest, and what is its runtime?","<span class='lb'>How</span><p>Partition; the pivot lands at its sorted index j. If j = k stop; else recurse into only the side containing k.</p><span class='f'>expected Θ(n) · worst Θ(n²)</span><p>Why linear: n + n/2 + n/4 + ⋯ ≤ 2n, a geometric sum, because only one side is explored.</p><p class='ex'>Index 5 of [5,8,1,9,3,5,7,2]: pivot 5 → go right [8,9,7] at index 0 → pivot 8 → [7] → answer 7.</p>"],
["j4","Lower bound","Why must every comparison sort use Ω(n log n) comparisons in the worst case?","<span class='lb'>Decision tree</span><p>Each comparison is a binary branch. All n! input orders must end at different leaves, so the tree has ≥ n! leaves. Height h has ≤ 2^h leaves, so h ≥ log₂(n!).</p><span class='f'>log₂(n!) ∈ Θ(n log n)</span><p class='ex'>n = 5: 120 orders, 2⁶ = 64 &lt; 120, so 7 comparisons are needed.</p><p class='trap'>Doesn’t apply to counting/radix sort (no comparisons) or to best cases.</p>"],
["j4","Lower bound","Prove log(n!) is Θ(n log n).","<span class='lb'>Upper</span><p>n! ≤ nⁿ, so log(n!) ≤ n log n.</p><span class='lb'>Lower</span><p>The largest n/2 factors are each ≥ n/2, so n! ≥ (n/2)^(n/2), giving log(n!) ≥ (n/2)·log(n/2) = Ω(n log n).</p><span class='f'>Θ(log n!) = Θ(n log n)</span>"],
["j4","Counting sort","How does counting sort work, and what does it cost?","<span class='lb'>How</span><ol><li>Count each key (keys 0..R−1).</li><li>Running sums → starting index of each key’s block.</li><li>Scan input left to right, place each item at its key’s next slot.</li></ol><span class='f'>Θ(N + R) time and space · stable</span><p class='ex'>2a 0b 2c 1d 0e 2f → 0b 0e 1d 2a 2c 2f.</p><p class='trap'>Huge R (e.g. all 32-bit ints) makes the count array impractical.</p>"],
["j4","LSD radix","How does LSD radix sort work? Trace 253, 031, 512, 148, 023, 405, 330, 018.","<span class='lb'>How</span><p>Stable sort by the last digit, then the next, …, finally the first.</p><ol><li>ones: 330 031 512 253 023 405 148 018</li><li>tens: 405 512 018 023 330 031 148 253</li><li>hundreds: 018 023 031 148 253 330 405 512</li></ol><span class='f'>Θ(W(N + R))</span><p class='trap'>Each pass must be stable, or earlier passes’ order is lost.</p>"],
["j4","MSD radix","How does MSD radix sort differ from LSD, and what does it cost?","<span class='lb'>How</span><p>Sort by the <b>first</b> character into buckets, then sort each bucket <b>separately</b> by the next character.</p><span class='lb'>Why separate</span><p>Re-sorting the whole array by the 2nd letter would undo the 1st-letter order (cab would jump ahead of bed).</p><span class='f'>best Θ(N + R) · worst Θ(W(N + R))</span><p class='trap'>Many tiny buckets each pay Θ(R) for counts; real versions switch to insertion sort.</p>"],
["j4","Radix vs comparison","When does radix sort beat a comparison sort?","<p>When keys are short and fixed-length and N is large: 32-bit ints as 4 bytes = 4 passes of Θ(N + 256), vs ≈ N log₂ N comparisons.</p><span class='f'>LSD Θ(WN) vs mergesort Θ(N log N) comparisons (each up to Θ(W) for strings)</span><p class='trap'>Long keys that differ early favor comparison sorts (or MSD). Radix also needs digits, not just <code>compareTo</code>.</p>"],
["j4","Prefix-free codes","What is a prefix-free code and why do we want one?","<span class='lb'>Meaning</span><p>No codeword is a prefix of another. Then a decoder reading left to right knows exactly when each codeword ends, no separators needed.</p><span class='f'>prefix-free ⇔ symbols only at leaves of a binary trie</span><p class='ex'>a=0, b=10, c=110, d=111: 1100111100 → c a d b a.</p><p class='trap'>{0, 01, 1} isn’t prefix-free: 01 = “b” or “ac”.</p>"],
["j4","Huffman","How do you build a Huffman code?","<span class='lb'>How</span><ol><li>Leaf per symbol, weight = frequency, all in a min-PQ.</li><li>Remove the two smallest; new parent with summed weight; insert it.</li><li>Repeat until one tree. Code = path (left 0, right 1).</li></ol><span class='f'>Optimal prefix-free code · build Θ(R log R)</span><p class='trap'>Ties may give different trees, but the total bit count is the same. The trie must be stored with the compressed data.</p>"],
["j4","Huffman","Huffman-code A 20, B 10, C 6, D 5, E 4, F 3. Codes and total bits?","<span class='lb'>Merges</span><p>F+E=7, D+C=11, 7+B=17, 11+17=28, A+28=48.</p><span class='lb'>Codes</span><p>A 0, D 100, C 101, B 111, F 1100, E 1101.</p><span class='f'>111 bits vs 144 for fixed 3-bit codes</span><p class='ex'>1110100110001011101 decodes to BADFACE.</p>"],
["j4", "Huffman", "How do you decode a Huffman-encoded bitstring?", "<span class='lb'>How</span><p>Start at the trie root. Read a bit: 0 go left, 1 go right. On reaching a leaf, output its symbol and jump back to the root.</p><span class='f'>Θ(number of bits)</span><p class='ex'>With A 0, B 111, D 100: 1110100 → B A D.</p><p class='trap'>Works only because the code is prefix-free: a leaf is always the end of a codeword.</p>"],
["j4","Compression limits","Why can’t any lossless compressor shrink every file?","<span class='lb'>Counting argument</span><p>2ⁿ files have length n, but only 2ⁿ − 1 bitstrings are shorter. Two inputs would share an output, so decoding would fail.</p><span class='f'>Compression works only on non-random (patterned) data</span><p class='ex'>Zipping a zip file or random noise usually makes it slightly bigger.</p><p class='trap'>Repeated compression can’t keep shrinking a file.</p>"],
["j4","Compression","How does LZW differ from Huffman (briefly)?","<p><b>Huffman</b> gives short codes to frequent <b>single symbols</b>. <b>LZW</b> builds a table of repeated <b>substrings</b> while reading and outputs table indices, so it exploits repetition like “the the the”.</p><span class='f'>Huffman: symbol frequencies · LZW: repeated substrings</span>"],
["j4","Complexity","What is complexity in software, and what are its three symptoms?","<span class='lb'>Meaning</span><p>Anything about a system’s structure that makes it hard to understand or modify. It accumulates gradually.</p><ul><li><b>Change amplification:</b> a simple change needs edits in many places.</li><li><b>Cognitive load:</b> how much you must know to change it safely.</li><li><b>Unknown unknowns:</b> you can’t tell what needs changing. The worst.</li></ul><span class='f'>Causes: dependencies and obscurity</span>"],
["j4","Strategic programming","Tactical vs strategic programming?","<p><b>Tactical:</b> get the feature working as fast as possible; small hacks pile up into complexity.</p><p><b>Strategic:</b> working code isn’t enough; keep investing a little time in good design so future changes stay cheap.</p><p class='trap'>“It works” is not the finish line in a long-lived codebase.</p>"],
["j4","Deep modules","What is a deep module vs a shallow module?","<span class='lb'>Meaning</span><p><b>Deep:</b> small, simple interface hiding lots of functionality. <b>Shallow:</b> interface nearly as complex as the implementation, so it saves users little.</p><span class='f'>Best modules: maximum functionality per unit of interface</span><p class='ex'>A hash map’s put/get/remove hides hashing, resizing, collisions: deep.</p><p class='trap'>Many tiny classes ≠ good design if each is shallow.</p>"],
["j4","Information hiding","What are information hiding and information leakage?","<p><b>Hiding:</b> a module keeps its design decisions (representation, algorithm) private, so others can’t depend on them. In Java: <code>private</code> fields, returning interfaces like <code>List</code>.</p><p><b>Leakage:</b> one decision is reflected in several modules, so changing it means changing all of them.</p><p class='ex'>Public fields everywhere → change amplification and unknown unknowns.</p>"],
];

const KEY='m55-quiz7-only-cards';
let st={known:{},deck:'q7'}; try{ st=Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} };
const card=document.getElementById('card'), deckSel=document.getElementById('deck');
// Quiz 6 deck was rebuilt (v2): clear old Quiz 6 progress once, since card positions changed.
const Q6=C.findIndex(c=>'erb'.includes(c[0]));
if(!['q7','r','k','i'].includes(st.deck)) st.deck='q7';
{ const qd=new URLSearchParams(location.search).get('deck'); if(qd && [...document.querySelectorAll('#deck option')].some(o=>o.value===qd)){ st.deck=qd; save(); } }
deckSel.value=st.deck;
let queue=[], cur=null, shown=false;
const GROUPS={q6:['e','r','b'],q7:['r','k','i'],m54:['la3','de'],b61:['j1','j2','j3','j4']};
const ids=()=>C.map((c,i)=>i).filter(i=>st.deck==='all'||(GROUPS[st.deck]||[st.deck]).includes(C[i][0]));
function build(){ queue=ids().filter(i=>!st.known[i]); cur=queue.shift(); shown=false; render(); }
function render(){
  const all=ids(), done=all.filter(i=>st.known[i]).length;
  document.getElementById('bar').style.width=(all.length?100*done/all.length:0)+'%';
  document.getElementById('count').textContent=done+' of '+all.length+' learned';
  document.getElementById('left').textContent=cur==null?'':(queue.length+1)+' left in this pass';
  if(cur==null){
    card.innerHTML='<div class="done"><h2>All learned ✓</h2><p>You got every card in this deck.</p><button class="show" type="button" id="again-all">Go through them again</button></div>';
    document.getElementById('again-all').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
    return;
  }
  const c=C[cur];
  card.innerHTML='<span class="tag">'+c[1]+'</span><div class="front">'+c[2]+'</div>'+
    (shown?'<div class="back">'+c[3]+'</div><div class="btns"><button type="button" class="again">Again</button><button type="button" class="got">Got it</button></div>'
          :'<p class="hint">Answer in your head first, then check.</p><button type="button" class="show">Show answer</button>');
  if(shown){
    card.querySelector('.again').onclick=()=>{ queue.splice(Math.min(3,queue.length),0,cur); next(); };
    card.querySelector('.got').onclick=()=>{ st.known[cur]=1; save(); next(); };
  } else card.querySelector('.show').onclick=()=>{ shown=true; render(); };
}
function next(){ cur=queue.length?queue.shift():null; shown=false; render(); window.scrollTo(0,0); }
deckSel.onchange=()=>{ st.deck=deckSel.value; save(); build(); };
document.getElementById('restart').onclick=()=>{ ids().forEach(i=>delete st.known[i]); save(); build(); };
document.addEventListener('keydown',e=>{
  if(cur==null) return;
  if(!shown&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); shown=true; render(); }
  else if(shown&&e.key==='1') card.querySelector('.again').click();
  else if(shown&&(e.key==='2'||e.key===' ')){ e.preventDefault(); card.querySelector('.got').click(); }
});
build();
</script>
</body>
</html>
