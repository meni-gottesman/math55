"<ol><li>6⁶ equally likely rolls. Count x₁ + ⋯ + x₆ = 21 with 1 ≤ xᵢ ≤ 6.</li><li>Shift: yᵢ = xᵢ − 1, so y₁ + ⋯ + y₆ = 15 with 0 ≤ yᵢ ≤ 5.</li><li>No bounds: C(20, 5).</li><li>One yᵢ ≥ 6 → total 9 → C(14, 5), for each of 6 dice.</li><li>Two ≥ 6 → total 3 → C(8, 5), for each of C(6, 2) pairs. Three is impossible (18 &gt; 15).</li></ol><span class='f'>C(20,5) − 6·C(14,5) + C(6,2)·C(8,5) = 15504 − 12012 + 840 = 4332</span><p>Probability <b>4332/6⁶ ≈ 0.093</b>.</p>"],
["i","Dice sums","How many ways can 3 dice (in order) sum to 10?",
"<ol><li>yᵢ = xᵢ − 1: y₁ + y₂ + y₃ = 7 with yᵢ ≤ 5.</li><li>No bounds: C(9, 2) = 36.</li><li>One yᵢ ≥ 6 → total 1 → C(3, 2) = 3, for each of 3 dice: 9. Two ≥ 6 is impossible.</li><li>36 − 9 = <b>27</b>.</li></ol>"],
["i","Derangements","What is a derangement, and what is the formula for Dₙ?",
"<p>A <b>derangement</b> is a permutation of 1, …, n where <b>no</b> number is in its own position: i is never in spot i.</p><span class='f'>Dₙ = n! (1 − 1/1! + 1/2! − 1/3! + ⋯ + (−1)ⁿ/n!)</span><span class='lb'>Small cases</span><p class='ex'>D₃ = <b>2</b>: 231 and 312. D₄ = 24 − 24 + 12 − 4 + 1 = <b>9</b>.</p>"],
["i","Derangements","Derive the derangement formula with inclusion–exclusion.",
"<ol><li>Aᵢ = permutations with i in position i. Derangements = n! − |A₁ ∪ ⋯ ∪ Aₙ|.</li><li>Fixing r chosen numbers leaves the other n − r free to permute: each r-fold intersection has (n − r)! permutations.</li><li>There are C(n, r) choices of which r, and C(n, r)(n − r)! = n!/r!.</li><li>So Dₙ = n! − n!/1! + n!/2! − ⋯ + (−1)ⁿn!/n!, which factors into the formula.</li></ol>"],
["i","Derangements","What fraction of permutations are derangements when n is large?",
"<span class='f'>Dₙ/n! = 1 − 1/1! + 1/2! − ⋯ + (−1)ⁿ/n! → e⁻¹ ≈ 0.368</span><p>That’s the Taylor series e⁻¹ = Σ (−1)ᵏ/k!. So about <b>37%</b> of random permutations have no fixed point, almost regardless of n.</p>"],
["i","Hat-check problem","In a random permutation of 1, …, n, what is the expected number of i in position i?",
"<ol><li>Xᵢ = 1 if i is in position i, else 0. The count is X₁ + ⋯ + Xₙ.</li><li>E(Xᵢ) = (n − 1)!/n! = <b>1/n</b>: fix i, then permute the other n − 1 numbers.</li><li>Linearity: E = n · 1/n = <b>1</b>, for every n.</li></ol><p class='ex'>Much easier than derangements: expected values need only linearity, not inclusion–exclusion.</p>"],
["i","Onto functions","How many onto functions are there from an m-element set to an n-element set?",
"<span class='f'>Σ from r = 0 to n of (−1)ʳ C(n, r)(n − r)ᵐ = nᵐ − C(n,1)(n−1)ᵐ + C(n,2)(n−2)ᵐ − ⋯</span><span class='lb'>Why</span><ol><li>All functions: nᵐ (each of the m inputs picks one of n outputs).</li><li>Aᵢ = functions that <b>miss</b> output i. Onto = nᵐ − |A₁ ∪ ⋯ ∪ Aₙ|.</li><li>Missing r chosen outputs leaves n − r choices per input: (n − r)ᵐ functions, and C(n, r) ways to choose the r.</li></ol>"],
["i","Onto functions","Rosen: how many onto functions from a 5-element set to a 3-element set?",
"<span class='f'>3⁵ − 3·2⁵ + 3·1⁵ = 243 − 96 + 3 = 150</span><p><b>150.</b> The last term C(3, 3)·0⁵ = 0.</p>"],
["i","Onto functions","How many onto functions from a 4-element set to a 2-element set?",
"<span class='f'>2⁴ − 2·1⁴ = 14</span><p>All 16 functions except the 2 constant ones.</p>"],
// ================= QUIZ 7: RELATIONS (Lecture 23, Rosen 9.1) =================
["l","Relations","What is a binary relation from A to B?",
"<span class='f'>R ⊆ A × B</span><p>A relation is just a <b>set of ordered pairs</b> (a, b) with a ∈ A and b ∈ B. Write <b>aRb</b> when (a, b) ∈ R. Any set of pairs counts, with or without a pattern.</p><span class='lb'>Examples</span><ul><li>A = {1, 2, 3}, B = {a, b, c, d}, R = {(1,a), (1,b), (2,c), (2,d)}: 1Ra true, 3Ra false.</li><li>Classes and classrooms: Math 55 R Wheeler 150.</li><li>Web pages: aRb if page a links to page b.</li></ul><p class='trap'>Order matters: aRb doesn’t mean bRa.</p>"],
["l","Relations","Give the standard examples of relations on numbers and on sets.",
"<ul><li><b>Numbers:</b> =, &lt;, ≤ on ℝ; divisibility a | b; congruence a ≡ b (mod m); relatively prime (gcd(a, b) = 1).</li><li><b>Sets:</b> “element of” ∈ from A to P(A); subset ⊆ on P(C).</li><li><b>Empty relation</b> ∅: nothing is related. <b>Complete relation</b> A × B: everything is related.</li><li><b>Graph of a function f</b>: {(a, b) : f(a) = b}. For f(x) = x²: 2R4 is true, 4R2 is false.</li></ul>"],
["l","Relations","What is a relation on a set A, and how do you draw one?",
"<p>A relation on A is a relation from A to itself: a subset of A × A.</p><span class='lb'>Arrow diagram</span><p>Draw a dot for each element, an arrow a → b whenever aRb, and a <b>loop</b> at a whenever aRa.</p><p class='ex'>Running example: R = {(1,1), (1,2), (2,2), (1,3), (2,3)} on {1, 2, 3}: loops at 1 and 2, arrows 1→2, 1→3, 2→3.</p>"],
["l","Reflexive","When is a relation reflexive? Is R = {(1,1), (1,2), (2,2), (1,3), (2,3)} on {1, 2, 3} reflexive?",
"<span class='f'>reflexive: aRa for every a ∈ A</span><p>In the diagram, a loop at <b>every</b> dot. To show it fails, find one a with a R̸ a.</p><p><b>R is not reflexive</b>: (3, 3) ∉ R.</p>"],
["l","Reflexive","Which are reflexive: ⊆, divisibility on positive integers, congruence mod m, gcd(a, b) = 1, gcd(a, b) ≠ 1?",
"<ul><li>⊆: <b>yes</b>, every set is a subset of itself.</li><li>|: <b>yes</b>, a | a.</li><li>≡ (mod m): <b>yes</b>, a ≡ a.</li><li>gcd = 1: <b>no</b>, gcd(2, 2) = 2.</li><li>gcd ≠ 1: <b>no</b>, gcd(1, 1) = 1.</li></ul><p class='trap'>A relation and its opposite can both fail to be reflexive. One failing element is enough.</p>"],
["l","Symmetric & antisymmetric","Define symmetric and antisymmetric. Are they opposites?",
"<span class='f'>symmetric: aRb ⟹ bRa<br>antisymmetric: aRb and bRa ⟹ a = b</span><p><b>Symmetric:</b> every arrow has a return arrow. <b>Antisymmetric:</b> no two-way arrows between <b>different</b> elements (loops are fine).</p><p class='trap'>Not opposites. “Antisymmetric” is not “not symmetric”. A relation can be both (=), neither, or just one.</p>"],
["l","Symmetric & antisymmetric","Is R = {(1,1), (1,2), (2,2), (1,3), (2,3)} symmetric? Antisymmetric?",
"<p><b>Not symmetric:</b> 1R2 but 2 R̸ 1.</p><p><b>Antisymmetric:</b> there is no pair of different elements with arrows both ways.</p>"],
["l","Symmetric & antisymmetric","Symmetric? Antisymmetric? ≤ on ℝ, ⊆, divisibility on ℤ⁺, gcd = 1, congruence mod 3.",
"<ul><li>≤: not symmetric (1 ≤ 3, 3 ≰ 1); <b>antisymmetric</b>.</li><li>⊆: not symmetric; <b>antisymmetric</b> (A ⊆ B and B ⊆ A ⟹ A = B).</li><li>| on ℤ⁺: not symmetric (2 | 4, 4 ∤ 2); <b>antisymmetric</b>.</li><li>gcd = 1: <b>symmetric</b>; not antisymmetric (2R3, 3R2, 2 ≠ 3).</li><li>≡ mod 3: <b>symmetric</b>; not antisymmetric (1 ≡ 4 and 4 ≡ 1).</li></ul><p class='trap'>Divisibility on all of ℤ is <b>not</b> antisymmetric: 2 | −2 and −2 | 2.</p>"],
["l","Transitive","When is a relation transitive, and how do you check a finite one?",
"<span class='f'>transitive: aRb and bRc ⟹ aRc</span><p>In the diagram: any two-step path a → b → c needs a direct arrow a → c.</p><span class='lb'>How to check</span><ol><li>For each (a, b) in R, find every (b, c) in R starting where it ends.</li><li>Check (a, c) ∈ R. One missing pair disproves it.</li></ol><p class='ex'>Running example: 1R2 and 2R3, and 1R3 ✓; the other chains use loops. <b>Transitive.</b></p>"],
["l","Transitive","Is R = {(1, 2), (2, 1)} on {1, 2} transitive?",
"<p><b>No.</b> 1R2 and 2R1 would require 1R1, which is missing (and 2R2 too).</p><p class='trap'>Watch for chains that come back to where they started: they force loops.</p>"],
["l","Transitive","Transitive? ≤, ⊆, divisibility, congruence mod m, gcd = 1, gcd ≠ 1.",
"<ul><li>≤, ⊆, |, ≡ (mod m): all <b>transitive</b>.</li><li>gcd = 1: <b>not</b>: 2R3 and 3R4, but gcd(2, 4) = 2.</li><li>gcd ≠ 1: <b>not</b>: 2S6 and 6S3, but gcd(2, 3) = 1.</li></ul>"],
["l","Properties","Fill in reflexive / symmetric / antisymmetric / transitive for =, <, ≤, ⊆, | (ℤ⁺), ≡ (mod m), gcd = 1.",
"<ul><li><b>=</b>: R S A T (all four).</li><li><b>&lt;</b>: not R, not S, A, T.</li><li><b>≤, ⊆, |</b>: R, not S, A, T.</li><li><b>≡ mod m</b>: R, S, not A, T.</li><li><b>gcd = 1</b> (and gcd ≠ 1): not R, S, not A, not T.</li></ul><p class='ex'>&lt; is antisymmetric <b>vacuously</b>: a &lt; b and b &lt; a never both happen.</p>"],
["l","Properties","Which relations are both symmetric and antisymmetric? Give one that is neither symmetric nor transitive.",
"<p><b>Both:</b> exactly the relations with no arrows between different elements, i.e. only loops. Examples: = and ∅. If aRb with a ≠ b, symmetry gives bRa, and then antisymmetry would force a = b, a contradiction.</p><p><b>Neither symmetric nor transitive:</b> {(1, 2), (2, 3)} on {1, 2, 3}: 1R2 but 2 R̸ 1, and 1R2, 2R3 but 1 R̸ 3.</p>"],
["l","Counting relations","If |A| = n, how many relations, reflexive relations and symmetric relations are there on A?",
"<ul><li><b>All:</b> A × A has n² pairs, each in or out: <b>2^(n²)</b>.</li><li><b>Reflexive:</b> the n loops (a, a) are forced in, and the other n² − n pairs are free: <b>2^(n² − n)</b>.</li><li><b>Symmetric:</b> the n loops are free, and each of the C(n, 2) pairs {a, b} is decided together (both in or both out): <b>2^(n + C(n,2)) = 2^(n(n+1)/2)</b>.</li></ul><p class='ex'>n = 2: 16, 4, 8.</p>"],
["l","Counting relations","Rosen: how many antisymmetric relations on an n-element set?",
"<span class='f'>2ⁿ · 3^C(n,2)</span><p>The loops are free (2 choices each). For each pair {a, b} of different elements there are 3 allowed options: only (a, b), only (b, a), or neither. Both is forbidden.</p><p class='ex'>n = 2: 4 · 3 = 12.</p>"],
["l","Composition","What is the composition S ∘ R, and how do you compute it?",
"<span class='f'>S ∘ R = {(a, c) : there is b with aRb and bSc}</span><p>R goes from A to B, S from B to C; S ∘ R goes from A to C. Do <b>R first</b>, then S, just like g ∘ f for functions.</p><span class='lb'>How</span><ol><li>For each (a, b) in R, find every pair in S starting with b.</li><li>Each (b, c) found gives (a, c).</li></ol><p class='trap'>S ∘ R and R ∘ S are usually different.</p>"],
["l","Composition","R = {(1,a), (1,b), (2,c)} and S = {(a,x), (b,y), (c,x)}. Find S ∘ R.",
"<p>1 → a → x, 1 → b → y, 2 → c → x.</p><span class='f'>S ∘ R = {(1, x), (1, y), (2, x)}</span>"],
["l","Composition","Lecture 23: R is “gcd(a, b) = 1” on positive integers. What is R ∘ R?",
"<p><b>Every pair (a, b)</b>, even (2, 2).</p><p>For any a, b pick a prime p bigger than both. Then gcd(a, p) = 1 and gcd(p, b) = 1, so aRp and pRb, hence a (R ∘ R) b.</p>"],
["l","Powers","What are the powers Rⁿ of a relation, and what does a Rⁿ b mean?",
"<span class='f'>R¹ = R, &nbsp;Rⁿ⁺¹ = Rⁿ ∘ R</span><p>a Rⁿ b exactly when there’s a <b>path of length n</b> from a to b: a = a₀ → a₁ → ⋯ → aₙ = b, each step an arrow of R.</p><span class='lb'>Rosen 9.1</span><p>R is transitive ⟺ Rⁿ ⊆ R for every n ≥ 1: paths of any length must already be direct arrows.</p>"],
["l","Powers","Lecture 23: R = {(1,2), (2,3), (3,1)} on {1, 2, 3}. Find R², R³, R⁴.",
"<p>R is the cycle 1 → 2 → 3 → 1.</p><ol><li>R² (two steps): <b>{(1,3), (2,1), (3,2)}</b>.</li><li>R³ (three steps, back home): <b>{(1,1), (2,2), (3,3)}</b>.</li><li>R⁴ = <b>R</b> again.</li></ol><p class='ex'>So the powers repeat every 3: R = R⁴ = R⁷ = ⋯, R² = R⁵ = ⋯, R³ = R⁶ = ⋯</p>"],
// ================= cards55-late.js =================
["q","Closures","What is the closure of a relation R with respect to a property P?","<span class='lb'>Meaning</span><p>The <b>smallest</b> relation that contains R and has property P. Smallest means it sits inside every relation that contains R and has P.</p><p>To prove something is the closure: it contains R, it has P, and every pair you added was <b>forced</b>.</p><p class='trap'>Closures exist only for properties you can fix by adding pairs. If (1, 1) ∈ R there is no “irreflexive closure”.</p>"],
["q","Closures","What are the reflexive closure and the symmetric closure of R?","<span class='f'>reflexive: R ∪ Δ, &nbsp;Δ = {(a, a) : a ∈ A}<br>symmetric: R ∪ R⁻¹, &nbsp;R⁻¹ = {(b, a) : (a, b) ∈ R}</span><p>Add every missing loop; add every missing reverse arrow. Both are forced, and the result already has the property.</p><p class='ex'>R = {(1,2), (2,3), (3,4), (4,2)} on {1,2,3,4}: reflexive closure adds 4 loops; symmetric closure adds (2,1), (3,2), (4,3), (2,4).</p>"],
["q","Closures","What is the connectivity relation R*?","<span class='f'>R* = R ∪ R² ∪ R³ ∪ ⋯</span><p>a R* b when there is a path of some positive length from a to b, each step a pair of R. (Recall a Rⁿ b means a path of exactly n steps.)</p><p class='ex'>For R = {(1,2), (2,3), (3,4), (4,2)}: 1 reaches 2, 3, 4; each of 2, 3, 4 reaches 2, 3, 4. R* has 12 pairs.</p>"],
["q","Closures","If |A| = n, how long can the paths you need for R* be? Why?","<span class='f'>R* = R ∪ R² ∪ ⋯ ∪ Rⁿ</span><p>A path of length m visits m + 1 spots. If m &gt; n, some element repeats (pigeonhole); cut out the loop between the repeats to get a shorter path with the same ends. So length ≤ n always suffices (≤ n − 1 if a ≠ b).</p>"],
["q","Closures","Prove that the transitive closure of R is R*.","<ol><li><b>Contains R:</b> R = R¹ ⊆ R*.</li><li><b>Transitive:</b> a path a→⋯→b glued to a path b→⋯→c is a path a→⋯→c.</li><li><b>Smallest:</b> if S ⊇ R is transitive, each step of a path is in S, and transitivity collapses the path step by step, so a S b. Hence R* ⊆ S. ∎</li></ol>"],
["q","Closures","How do you find a transitive closure by hand? What traps are there?","<span class='lb'>Recipe</span><p>For each a, list everything reachable by following arrows one or more steps. Add (a, b) for each reachable b.</p><p class='ex'>{(1,2), (2,1), (3,3)} on {1,2,3} → {(1,1), (1,2), (2,1), (2,2), (3,3)}.</p><p class='trap'>R ∪ R² isn’t enough in general: {(1,2), (2,3), (3,4)} needs (1,4) from 3 steps. And (a, a) appears only if a lies on a circuit; the transitive closure is not automatically reflexive.</p>"],
["q","Closures","Does the order of closures matter? How do you get the smallest equivalence relation containing R?","<p>Yes. A symmetric closure can destroy transitivity: R = {(1,2), (3,2)} is transitive, but its symmetric closure has 1→2→3 without (1,3).</p><span class='f'>smallest equivalence relation ⊇ R: reflexive, then symmetric, then transitive closure</span><p>Transitive closure preserves reflexive and symmetric, so doing it last is safe.</p>"],
["q","Closures","What is the smallest equivalence relation on {1, 2, 3, 4} containing (1,2) and (2,3)?","<p>Close up: reflexive adds all loops, symmetric adds (2,1), (3,2), transitive adds (1,3), (3,1). The result is “same block” for the partition <b>{1, 2, 3}, {4}</b>.</p><span class='f'>3² + 1² = 10 pairs</span><p class='ex'>Shortcut: an equivalence closure just merges everything connected by R into one block.</p>"],
["q","Closures","What is Warshall’s algorithm doing?","<span class='f'>Wₖ[i][j] = Wₖ₋₁[i][j] ∨ (Wₖ₋₁[i][k] ∧ Wₖ₋₁[k][j])</span><p>Wₖ records paths whose <b>interior stops</b> lie in {1, …, k}. At step k: everyone who reaches k gets connected to everywhere k goes. Wₙ is the matrix of R*.</p><p class='ex'>R = {(1,3), (2,1), (3,4)}: k=1 adds (2,3); k=3 adds (1,4), (2,4). Closure {(1,3), (1,4), (2,1), (2,3), (2,4), (3,4)}.</p><p class='trap'>Use pairs added at earlier steps: (2,3) from k = 1 is what gives (2,4) at k = 3.</p>"],
["q","Closures","How do Boolean matrix products relate to relations?","<span class='f'>M(R²) = M(R) ⊙ M(R); &nbsp;M(R*) = M(R) ∨ M(R)^[2] ∨ ⋯ ∨ M(R)^[n]</span><p>Boolean product: multiply like matrices but use “or” for + and “and” for ×. Entry (i, j) is 1 when some k has iRk and kRj, i.e. a 2-step path. ∨ is entrywise “or”.</p>"],
["q","Equivalence relations","What is an equivalence relation? What does it mean intuitively?","<span class='f'>reflexive + symmetric + transitive</span><p>It says “a and b are the same in one particular respect”: same remainder, same length, same birthday. Everything is the same as itself, sameness goes both ways, and two things the same as a third are the same as each other.</p>"],
["q","Equivalence relations","What is the fastest way to prove a relation is an equivalence relation?","<span class='f'>a ∼ b ⟺ f(a) = f(b) &nbsp;is always an equivalence relation</span><p>Rewrite the relation as “same value of some function f”. It inherits reflexive, symmetric, transitive from =. Otherwise check the three properties directly.</p><p class='ex'>a ≡ b (mod m) ⟺ a mod m = b mod m. Same length: f = length. x − y ∈ ℤ ⟺ same fractional part.</p>"],
["q","Equivalence relations","Prove congruence mod m is an equivalence relation.","<ol><li>Reflexive: a − a = 0·m.</li><li>Symmetric: a − b = km ⇒ b − a = (−k)m.</li><li>Transitive: a − b = km, b − c = lm ⇒ a − c = (k + l)m.</li></ol><p class='ex'>Classes mod 4: [0], [1], [2], [3]; [7] = [3] = [−1].</p>"],
["q","Equivalence relations","Give non-examples of equivalence relations, naming the failing property.","<ul><li>|x − y| ≤ 1 on ℝ: <b>not transitive</b> (0∼1, 1∼2, 0≁2).</li><li>a | b on ℤ⁺: <b>not symmetric</b>.</li><li>Empty relation on a nonempty set: symmetric and transitive (vacuously) but <b>not reflexive</b>.</li></ul><p class='trap'>“aRb and bRa give aRa” fails if a is related to nothing. Symmetric + transitive does not imply reflexive.</p>"],
["q","Equivalence relations","On ℤ, a ∼ b when a² ≡ b² (mod 5). Equivalence relation? Classes?","<p>Yes: it is f(a) = f(b) with f(a) = a² mod 5.</p><p>Squares mod 5: 0 → 0, ±1 → 1, ±2 → 4. So <b>three classes</b>: a ≡ 0; a ≡ ±1; a ≡ ±2 (mod 5).</p><p class='trap'>Not five classes: 1 and 4 are equivalent since 1 ≡ 16 (mod 5).</p>"],
["q","Equivalence relations","What is an equivalence class? What is a representative?","<span class='f'>[a] = {x ∈ A : x ∼ a}</span><p>Everything equivalent to a. Any member of [a] can stand for the whole class: a representative.</p><p class='ex'>Same length on bit strings: [0110] = all 16 strings of length 4. On ℝ with x − y ∈ ℤ: [0.25] = {…, −0.75, 0.25, 1.25, …}, one representative in [0, 1).</p>"],
["q","Equivalence relations","For an equivalence relation, how are aRb, [a] = [b], and [a] ∩ [b] ≠ ∅ related? Prove it.","<span class='f'>aRb ⟺ [a] = [b] ⟺ [a] ∩ [b] ≠ ∅</span><ol><li>aRb ⇒ [a] ⊆ [b]: x ∈ [a] means xRa, with aRb gives xRb. By symmetry also [b] ⊆ [a].</li><li>[a] = [b] ⇒ it contains a (reflexive), so nonempty.</li><li>c in both ⇒ cRa, cRb ⇒ aRc, cRb ⇒ aRb.</li></ol><p>So two classes are identical or disjoint.</p>"],
["q","Equivalence relations","What is a partition? Why do equivalence classes form one?","<span class='f'>partition: nonempty, pairwise disjoint blocks whose union is A</span><ol><li>a ∈ [a] by reflexivity: no class is empty and the classes cover A.</li><li>Two classes that meet are equal, so distinct classes are disjoint. ∎</li></ol><p class='trap'>[0] = [3] = [6] mod 3. List each block once.</p>"],
["q","Equivalence relations","How does a partition give an equivalence relation?","<span class='f'>a ∼ b ⟺ a and b are in the same block</span><p>Reflexive: a is in some block. Symmetric: obvious. Transitive: if a, b share a block and b, c share a block, b is in both, and blocks are disjoint, so it’s one block.</p><p>Equivalence relations on A ⟷ partitions of A, a one-to-one correspondence.</p>"],
["q","Equivalence relations","How many ordered pairs are in an equivalence relation with given class sizes?","<span class='f'>#pairs = Σ (class size)²</span><p>Every ordered pair inside a block is in the relation, and no pair across blocks.</p><p class='ex'>Classes {1,2,3}, {4,5}, {6}: 9 + 4 + 1 = 14 pairs. Sizes 4, 2, 1: 16 + 4 + 1 = 21.</p>"],
["q","Equivalence relations","How many equivalence relations are there on an n-element set?","<span class='f'>Bell numbers Bₙ: 1, 2, 5, 15, 52, 203 (n = 1…6)</span><p>Same as counting partitions.</p><p class='ex'>B₄ by block sizes: 4 → 1; 3+1 → 4; 2+2 → 3; 2+1+1 → 6; 1+1+1+1 → 1. Total 15.</p>"],
["q","Equivalence relations","How many equivalence relations on an n-set have exactly 2 classes? Why?","<span class='f'>2ⁿ⁻¹ − 1</span><p>Look at element 1’s block. Each of the other n − 1 elements joins it or not: 2ⁿ⁻¹ ways. Subtract the case where all join (only one class).</p><p class='ex'>n = 5: 15 (= 5 of type 4+1, plus 10 of type 3+2).</p>"],
["q","Equivalence relations","How many ways to split 6 people into three unlabeled pairs?","<span class='f'>6! / (2!³ · 3!) = 15</span><p>Line them up and pair neighbors (6!), then divide by the swaps inside each pair (2!³) and by the order of the pairs (3!).</p><p class='trap'>Blocks of equal size are unlabeled: {1,2},{3,4},{5,6} is the same partition in any order.</p>"],
["q","Equivalence relations","How many equivalence relations on {1, 2, 3, 4} have 1 ∼ 2?","<p>Glue 1 and 2 into one object. Partitions of the 3 objects {12, 3, 4}: B₃ = <b>5</b>.</p>"],
["q","Partial orders","What is a partial order? A poset?","<span class='f'>partial order = reflexive + antisymmetric + transitive</span><p>A set with a partial order is a poset (S, ≼). Antisymmetry: two <b>different</b> elements can’t each be below the other.</p><p class='ex'>(ℤ, ≤), (ℤ⁺, |), (P(S), ⊆).</p><p class='trap'>(ℤ, &lt;) isn’t one (not reflexive). | on all of ℤ isn’t (3 | −3, −3 | 3).</p>"],
["q","Partial orders","What do comparable, total order, chain and well-ordered mean?","<ul><li><b>Comparable:</b> a ≼ b or b ≼ a. In (ℤ⁺, |), 2 and 3 are incomparable.</li><li><b>Total (linear) order:</b> every pair comparable. A totally ordered set is a <b>chain</b>.</li><li><b>Well-ordered:</b> total, and every nonempty subset has a least element. (ℕ, ≤) yes; (ℤ, ≤) no.</li></ul><p class='ex'>({1, 2, 4, 8}, |) is a chain; (P({a,b}), ⊆) is not.</p>"],
["q","Partial orders","What is lexicographic order on pairs and on strings?","<span class='f'>(a₁, a₂) ≺ (b₁, b₂) ⟺ a₁ ≺ b₁, or (a₁ = b₁ and a₂ ≺ b₂)</span><p>The first coordinate decides; only a tie passes to the next. Strings: first differing letter decides; a proper prefix comes first.</p><p class='ex'>(2, 5) ≺ (3, 1). ab ≺ abc ≺ b.</p><p class='trap'>Not coordinatewise: under the product order (2, 5) and (3, 1) are incomparable.</p>"],
["q","Partial orders","How do you draw a Hasse diagram?","<ol><li>Drop loops.</li><li>Drop every edge implied by transitivity: keep a–b only if b <b>covers</b> a (a ≺ b, nothing strictly between).</li><li>Put larger elements higher; no arrowheads.</li></ol><p>a ≼ b ⟺ you can climb from a to b going up.</p><p class='ex'>Divisors of 12: edges 1–2, 1–3, 2–4, 2–6, 3–6, 4–12, 6–12.</p><p class='trap'>No edge 1–12 or 2–12: something sits between.</p>"],
["q","Partial orders","What are the Hasse diagram edges of ({1, 2, 3, 6, 9, 18}, |)?","<p>1–2, 1–3, 2–6, 3–6, 3–9, 6–18, 9–18 (seven edges).</p><p>1 is least, 18 is greatest. 2 and 9 are incomparable; 2 reaches 18 only through 6.</p><p class='trap'>No edge 3–18: 6 and 9 sit between.</p>"],
["q","Partial orders","Maximal vs greatest, minimal vs least: what’s the difference?","<ul><li><b>Maximal:</b> nothing is strictly above it.</li><li><b>Greatest:</b> it is above <b>everything</b>.</li></ul><p>Same for minimal / least. Greatest ⇒ unique and the only maximal; maximal can just be incomparable to others.</p><p class='ex'>{2, 3, 4, 6, 9, 12, 18} under |: minimal 2, 3; maximal 12, 18; no greatest or least.</p>"],
["q","Partial orders","Why is a greatest element unique, and why does every finite nonempty poset have a minimal element?","<p><b>Unique:</b> if a, a′ are both greatest, a ≼ a′ and a′ ≼ a, so a = a′ by antisymmetry.</p><p><b>Minimal exists:</b> keep stepping down to something strictly smaller. In a finite set you’d eventually repeat, giving a ≺ ⋯ ≺ a, impossible. So you get stuck at a minimal element.</p><p class='ex'>Infinite posets can fail: (ℤ, ≤) has none.</p>"],
["q","Partial orders","Define upper bound, lower bound, lub and glb.","<span class='f'>u upper bound of A: a ≼ u ∀a ∈ A; &nbsp;lub = least upper bound</span><p>Lower bound and glb (greatest lower bound) are the mirror images. Bounds are taken in the whole poset, not just A.</p><p class='ex'>In {2, 3, 4, 6, 9, 12, 18} under |: lub{2, 3} = 6 (upper bounds 6, 12, 18); {2, 3} has no lower bound; glb{12, 18} = 6; {4, 9} has no bounds at all.</p><p class='trap'>Upper bounds may exist with no <b>least</b> one: then no lub.</p>"],
["q","Partial orders","In {2, 3, 4, 6, 9, 12, 18} under |, find lub and glb of {6, 9} and of {2, 9}.","<ul><li>{6, 9}: upper bounds {18} → lub 18; lower bounds {3} → glb 3.</li><li>{2, 9}: upper bounds {18} → lub 18; no lower bounds → no glb.</li></ul><p class='trap'>lcm(6, 9) = 18 happens to be in the set here; in a subset of ℤ⁺ the lub need not be the lcm, or may not exist (lcm(4, 9) = 36 is missing).</p>"],
["q","Partial orders","What are lub and glb in (ℤ⁺, |) and in (P(S), ⊆)?","<span class='f'>(ℤ⁺, |): lub = lcm, glb = gcd<br>(P(S), ⊆): lub = ∪, glb = ∩</span><p>lcm(a, b) is a common multiple dividing every common multiple; gcd(a, b) is a common divisor divisible by every common divisor.</p>"],
["q","Partial orders","What is a lattice? Give examples and a non-example.","<span class='f'>lattice: every pair has a lub and a glb</span><ul><li>(ℤ⁺, |), divisors of n, (P(S), ⊆), any total order.</li><li><b>Not:</b> ({1, 2, 3, 4, 5}, |), since {2, 3} has no upper bound.</li></ul><p class='trap'>To show “not a lattice”, name one pair and show its upper (or lower) bounds have no least (greatest) element.</p>"],
["q","Partial orders","What is a topological sort, and how do you find one?","<p>A total order that respects the partial order: a ≺ b ⇒ a listed before b.</p><span class='lb'>Algorithm</span><p>Repeatedly pick any <b>minimal</b> element of what’s left, write it down, delete it.</p><p class='ex'>Tasks: A, B before C; B before D; C, D before E; E before F. One sort: B, A, C, D, E, F. (5 sorts in all.)</p><p class='trap'>Incomparable elements may go in either order; every element must appear.</p>"],
["q","Partial orders","Hasse diagram of P({a, b, c})? How many topological sorts do the divisors of 12 have?","<p>P({a,b,c}) is a cube: ∅ at the bottom, three singletons, three pairs, {a,b,c} on top; each set joined to those with one more element.</p><p class='ex'>Divisors of 12: 1 first, 12 last; 2 before 4 and 6; 3 before 6. Exactly 5 sorts, e.g. 1, 3, 2, 6, 4, 12.</p>"],
["g","Graph vocabulary","What is a graph? Simple graph vs multigraph vs pseudograph vs directed graph?","<span class='f'>G = (V, E): vertices and edges</span><ul><li><b>Simple:</b> undirected, no loops, no multiple edges.</li><li><b>Multigraph:</b> multiple edges allowed, no loops.</li><li><b>Pseudograph:</b> loops and multiple edges.</li><li><b>Directed:</b> edges (u, v) have a direction; a simple digraph is exactly a relation on V.</li></ul><p class='trap'>“Graph” on an exam usually means simple unless stated.</p>"],
["g","Graph vocabulary","How many labeled simple graphs are there on n vertices?","<span class='f'>2^C(n,2)</span><p>Each of the C(n, 2) possible edges is in or out.</p><p class='ex'>n = 4: 2⁶ = 64. Up to isomorphism only 11 (and 4 for n = 3).</p>"],
["g","Degree","What is the degree of a vertex? Isolated? Pendant?","<p>deg(v) = number of edges at v, with a <b>loop counting twice</b>. deg 0: isolated. deg 1: pendant. N(v) = set of neighbors.</p>"],
["g","Degree","State and prove the handshaking theorem.","<span class='f'>Σ deg(v) = 2|E|</span><p>Count edge-ends. Each edge has 2 ends, so 2|E| ends. deg(v) counts the ends at v (a loop puts both ends at v). Summing over v counts each end once. ∎</p><p class='ex'>Degrees 3, 3, 2, 2, 2 → 6 edges. 9 vertices of degree 4 → 18 edges.</p>"],
["g","Degree","Why does every graph have an even number of odd-degree vertices?","<p>Σ deg = 2|E| is even. The even degrees add to something even, so the odd degrees must add to something even. A sum of odd numbers is even only when there are evenly many of them. ∎</p><p class='ex'>11 people each shaking hands with exactly 3 others: sum 33 is odd, impossible.</p>"],
["g","Degree","Is there a simple graph with degrees 5, 5, 4, 3, 2, 1?","<p><b>No</b>, even though the sum 20 is even. With 6 vertices, degree 5 means adjacent to everyone. Two such vertices give every vertex degree ≥ 2, contradicting the 1.</p><p class='trap'>Even sum is necessary, not sufficient. Also check degree ≤ n − 1 and what full-degree vertices force.</p>"],
["g","Degree","Is there a simple graph with degrees 3, 3, 3, 1?","<p><b>No.</b> Sum 10 is even, but on 4 vertices degree 3 means adjacent to all others. Three such vertices are each adjacent to the fourth, giving it degree 3, not 1.</p>"],
["g","Degree","A simple graph: 10 vertices, 4 of degree 4, the rest of degree d, 17 edges. Find d.","<span class='f'>2·17 = 4·4 + 6d</span><p>34 = 16 + 6d, so <b>d = 3</b>.</p>"],
["g","Directed graphs","What are in-degree and out-degree, and what do they sum to?","<span class='f'>Σ deg⁻(v) = Σ deg⁺(v) = |E|</span><p>deg⁻ counts edges ending at v; deg⁺ counts edges starting at v. Each edge has one start and one end. A loop adds 1 to each.</p><p class='ex'>Edges (1,2), (1,3), (2,3), (3,1), (3,4), (4,4): out 2, 1, 2, 1; in 1, 1, 2, 2; both sum to 6.</p>"],
["g","Special graphs","Vertices and edges of Kₙ, Cₙ, Wₙ, Qₙ, Kₘ,ₙ?","<ul><li>Kₙ: n vertices, n(n−1)/2 edges.</li><li>Cₙ (n ≥ 3): n, n.</li><li>Wₙ: <b>n + 1</b> vertices (hub), 2n edges.</li><li>Qₙ: 2ⁿ vertices, n·2ⁿ⁻¹ edges.</li><li>Kₘ,ₙ: m + n vertices, mn edges.</li></ul><p class='ex'>K₇: 21. W₆: 12. Q₄: 32. Q₅: 80. K₄,₆: 24.</p>"],
["g","Special graphs","What is the degree sequence of K₃,₄? Check handshaking.","<p>The 3 vertices on one side have degree 4; the 4 on the other have degree 3: 4, 4, 4, 3, 3, 3, 3.</p><span class='f'>sum 24 = 2 · 12 = 2 · (3 · 4)</span>"],
["g","Special graphs","What is the n-cube Qₙ, and why does it have n·2ⁿ⁻¹ edges?","<p>Vertices: bit strings of length n. Edges: strings differing in exactly one bit.</p><p>Each of the 2ⁿ vertices has n neighbors (flip one of n bits). Handshaking: |E| = n·2ⁿ / 2 = n·2ⁿ⁻¹.</p><p class='ex'>Q₃ is the cube: 8 vertices, 12 edges.</p>"],
["g","Bipartite","What does bipartite mean? How is it related to coloring?","<span class='f'>V = V₁ ∪ V₂, every edge joins V₁ to V₂</span><p>Equivalently: color vertices with 2 colors so every edge joins different colors.</p><p class='ex'>Kₘ,ₙ, Qₙ (even vs odd number of 1s), even cycles.</p>"],
["g","Bipartite","State and justify the odd-cycle test for bipartite graphs.","<span class='f'>bipartite ⟺ no cycle of odd length</span><p><b>⇒</b> Colors alternate around a cycle, so returning to the start takes an even number of steps.</p><p><b>⇐</b> In each component, color by parity of distance from a fixed vertex v. A same-color edge xy would close an odd walk v→x→y→v, which contains an odd cycle.</p>"],
["g","Bipartite","Which of Cₙ, Kₙ, Wₙ, Qₙ are bipartite?","<ul><li>Cₙ: iff n is even.</li><li>Kₙ: iff n ≤ 2.</li><li>Wₙ: never (hub + two neighboring rim vertices = triangle).</li><li>Qₙ: always (parity of number of 1s).</li></ul><p class='trap'>A chord joining opposite vertices of C₆ keeps it bipartite; a chord joining vertices two apart makes a triangle.</p>"],
["g","Bipartite","How do you test whether a graph is bipartite by hand?","<ol><li>Color one vertex red; its neighbors blue; their neighbors red; and so on.</li><li>A conflict (an edge between same colors) exhibits an odd cycle: not bipartite.</li><li>No conflict: the colors are the two sides.</li></ol><p class='ex'>Max edges in a bipartite graph on 10 vertices: m(10 − m) ≤ 25, so 25 (K₅,₅).</p>"],
["g","Bipartite","What certificate proves a graph IS bipartite, and what proves it is NOT?","<ul><li><b>Is:</b> exhibit the two sides (a 2-coloring) and note every edge crosses.</li><li><b>Is not:</b> exhibit one odd cycle.</li></ul><p class='ex'>Möbius ladder (8-cycle 0–7 plus edges i–(i+4)): 0–1–2–3–4–0 is a 5-cycle, so not bipartite.</p>"],
["g","Bipartite","What is a complete matching, and what does Hall’s theorem say?","<p>A matching is a set of edges with no shared endpoints. In a bipartite graph, a complete matching from V₁ matches every vertex of V₁.</p><span class='f'>exists ⟺ |N(A)| ≥ |A| for every A ⊆ V₁</span><p>“Only if”: A’s matched partners are |A| distinct neighbors of A.</p>"],
["g","Subgraphs","Subgraph vs induced subgraph; G − e vs G − v; union; complement?","<ul><li><b>Subgraph:</b> some vertices and some edges among them. <b>Induced:</b> chosen vertices with <b>all</b> edges between them.</li><li>G − e keeps all vertices; G − v also deletes v’s edges.</li><li>G₁ ∪ G₂: union of vertex sets and of edge sets.</li><li>Complement Ḡ: same vertices, exactly the non-edges. |E(G)| + |E(Ḡ)| = C(n, 2).</li></ul><p class='ex'>Complement of C₆ has 15 − 6 = 9 edges. Wₙ − hub = Cₙ.</p>"],
["g","Representations","Adjacency list vs adjacency matrix vs incidence matrix?","<ul><li><b>Adjacency list:</b> each vertex with its neighbors.</li><li><b>Adjacency matrix:</b> n × n, aᵢⱼ = number of edges vᵢ–vⱼ. Symmetric for undirected; row sum = degree (loops: 1 on the diagonal).</li><li><b>Incidence matrix:</b> n × |E|, entry 1 if edge eⱼ touches vᵢ; each column has two 1s.</li></ul><p class='trap'>For digraphs aᵢⱼ = 1 means vᵢ → vⱼ; row sums are out-degrees, column sums in-degrees.</p>"],
["g","Isomorphism","When are two graphs isomorphic?","<span class='f'>bijection f : V₁ → V₂ with uv ∈ E₁ ⟺ f(u)f(v) ∈ E₂</span><p>A renaming of vertices that turns one edge set exactly into the other. Drawings can be misleading: a pentagram is C₅.</p>"],
["g","Isomorphism","How do you prove two graphs ARE isomorphic?","<ol><li>Check vertex count, edge count, degree sequence agree.</li><li>Match special vertices first (unique degrees, their neighbors).</li><li>Write f explicitly.</li><li>Check every edge maps to an edge (equal edge counts then finish it).</li></ol><p class='ex'>Square abcd + pendant ae vs edges 13, 35, 52, 21, 42: a↦2, e↦4, b↦1, c↦3, d↦5 works.</p><p class='trap'>Equal degree sequences alone prove nothing.</p>"],
["g","Isomorphism","How do you prove two graphs are NOT isomorphic? List useful invariants.","<p>Find one invariant that differs.</p><ul><li># vertices, # edges, degree sequence</li><li># cycles of each length (triangles!)</li><li>connected / # components</li><li>bipartite or not</li><li>degrees of adjacent vertices</li></ul><p class='trap'>“No bijection I tried worked” is not a proof.</p>"],
["g","Isomorphism","Are K₃,₃ and the triangular prism isomorphic?","<p>Both have 6 vertices, 9 edges, all degrees 3. But the prism has a triangle and K₃,₃ is bipartite (no odd cycles). <b>Not isomorphic.</b></p><p class='ex'>Likewise C₆ vs two disjoint triangles: same degrees, but connected vs 2 components.</p>"],
["g","Connectivity","What is a path, circuit, simple path in Rosen’s sense? When is a graph connected?","<ul><li><b>Path</b> of length n: n edges leading x₀ – x₁ – ⋯ – xₙ (vertices and edges may repeat).</li><li><b>Circuit:</b> a path of length ≥ 1 ending where it started.</li><li><b>Simple:</b> no repeated edge.</li><li><b>Connected:</b> a path between every two vertices.</li></ul><p>In a connected graph, a shortest path between two vertices is automatically simple.</p>"],
["g","Connectivity","What are connected components, and why are they equivalence classes?","<p>Components are the maximal connected subgraphs. “u = v or there is a path u to v” is reflexive, symmetric (reverse the path) and transitive (glue paths), so its classes partition V: those are the components.</p><p class='trap'>An isolated vertex is a component by itself.</p>"],
["g","Connectivity","What are cut vertices and cut edges? When is an edge a cut edge?","<p><b>Cut vertex / cut edge:</b> removing it increases the number of components.</p><span class='f'>e is a cut edge ⟺ e lies on no cycle</span><p class='ex'>Two triangles 1-2-3 and 4-5-6 joined by edge 3–4: cut vertices 3, 4; cut edge 3–4. Star K₁,₄: cut vertex = center; all 4 edges are cut edges.</p><p class='trap'>A pendant vertex is never a cut vertex, even though its edge is a cut edge.</p>"],
["g","Connectivity","What are vertex connectivity κ(G) and edge connectivity λ(G)?","<p>κ(G): fewest vertices whose removal disconnects G (or leaves a single vertex). λ(G): fewest edges whose removal disconnects G.</p><span class='f'>κ(G) ≤ λ(G) ≤ min degree; &nbsp;κ(Kₙ) = λ(Kₙ) = n − 1</span>"],
["g","Connectivity","Strongly vs weakly connected digraphs? Strong components?","<ul><li><b>Strongly:</b> directed paths both ways between every pair.</li><li><b>Weakly:</b> the underlying undirected graph is connected.</li></ul><p>Strong components: classes of mutual reachability.</p><p class='ex'>1→2→3→1, 3→4: strong components {1, 2, 3}, {4}; weakly connected.</p>"],
["g","Connectivity","Digraph on {1,…,5}: 1→2, 2→3, 3→4, 4→2, 5→4, 5→1. Strong components? Weakly connected?","<p>2→3→4→2 is a cycle, so {2, 3, 4} is one strong component. Nothing returns to 1 or 5: {1} and {5} are components by themselves.</p><p>Weakly connected: <b>yes</b>, ignoring directions everything is joined.</p>"],
["g","Counting paths","How does the adjacency matrix count paths? Why?","<span class='f'>(Aʳ)ᵢⱼ = # paths of length r from vᵢ to vⱼ</span><p>Induction: a path of length r + 1 is a length-r path to some vₖ plus an edge vₖ vⱼ, so the count is Σₖ (Aʳ)ᵢₖ aₖⱼ = (Aʳ⁺¹)ᵢⱼ.</p><p class='trap'>These paths may repeat vertices; Aʳ overcounts simple paths. Use ordinary (not Boolean) multiplication.</p>"],
["g","Counting paths","Square 1–2–3–4–1 plus diagonal 1–3: paths of length 2 from 2 to 4? Number of triangles from A³?","<p>(A²)₂₄ = 2: 2–1–4 and 2–3–4. Diagonal of A² = degrees 3, 2, 3, 2.</p><span class='f'># triangles = trace(A³) / 6</span><p>trace(A³) = 4 + 2 + 4 + 2 = 12, so 2 triangles (123, 134). Each triangle gives 6 closed walks: 3 starts × 2 directions.</p><p class='ex'>K₄: (A³)ᵤᵥ = 7 for u ≠ v, 6 on the diagonal.</p>"],
// ================= cards54-de.js =================
["de","2nd-order basics","What does it mean for ay″ + by′ + cy = 0 to be linear, homogeneous, constant-coefficient? Why does that matter?","<span class='lb'>Meaning</span><p><b>Linear:</b> y, y′, y″ appear to the first power only. <b>Homogeneous:</b> right side 0. <b>Constant coefficients:</b> a, b, c are numbers, a ≠ 0.</p><span class='lb'>Why it matters</span><p>L[y] = ay″ + by′ + cy is a linear operator, so solutions are closed under addition and scaling: they form a vector space (the null space of L).</p><span class='f'>L[c₁y₁ + c₂y₂] = c₁L[y₁] + c₂L[y₂]</span>"],
["de","2nd-order basics","Why is the solution space of ay″ + by′ + cy = 0 exactly 2-dimensional?","<span class='lb'>Why</span><p>Existence–uniqueness: for every (Y₀, Y₁) there is exactly one solution with y(0) = Y₀, y′(0) = Y₁.</p><p>So the linear map y ↦ (y(0), y′(0)) is onto (existence) and one-to-one (uniqueness): an isomorphism onto ℝ².</p><span class='lb'>Consequence</span><p>Two independent solutions y₁, y₂ give every solution: y = c₁y₁ + c₂y₂.</p>"],
["de","Wronskian","What is the Wronskian of y₁, y₂ and what does it tell you about solutions?","<span class='f'>W = y₁y₂′ − y₁′y₂</span><p>For two solutions of the same equation, W is either <b>never 0</b> (independent, a fundamental set) or <b>always 0</b> (dependent).</p><span class='lb'>Why</span><p>Matching initial values means solving a 2×2 system whose determinant is W(t₀).</p><p class='ex'>e²ᵗ, e⁻³ᵗ: W = −3e⁻ᵗ − 2e⁻ᵗ = −5e⁻ᵗ ≠ 0.</p><p class='trap'>For arbitrary functions W can vanish at isolated points: t and t² give W = t².</p>"],
["de","Characteristic equation","How do you get the auxiliary (characteristic) equation and why does it work?","<span class='lb'>How</span><p>Replace y″ → r², y′ → r, y → 1: ar² + br + c = 0.</p><span class='lb'>Why</span><p>L[eʳᵗ] = (ar² + br + c)eʳᵗ = p(r)eʳᵗ, and eʳᵗ ≠ 0, so eʳᵗ solves the ODE exactly when p(r) = 0.</p><p class='ex'>y″ + y′ − 6y = 0 → r² + r − 6 = (r + 3)(r − 2), r = 2, −3.</p>"],
["de","Characteristic equation","Three cases for the roots of ar² + br + c = 0 and the general solution in each.","<ul><li><b>Distinct real r₁, r₂:</b> c₁e^(r₁t) + c₂e^(r₂t)</li><li><b>Repeated r:</b> (c₁ + c₂t)eʳᵗ</li><li><b>Complex α ± iβ:</b> e^(αt)(c₁cos βt + c₂sin βt)</li></ul><span class='lb'>Decide by</span><p>The discriminant b² − 4ac: positive, zero, negative.</p><p class='trap'>For y″ + 9y = 0, r = ±3i so α = 0: c₁cos 3t + c₂sin 3t, not e³ᵗ.</p>"],
["de","Characteristic equation","General solution of y″ − 5y′ = 0 (no y term).","<p>r² − 5r = r(r − 5): roots 0 and 5. Since e⁰ᵗ = 1:</p><p class='ex'>y = <b>c₁ + c₂e⁵ᵗ</b>.</p><p class='trap'>A missing y term means r = 0 is a root, so constants are solutions. Watch for this in the tˢ rule too.</p>"],
["de","Repeated roots","Why does a repeated root r give the second solution t·eʳᵗ?","<span class='lb'>Why</span><p>Differentiate L[eʳᵗ] = p(r)eʳᵗ with respect to r:</p><span class='f'>L[teʳᵗ] = (p′(r) + t·p(r))eʳᵗ</span><p>A double root has p(r) = 0 <b>and</b> p′(r) = 0, so L[teʳᵗ] = 0. W[eʳᵗ, teʳᵗ] = e²ʳᵗ ≠ 0, so independent.</p><p class='ex'>y″ − 6y′ + 9y = 0: (r − 3)², y = (c₁ + c₂t)e³ᵗ.</p>"],
["de","Complex roots","Why do complex roots α ± iβ give e^(αt)cos βt and e^(αt)sin βt?","<span class='lb'>Why</span><p>Euler: e^((α+iβ)t) = e^(αt)(cos βt + i sin βt) is a complex solution. Since a, b, c are <b>real</b>, L[u + iv] = L[u] + iL[v] = 0 forces L[u] = 0 and L[v] = 0.</p><p>So the real part and the imaginary part are both real solutions. The conjugate root gives nothing new.</p><p class='ex'>y″ + 4y′ + 13y = 0: r = −2 ± 3i, y = e⁻²ᵗ(c₁cos 3t + c₂sin 3t).</p><p class='trap'>β is the imaginary part only; don’t forget the e^(αt).</p>"],
["de","IVP","Solve y″ + y′ − 2y = 0, y(0) = 0, y′(0) = 3.","<ol><li>r² + r − 2 = (r + 2)(r − 1): y = c₁eᵗ + c₂e⁻²ᵗ.</li><li>y(0): c₁ + c₂ = 0. y′(0): c₁ − 2c₂ = 3.</li><li>c₂ = −1, c₁ = 1.</li></ol><p class='ex'>y = <b>eᵗ − e⁻²ᵗ</b>.</p><p class='trap'>Differentiate the general solution before plugging in t = 0.</p>"],
["de","IVP","Solve y″ − 4y′ + 4y = 0, y(0) = 1, y′(0) = 0.","<ol><li>(r − 2)²: y = (c₁ + c₂t)e²ᵗ.</li><li>y′ = c₂e²ᵗ + 2(c₁ + c₂t)e²ᵗ.</li><li>c₁ = 1; c₂ + 2c₁ = 0 → c₂ = −2.</li></ol><p class='ex'>y = <b>(1 − 2t)e²ᵗ</b>.</p><p class='trap'>Product rule on teʳᵗ: forgetting the c₂ term in y′ is the usual slip.</p>"],
["de","IVP","Solve y″ + 16y = 0, y(0) = 3, y′(0) = 8.","<ol><li>r = ±4i: y = c₁cos 4t + c₂sin 4t.</li><li>c₁ = 3; y′(0) = 4c₂ = 8 → c₂ = 2.</li></ol><p class='ex'>y = <b>3cos 4t + 2sin 4t</b>.</p><p class='trap'>The derivative of sin 4t is 4cos 4t: the factor 4 matters.</p>"],
["de","IVP","Solve y″ + 2y′ + 5y = 0, y(0) = 0, y′(0) = 4.","<ol><li>r = −1 ± 2i: y = e⁻ᵗ(c₁cos 2t + c₂sin 2t).</li><li>y(0) = c₁ = 0.</li><li>y′(0) = −c₁ + 2c₂ = 4 → c₂ = 2.</li></ol><p class='ex'>y = <b>2e⁻ᵗsin 2t</b>: a decaying oscillation.</p>"],
["de","Springs","Mass–spring my″ + by′ + ky = 0: what do under-, critically and overdamped mean?","<span class='f'>discriminant b² − 4mk</span><ul><li><b>&lt; 0 underdamped:</b> complex roots, decaying oscillation.</li><li><b>= 0 critical:</b> repeated root, fastest return without oscillating.</li><li><b>&gt; 0 overdamped:</b> two negative real roots, slow return.</li><li><b>b = 0:</b> pure oscillation, ω = √(k/m).</li></ul><p class='ex'>y″ + 6y′ + 5y = 0: roots −1, −5, overdamped.</p><p>With b &gt; 0 all roots have negative real part, so every solution → 0.</p>"],
["de","Reverse problems","Find a constant-coefficient ODE with solution e⁻ᵗcos 4t. Can t² solve a 2nd-order one?","<ol><li>Need roots −1 ± 4i: (r + 1)² + 16 = r² + 2r + 17.</li><li>So y″ + 2y′ + 17y = 0.</li></ol><span class='lb'>t²?</span><p>No: t² needs a triple root at 0, i.e. y‴ = 0, which is 3rd order.</p><p class='trap'>Lowest order = total number of roots needed (counting multiplicity).</p>"],
["de","Nonhomogeneous","Structure of the solutions of ay″ + by′ + cy = g(t)?","<span class='f'>y = yₕ + yₚ = c₁y₁ + c₂y₂ + yₚ</span><span class='lb'>Why</span><p>If y and yₚ both solve L[y] = g, then L[y − yₚ] = 0, so y − yₚ is a homogeneous solution.</p><p>Same as Ax = b: one particular solution + the null space.</p><p class='trap'>Solutions of L[y] = g are not a subspace: the sum of two solves L[y] = 2g.</p>"],
["de","Superposition","State the superposition principle and how it’s used.","<span class='f'>L[y₁] = g₁, L[y₂] = g₂ ⟹ L[k₁y₁ + k₂y₂] = k₁g₁ + k₂g₂</span><span class='lb'>Use</span><p>For a forcing that’s a sum, find a particular solution for each piece separately, scale, and add.</p><p class='ex'>If t solves L[y] = 3 and eᵗ solves L[y] = 2eᵗ, then 2t − ½eᵗ solves L[y] = 6 − eᵗ.</p>"],
["de","Undetermined coefficients","What is the idea of undetermined coefficients, and when does it apply?","<span class='lb'>Idea</span><p>Derivatives of polynomials, exponentials and sin/cos stay in the same family, so guess yₚ of the same type as g with unknown coefficients, substitute, match coefficients.</p><span class='lb'>Applies when</span><p>Constant coefficients and g is a sum of products of polynomials, e^(αt), cos βt, sin βt.</p><p class='trap'>Not for g = tan t, 1/t, ln t.</p>"],
["de","Undetermined coefficients","How do you choose the trial form? (The table is given on the exam; how do you use it?)","<ol><li>Solve the homogeneous equation first (you need the roots).</li><li>Read off α (or α + iβ) and the polynomial degree n of g.</li><li>Write a <b>full</b> degree-n polynomial, and <b>both</b> cos and sin.</li><li>Multiply by tˢ, s = multiplicity of α (or α + iβ) as a root: 0, 1 or 2.</li></ol><p class='ex'>g = t²: try At² + Bt + C (not just At²).</p><p class='trap'>A cos t alone fails when there’s a y′ term.</p>"],
["de","Undetermined coefficients","Find yₚ for y″ − y′ − 2y = 4t².","<ol><li>Roots 2, −1; 0 is not a root, s = 0.</li><li>Try At² + Bt + C: 2A − (2At + B) − 2(At² + Bt + C) = 4t².</li><li>t²: −2A = 4 → A = −2. t: −2A − 2B = 0 → B = 2. 1: 2A − B − 2C = 0 → C = −3.</li></ol><p class='ex'>yₚ = <b>−2t² + 2t − 3</b>.</p>"],
["de","Undetermined coefficients","Find yₚ for y″ + 2y′ + 5y = 10cos t.","<ol><li>Roots −1 ± 2i; i is not a root, s = 0.</li><li>Try A cos t + B sin t. Substituting: (4A + 2B)cos t + (4B − 2A)sin t = 10cos t.</li><li>A = 2B, 10B = 10: B = 1, A = 2.</li></ol><p class='ex'>yₚ = <b>2cos t + sin t</b>.</p><p class='trap'>Include sin even though g has only cos.</p>"],
["de","tˢ rule","Why multiply the trial by t when it solves the homogeneous equation?","<span class='lb'>Why</span><p>If the trial is a homogeneous solution, L[trial] = 0 ≠ g: no coefficients can work.</p><span class='f'>L[teʳᵗ] = (p′(r) + t·p(r))eʳᵗ</span><p>Simple root: p(r) = 0, p′(r) ≠ 0, so L[Ateʳᵗ] = A·p′(r)eʳᵗ: solvable. Double root needs t²: L[t²eʳᵗ] = p″(r)eʳᵗ.</p><p class='ex'>y″ − y′ − 2y = 6e²ᵗ: p′(2) = 3, so 3A = 6, yₚ = <b>2te²ᵗ</b>.</p>"],
["de","tˢ rule","Find yₚ for y″ + 4y = 12cos 2t. What is this phenomenon?","<ol><li>Roots ±2i, and 2i is a root: s = 1.</li><li>Try t(A cos 2t + B sin 2t). Substituting gives −4A sin 2t + 4B cos 2t = 12cos 2t.</li><li>A = 0, B = 3.</li></ol><p class='ex'>yₚ = <b>3t sin 2t</b>: <b>resonance</b>, the amplitude grows without bound.</p><p class='trap'>Plain A cos 2t + B sin 2t gives 0.</p>"],
["de","tˢ rule","Quick yₚ: (a) y″ − 3y′ + 2y = 4; (b) y″ − 3y′ + 2y = eᵗ; (c) y″ − 6y′ + 9y = e³ᵗ.","<ol><li>(a) 0 not a root: A, 2A = 4, yₚ = <b>2</b>.</li><li>(b) roots 1, 2; 1 is simple: Ateᵗ, A·p′(1) = A(2 − 3) = 1 → yₚ = <b>−teᵗ</b>.</li><li>(c) 3 is double: At²e³ᵗ, A·p″ = 2A = 1 → yₚ = <b>½t²e³ᵗ</b>.</li></ol>"],
["de","tˢ rule","Trial form (don’t solve) for y″ − 4y′ + 4y = te²ᵗ + e²ᵗcos t.","<ol><li>Homogeneous: (r − 2)², double root 2.</li><li>te²ᵗ: degree 1, α = 2 double root, s = 2 → t²(At + B)e²ᵗ.</li><li>e²ᵗcos t: 2 + i not a root, s = 0 → e²ᵗ(C cos t + D sin t).</li></ol><p class='ex'>yₚ = t²(At + B)e²ᵗ + e²ᵗ(C cos t + D sin t).</p><p class='trap'>Decide s for each piece separately; multiply the whole block: t²(At + B), not At³ + B.</p>"],
["de","tˢ rule","Trial form (don’t solve) for y″ + 9y = t²sin 3t + 4e⁻ᵗ.","<ol><li>3i is a root (s = 1), polynomial degree 2: t[(At² + Bt + C)cos 3t + (Dt² + Et + F)sin 3t].</li><li>−1 is not a root: Ge⁻ᵗ.</li></ol><p class='trap'>Full degree-2 polynomials on both cos and sin, even though g has only sin.</p>"],
["de","IVP","Solve y″ + y = 2t, y(0) = 0, y′(0) = 0. In what order do you do things?","<ol><li>yₕ = c₁cos t + c₂sin t.</li><li>yₚ = At + B → A = 2, B = 0.</li><li>y = c₁cos t + c₂sin t + 2t, <b>then</b> initial conditions: c₁ = 0, c₂ + 2 = 0.</li></ol><p class='ex'>y = <b>2t − 2sin t</b>.</p><p class='trap'>Apply initial conditions to yₕ + yₚ, never to yₕ alone.</p>"],
["de","Systems","What is a linear system in normal form?","<span class='f'>x′(t) = A(t)x(t) + f(t)</span><p>x = (x₁, …, xₙ) is the unknown vector, A(t) an n×n coefficient matrix, f(t) the forcing. Homogeneous if f = 0.</p><span class='lb'>Why</span><p>Many coupled quantities (tanks, masses, circuits) change together; matrices let us treat them as one equation.</p>"],
["de","Systems","How do you convert an n-th order linear ODE to a first-order system?","<ol><li>Solve for the highest derivative.</li><li>Set x₁ = y, x₂ = y′, …, xₙ = y⁽ⁿ⁻¹⁾.</li><li>x₁′ = x₂, …, xₙ₋₁′ = xₙ, and xₙ′ = the expression from step 1.</li></ol><p class='ex'>y‴ − 2y″ + y′ − 5y = sin t → x′ = [0 1 0; 0 0 1; 5 −1 2]x + (0, 0, sin t).</p><p class='trap'>Move terms to the right side first: y″ + 3y′ + 2y = 0 has bottom row (−2, −3).</p>"],
["de","Systems","Write y″ + 3y′ + 2y = e⁻ᵗ as a first-order system.","<ol><li>y″ = −2y − 3y′ + e⁻ᵗ.</li><li>x₁ = y, x₂ = y′.</li></ol><span class='f'>x′ = [0 1; −2 −3]x + (0, e⁻ᵗ)</span>"],
["de","Systems","How are the eigenvalues of the companion matrix related to the auxiliary equation?","<p>They are <b>the same</b>: the characteristic polynomial of the companion matrix is the auxiliary polynomial.</p><p class='ex'>y″ − y′ − 6y = 0 → [0 1; 6 1]; det(A − λI) = λ² − λ − 6, roots 3, −2: same as r² − r − 6.</p><p>So systems really do include everything from Chapter 4.</p>"],
["de","Matrix calculus","How do you differentiate and integrate a matrix function? What’s the product rule?","<p>Entry by entry.</p><span class='f'>(AB)′ = A′B + AB′ &nbsp; (keep the order)</span><p class='ex'>M = [t² e²ᵗ; sin t 1] → M′ = [2t 2e²ᵗ; cos t 0]; ∫₀¹ M has (1,2) entry (e² − 1)/2.</p><p class='trap'>(A²)′ = A′A + AA′, not 2AA′ in general.</p>"],
["de","Systems theory","Existence–uniqueness and dimension for x′ = A(t)x + f(t)?","<p>If A(t) and f(t) are continuous on an interval I ∋ t₀, then x(t₀) = x₀ gives exactly one solution, valid on <b>all</b> of I.</p><p>The homogeneous solutions form an <b>n-dimensional</b> space: x ↦ x(t₀) is a linear bijection onto ℝⁿ.</p>"],
["de","Fundamental matrix","What are a fundamental solution set and a fundamental matrix? How do you use X(t)?","<p><b>Fundamental set:</b> n linearly independent solutions x₁, …, xₙ of x′ = Ax.</p><p><b>Fundamental matrix:</b> X(t) = [x₁ ⋯ xₙ], with X′ = AX.</p><span class='f'>x = X(t)c, &nbsp; c = X(t₀)⁻¹x₀</span><p>Forced system: x = X(t)c + xₚ.</p>"],
["de","Wronskian","Wronskian for systems: definition and the all-or-nothing property. Why?","<span class='f'>W(t) = det[x₁(t) ⋯ xₙ(t)] = W(t₀)·e^(∫tr A)</span><p>For solutions: never 0 (fundamental) or identically 0 (dependent).</p><span class='lb'>Why</span><p>If W(t₀) = 0, some nonzero combination vanishes at t₀; by uniqueness it equals the zero solution for all t.</p><p class='trap'>(t, 1) and (t², 2t) have W = t²; they can’t both solve one x′ = A(t)x with A continuous near 0.</p>"],
["de","Wronskian","Check that e³ᵗ(1, 1) and e⁻ᵗ(1, −1) form a fundamental set for x′ = [1 2; 2 1]x, and solve x(0) = (3, 1).","<ol><li>A(1, 1) = 3(1, 1) and A(1, −1) = −(1, −1): both are solutions.</li><li>W = −e²ᵗ − e²ᵗ = −2e²ᵗ ≠ 0.</li><li>c₁ + c₂ = 3, c₁ − c₂ = 1 → c = (2, 1).</li></ol><p class='ex'>x = <b>2e³ᵗ(1, 1) + e⁻ᵗ(1, −1)</b>.</p>"],
["de","Eigen method","Why does x = e^(λt)v solve x′ = Ax exactly when Av = λv?","<span class='lb'>Why</span><p>x′ = λe^(λt)v and Ax = e^(λt)Av. Equal for all t ⟺ Av = λv.</p><span class='f'>x = c₁e^(λ₁t)v₁ + ⋯ + cₙe^(λₙt)vₙ</span><p>Valid when v₁, …, vₙ are linearly independent (W(0) = det[v₁ ⋯ vₙ] ≠ 0). Distinct eigenvalues guarantee that.</p>"],
["de","Eigen method","Recipe for x′ = Ax (constant A, real eigenvalues) with x(0) given.","<ol><li>det(A − λI) = 0; 2×2: λ² − (tr A)λ + det A = 0.</li><li>Null space of A − λI for each λ.</li><li>x = Σ cᵢe^(λᵢt)vᵢ.</li><li>Solve [v₁ ⋯ vₙ]c = x(0).</li></ol><p class='trap'>Keep each eigenvector with its own eigenvalue; check Av = λv.</p>"],
["de","Eigen method","Solve x′ = [4 −2; 1 1]x, x(0) = (1, 0).","<ol><li>tr 5, det 6: λ = 2, 3.</li><li>λ = 2: v = (1, 1). λ = 3: v = (2, 1).</li><li>c₁ + 2c₂ = 1, c₁ + c₂ = 0 → c₂ = 1, c₁ = −1.</li></ol><p class='ex'>x = <b>−e²ᵗ(1, 1) + e³ᵗ(2, 1)</b>.</p>"],
["de","Eigen method","General solution of x′ = [5 −1; 3 1]x, and its long-term behavior.","<ol><li>tr 6, det 8: λ = 2, 4.</li><li>λ = 2: A − 2I = [3 −1; 3 −1], v = (1, 3). λ = 4: [1 −1; 3 −3], v = (1, 1).</li><li>x = c₁e²ᵗ(1, 3) + c₂e⁴ᵗ(1, 1).</li></ol><p class='ex'>For large t (c₂ ≠ 0), x ≈ c₂e⁴ᵗ(1, 1): the largest eigenvalue dominates.</p>"],
["de","Repeated eigenvalues","Repeated eigenvalue: when is it harmless, and when is it a problem?","<p><b>Harmless</b> if the eigenspace dimension (n − rank(A − λI)) equals the multiplicity: still n independent eigenvectors, same formula.</p><p><b>Defective</b> if the eigenspace is too small: you need a generalized eigenvector u with (A − λI)u = v, giving e^(λt)(tv + u) (Nagle 9.8).</p><p class='ex'>Real symmetric matrices are never defective.</p><p class='trap'>Unlike scalar ODEs, a repeated eigenvalue does not automatically produce t·e^(λt).</p>"],
["de","Repeated eigenvalues","Solve x′ = [2 1 1; 1 2 1; 1 1 2]x, x(0) = (2, 1, 3).","<ol><li>A = I + J (J all ones): eigenvalues 4, 1, 1.</li><li>λ = 4: (1, 1, 1). λ = 1: x₁ + x₂ + x₃ = 0, basis (1, −1, 0), (1, 0, −1).</li><li>c₁ + c₂ + c₃ = 2, c₁ − c₂ = 1, c₁ − c₃ = 3 → c = (2, 1, −1).</li></ol><p class='ex'>x = <b>2e⁴ᵗ(1, 1, 1) + eᵗ(1, −1, 0) − eᵗ(1, 0, −1)</b>.</p>"],
["de","Phase portraits","Real eigenvalues λ₁, λ₂ of a 2×2 system: what do the trajectories look like?","<ul><li><b>Both negative:</b> stable node; everything → 0.</li><li><b>Both positive:</b> unstable node; everything nonzero blows up.</li><li><b>Opposite signs:</b> saddle; → 0 only along the negative eigenvector’s line.</li></ul><p class='trap'>Eigenvalues −3 and 2: not every solution → 0.</p>"],
["de","Repeated eigenvalues","What are all solutions of x′ = 5I·x (2×2)?","<p>λ = 5 twice, and <b>every</b> nonzero vector is an eigenvector (the eigenspace is all of ℝ², dimension 2 = multiplicity).</p><p class='ex'>x = e⁵ᵗx(0): straight rays out of the origin.</p>"],
["de","Complex eigenvalues","For λ = α + iβ with eigenvector v = a + ib, what are the two real solutions? Why do they work?","<span class='f'>x₁ = e^(αt)(a cos βt − b sin βt)<br>x₂ = e^(αt)(a sin βt + b cos βt)</span><span class='lb'>Why</span><p>e^(λt)v is a complex solution; A is real, so its real and imaginary parts are each solutions.</p><p class='trap'>Don’t also use λ̄ (it gives the same two); keep the minus sign from i·i = −1.</p>"],
["de","Complex eigenvalues","Fast way to get an eigenvector for a complex λ of a 2×2 matrix?","<p>Rows of A − λI are complex multiples of each other, so use <b>one</b> row (p, q) and take v = (q, −p) or (−q, p).</p><p class='ex'>A = [1 −5; 1 −3], λ = −1 + i: row 2 is (1, −2 − i) → v = (2 + i, 1). Check row 1: (2 − i)(2 + i) − 5 = 0 ✓.</p>"],
["de","Complex eigenvalues","Solve x′ = [1 −5; 1 −3]x, x(0) = (3, 1).","<ol><li>λ = −1 ± i; v = (2 + i, 1), so a = (2, 1), b = (1, 0).</li><li>x₁ = e⁻ᵗ(2cos t − sin t, cos t), x₂ = e⁻ᵗ(2sin t + cos t, sin t).</li><li>x₁(0) = a, x₂(0) = b: c₁(2, 1) + c₂(1, 0) = (3, 1) → c₁ = c₂ = 1.</li></ol><p class='ex'>x = <b>e⁻ᵗ(3cos t + sin t, cos t + sin t)</b>.</p>"],
["de","Complex eigenvalues","Real solutions of x′ = [0 4; −1 0]x. What do orbits look like?","<ol><li>λ = ±2i; for 2i, v = (2, i): a = (2, 0), b = (0, 1).</li><li>x₁ = (2cos 2t, −sin 2t), x₂ = (2sin 2t, cos 2t).</li></ol><p class='ex'>α = 0: a <b>center</b>; orbits are ellipses x₁²/4 + x₂² = const, period π.</p>"],
["de","Spirals","How do α and β (λ = α ± iβ) shape the phase portrait? Direction of rotation?","<ul><li><b>α &lt; 0:</b> stable spiral (→ 0).</li><li><b>α = 0:</b> center (closed orbits).</li><li><b>α &gt; 0:</b> unstable spiral (→ ∞).</li></ul><p>β sets the rotation speed.</p><span class='lb'>Direction</span><p>Compute A(1, 0). Second entry &gt; 0 means counterclockwise.</p><p class='ex'>[1 −5; 1 −3]: A(1, 0) = (1, 1), counterclockwise.</p>"],
["de","Complex eigenvalues","Two real solutions of x′ = [3 −2; 4 −1]x; in or out?","<ol><li>tr 2, det 5: λ = 1 ± 2i.</li><li>Row 1 of A − (1 + 2i)I is (2 − 2i, −2) → v = (1, 1 − i): a = (1, 1), b = (0, −1).</li><li>x₁ = eᵗ(cos 2t, cos 2t + sin 2t), x₂ = eᵗ(sin 2t, sin 2t − cos 2t).</li></ol><p class='ex'>α = 1 &gt; 0: spirals <b>out</b>.</p>"],
["de","Complex eigenvalues","True or false: a real 3×3 matrix can have eigenvalues i, −i, 2i.","<p><b>False.</b> Conjugating Av = λv shows Av̄ = λ̄v̄: complex eigenvalues of real matrices come in conjugate pairs. 2i would need −2i, making four.</p><p class='ex'>Every real 3×3 matrix has at least one real eigenvalue, e.g. [−1 0 0; 0 0 −3; 0 3 0] has −1, ±3i.</p>"],
["de","Fourier","Why are 1, cos(nπx/L), sin(nπx/L) orthogonal on [−L, L]? State the integrals.","<span class='f'>∫ cos(mπx/L)cos(nπx/L) = ∫ sin·sin = 0 (m ≠ n), L (m = n ≥ 1); ∫ sin·cos = 0</span><p>Inner product ⟨f, g⟩ = ∫₋ₗᴸ f g dx; also ∫ 1·1 = 2L.</p><span class='lb'>Why</span><p>Product-to-sum gives cosines of (m ± n)πx/L, which integrate to 0 over full periods; sin·cos is odd.</p>"],
["de","Fourier","Fourier series on [−L, L]: the series and the coefficient formulas.","<span class='f'>f ~ a₀/2 + Σ [aₙcos(nπx/L) + bₙsin(nπx/L)]</span><span class='f'>aₙ = (1/L)∫₋ₗᴸ f cos(nπx/L) dx, &nbsp; bₙ = (1/L)∫₋ₗᴸ f sin(nπx/L) dx</span><p>a₀/2 = average value of f.</p><p class='trap'>Forgetting the ½ on a₀; compute a₀ separately (the aₙ formula often has n in a denominator).</p>"],
["de","Fourier","Where do the coefficient formulas come from?","<p>Multiply the series by cos(mπx/L) and integrate over [−L, L]. Orthogonality kills every term except aₘ·L.</p><span class='f'>∫ f cos(mπx/L) dx = aₘL</span><p>It’s exactly the projection coefficient ⟨f, φ⟩/⟨φ, φ⟩ for an orthogonal basis (Lay 6.7).</p>"],
["de","Fourier","Fourier series of f = 0 on (−2, 0), f = 3 on (0, 2).","<ol><li>L = 2. a₀ = ½∫₀² 3 dx = 3 (constant term 3/2).</li><li>aₙ = ½∫₀² 3cos(nπx/2) dx = 0.</li><li>bₙ = ½∫₀² 3sin(nπx/2) dx = 3(1 − (−1)ⁿ)/(nπ): 6/(nπ) for odd n.</li></ol><p class='ex'>f ~ 3/2 + (6/π)[sin(πx/2) + ⅓sin(3πx/2) + ⋯].</p>"],
["de","Fourier","Useful values and integrals for Fourier computations.","<ul><li>sin nπ = 0, cos nπ = (−1)ⁿ.</li><li>sin(nπ/2) = 1, 0, −1, 0, …; cos(nπ/2) = 0, −1, 0, 1, …</li><li>∫₀ᴸ x cos(nπx/L) dx = L²((−1)ⁿ − 1)/(nπ)².</li><li>∫₀ᴸ x sin(nπx/L) dx = L²(−1)ⁿ⁺¹/(nπ).</li><li>∫₀ᴸ sin(nπx/L) dx = L(1 − (−1)ⁿ)/(nπ).</li></ul>"],
["de","Fourier","Fourier series of f(x) = x + x² on [−1, 1].","<ol><li>Split: x² even (cosines), x odd (sines).</li><li>a₀ = ∫₋₁¹ x² dx = 2/3 (constant 1/3).</li><li>aₙ = ∫₋₁¹ x²cos nπx dx = 4(−1)ⁿ/(n²π²).</li><li>bₙ = 2∫₀¹ x sin nπx dx = 2(−1)ⁿ⁺¹/(nπ).</li></ol><p class='ex'>f ~ 1/3 + Σ[4(−1)ⁿ/(n²π²) cos nπx + 2(−1)ⁿ⁺¹/(nπ) sin nπx].</p>"],
["de","Convergence","What does a Fourier series converge to? State the theorem.","<p>If f and f′ are piecewise continuous on [−L, L], the series converges at every x to</p><span class='f'>½[f(x⁺) + f(x⁻)]</span><p>of the <b>2L-periodic extension</b>. At x = ±L: ½[f(−L⁺) + f(L⁻)].</p><p class='trap'>The value f(c) at a jump is irrelevant: changing one point doesn’t change any integral.</p>"],
["de","Convergence","Recipe: what does the series converge to at x = c?","<ol><li>Shift c by multiples of 2L into (−L, L].</li><li>If f is continuous there (not an endpoint), the answer is f(c).</li><li>At a jump or at ±L, average the left and right limits.</li></ol><p class='ex'>f = x + x² on [−1, 1]: at x = 1, ½(f(1⁻) + f(−1⁺)) = ½(2 + 0) = <b>1</b>, not f(1) = 2.</p>"],
["de","Even/odd","Even and odd functions: definitions, product rules, integrals.","<ul><li>Even: f(−x) = f(x) (x², cos, |x|). Odd: f(−x) = −f(x) (x, x³, sin).</li><li>even·even = odd·odd = even; even·odd = odd.</li><li>∫₋ₗᴸ odd = 0; ∫₋ₗᴸ even = 2∫₀ᴸ.</li></ul><span class='f'>f even ⇒ bₙ = 0; f odd ⇒ aₙ = 0</span>"],
["de","Half-range","Fourier cosine and sine series of f on [0, L]: what extension, what formulas?","<span class='f'>cosine: aₙ = (2/L)∫₀ᴸ f cos(nπx/L) &nbsp; (even extension)</span><span class='f'>sine: bₙ = (2/L)∫₀ᴸ f sin(nπx/L) &nbsp; (odd extension)</span><p>Both have period 2L. The sine series is always 0 at x = 0 and x = L.</p><p class='trap'>Half-range uses 2/L and ∫₀ᴸ; full series uses 1/L and ∫₋ₗᴸ.</p>"],
["de","Half-range","Cosine and sine series of f(x) = 2 − x on [0, 2]. Values at x = 0?","<ol><li>Cosine: a₀ = 2, aₙ = 4(1 − (−1)ⁿ)/(n²π²): 1 + (8/π²)Σ_odd cos(nπx/2)/n².</li><li>Sine: bₙ = 4/(nπ): Σ (4/(nπ)) sin(nπx/2).</li></ol><p class='ex'>At x = 0: cosine series → 2 (even extension is continuous); sine series → 0 (odd extension jumps from −2 to 2).</p>"],
["de","Half-range","Square wave f = −1 on (−π, 0), 1 on (0, π): series and value at x = π.","<ol><li>Odd, so aₙ = 0.</li><li>bₙ = (2/π)∫₀^π sin nx dx = 2(1 − (−1)ⁿ)/(nπ).</li><li>f ~ (4/π)[sin x + ⅓sin 3x + ⅕sin 5x + ⋯].</li></ol><p class='ex'>At x = π: ½(f(π⁻) + f(−π⁺)) = ½(1 − 1) = <b>0</b>.</p>"],
["de","Half-range","Fourier sine series of f(x) = x on [0, 1].","<ol><li>L = 1: bₙ = 2∫₀¹ x sin nπx dx.</li><li>= 2·(−1)ⁿ⁺¹/(nπ).</li></ol><p class='ex'>x ~ Σ 2(−1)ⁿ⁺¹ sin(nπx)/(nπ) on (0, 1); at x = 1 it gives 0 (odd extension jumps from 1 to −1).</p>"],
["de","Fourier","Fourier series of x² on [−3, 3]; and of sin 3x + 2cos 5x on [−π, π].","<ol><li>x² is even: a₀ = (2/3)∫₀³ x² dx = 6; aₙ = 36(−1)ⁿ/(n²π²).</li><li>x² ~ 3 + Σ 36(−1)ⁿ/(n²π²) cos(nπx/3).</li></ol><p class='ex'>sin 3x + 2cos 5x is already its own Fourier series: b₃ = 1, a₅ = 2, all else 0 (orthogonality).</p>"],
["la3","Dot product","Length, distance, unit vector and orthogonality in ℝⁿ.","<span class='f'>‖u‖ = √(u·u), &nbsp; dist(u, v) = ‖u − v‖</span><p>Unit vector in the direction of u: u/‖u‖. Orthogonal: u·v = 0.</p><p class='ex'>‖(1, 2, 2)‖ = 3, unit vector (1, 2, 2)/3. dist((1, 2), (4, 6)) = ‖(−3, −4)‖ = 5.</p>"],
["la3","Dot product","Pythagorean theorem in ℝⁿ: statement and why.","<span class='f'>u ⊥ v ⟺ ‖u + v‖² = ‖u‖² + ‖v‖²</span><p><b>Why:</b> ‖u + v‖² = ‖u‖² + 2u·v + ‖v‖², and the middle term vanishes exactly when u·v = 0.</p>"],
["la3","Orthogonal complement","What is W⊥, and how do Row, Col and Nul fit together?","<p>W⊥ = all vectors orthogonal to every vector in W. It’s a subspace, and dim W + dim W⊥ = n.</p><span class='f'>(Row A)⊥ = Nul A, &nbsp; (Col A)⊥ = Nul Aᵀ</span><p><b>Why:</b> Ax = 0 says x is orthogonal to every row of A.</p>"],
["la3","Orthogonal complement","Find W⊥ for W = span{(1, 2, −1), (0, 1, 1)} in ℝ³.","<ol><li>W⊥ = Nul of the matrix with these rows: [1 2 −1; 0 1 1].</li><li>x₂ = −x₃, x₁ = −2x₂ + x₃ = 3x₃.</li></ol><p class='ex'>W⊥ = span{<b>(3, −1, 1)</b>}. Check: 3 − 2 − 1 = 0, −1 + 1 = 0 ✓.</p>"],
["la3","Orthogonal sets","Why is an orthogonal set of nonzero vectors linearly independent?","<p>If c₁u₁ + ⋯ + cₚuₚ = 0, dot both sides with uⱼ: every term dies except cⱼ(uⱼ·uⱼ). Since uⱼ ≠ 0, cⱼ = 0.</p><p class='trap'>The zero vector is orthogonal to everything, which is why “nonzero” is needed.</p>"],
["la3","Orthogonal basis","Coordinates in an orthogonal basis: formula and example.","<span class='f'>y = c₁u₁ + ⋯ + cₚuₚ, &nbsp; cⱼ = (y·uⱼ)/(uⱼ·uⱼ)</span><p>No row reduction needed.</p><p class='ex'>Basis (1, 1), (1, −1), y = (3, 5): c₁ = 8/2 = 4, c₂ = −2/2 = −1. Check: 4(1, 1) − (1, −1) = (3, 5) ✓.</p><p class='trap'>Only valid for an orthogonal basis.</p>"],
["la3","Projection","Projection of y onto a line spanned by u.","<span class='f'>ŷ = (y·u / u·u) u, &nbsp; z = y − ŷ ⊥ u</span><p class='ex'>y = (2, 3), u = (1, 1): ŷ = (5/2)(1, 1) = (5/2, 5/2), z = (−1/2, 1/2). z·u = 0 ✓.</p><p>Distance from y to the line = ‖z‖ = 1/√2.</p>"],
["la3","Orthogonal matrices","What does UᵀU = I mean, and what do such matrices preserve?","<p>U has <b>orthonormal columns</b>. Then ‖Ux‖ = ‖x‖ and (Ux)·(Uy) = x·y.</p><p>If U is square, it’s an <b>orthogonal matrix</b>: U⁻¹ = Uᵀ.</p><p class='ex'>(1/5)[3 −4; 4 3] is orthogonal (a rotation).</p><p class='trap'>“Orthogonal matrix” means orthonormal columns, not just orthogonal ones.</p>"],
["la3","Projection","Orthogonal decomposition theorem and the projection formula.","<p>Every y splits uniquely as y = ŷ + z with ŷ ∈ W, z ∈ W⊥.</p><span class='f'>ŷ = Σ (y·uᵢ / uᵢ·uᵢ) uᵢ &nbsp; (orthogonal basis of W)</span><span class='f'>ŷ = UUᵀy &nbsp; (orthonormal columns U)</span><p class='trap'>With a non-orthogonal basis, Gram–Schmidt first.</p>"],
["la3","Projection","Project y = (2, 0, 3) onto W = span{(1, 1, 0), (1, −1, 1)}; distance from y to W.","<ol><li>u₁·u₂ = 0 ✓ orthogonal.</li><li>ŷ = (2/2)(1, 1, 0) + (5/3)(1, −1, 1) = <b>(8/3, −2/3, 5/3)</b>.</li><li>z = y − ŷ = (−2/3, 2/3, 4/3), orthogonal to both ✓.</li></ol><p class='ex'>Distance = ‖z‖ = √24/3 = <b>2√6/3</b>.</p>"],
["la3","Best approximation","Best approximation theorem: what is it and why?","<p>ŷ = proj_W y is the <b>closest</b> point of W to y: ‖y − ŷ‖ &lt; ‖y − v‖ for every other v ∈ W.</p><p><b>Why:</b> y − v = (y − ŷ) + (ŷ − v) with the pieces orthogonal, so Pythagoras gives ‖y − v‖² = ‖y − ŷ‖² + ‖ŷ − v‖².</p>"],
["la3","Projection","Projection matrix onto the line through u = (1, 2). Properties?","<span class='f'>P = uuᵀ/(uᵀu) = (1/5)[1 2; 2 4]</span><p>P² = P (projecting twice changes nothing), Pᵀ = P, Pu = u, and P kills u⊥.</p>"],
["la3","Gram–Schmidt","Gram–Schmidt process: steps and example.","<ol><li>v₁ = x₁.</li><li>v₂ = x₂ − (x₂·v₁/v₁·v₁)v₁.</li><li>vₖ = xₖ − (projection onto span of v₁, …, vₖ₋₁).</li><li>Normalize if you want orthonormal.</li></ol><p class='ex'>x₁ = (1, 1, 0), x₂ = (2, 0, 1): v₂ = (2, 0, 1) − (2/2)(1, 1, 0) = <b>(1, −1, 1)</b>.</p><p class='trap'>Subtract projections onto the new v’s, not the old x’s.</p>"],
["la3","QR","QR factorization: what are Q and R, and how do you find them?","<p>A (independent columns) = QR: Q has orthonormal columns (Gram–Schmidt on A’s columns, normalized), R is upper triangular with positive diagonal.</p><span class='f'>R = QᵀA</span><p class='ex'>A = [1 2; 1 0; 0 1]: Q = [(1, 1, 0)/√2, (1, −1, 1)/√3], R = [√2 √2; 0 √3].</p>"],
["la3","Least squares","What is a least-squares solution and what are the normal equations?","<p>x̂ minimizes ‖b − Ax‖: Ax̂ = proj of b onto Col A.</p><span class='f'>AᵀAx̂ = Aᵀb</span><p><b>Why:</b> b − Ax̂ ⊥ Col A means Aᵀ(b − Ax̂) = 0.</p><p>Least-squares error = ‖b − Ax̂‖.</p>"],
["la3","Least squares","When is the least-squares solution unique?","<p>Exactly when the columns of A are linearly independent ⟺ AᵀA is invertible. Then x̂ = (AᵀA)⁻¹Aᵀb.</p><p class='trap'>Otherwise there are infinitely many x̂ (all with the same Ax̂).</p>"],
["la3","Least squares","Fit the least-squares line y = β₀ + β₁x to (0, 1), (1, 1), (2, 4).","<ol><li>X = [1 0; 1 1; 1 2], y = (1, 1, 4).</li><li>XᵀX = [3 3; 3 5], Xᵀy = (6, 9).</li><li>Solve: β = (1/2, 3/2).</li></ol><p class='ex'>y = <b>1/2 + (3/2)x</b>. Residuals (1/2, −1, 1/2), squared error 3/2.</p>"],
["la3","Least squares","Least squares with QR, or with orthogonal columns: shortcuts?","<span class='f'>A = QR ⟹ Rx̂ = Qᵀb &nbsp; (back-substitute)</span><p>If A’s columns a₁, …, aₙ are orthogonal: x̂ⱼ = (b·aⱼ)/(aⱼ·aⱼ), just projection coefficients.</p>"],
["la3","Inner product spaces","Four axioms of an inner product ⟨u, v⟩.","<ol><li>⟨u, v⟩ = ⟨v, u⟩.</li><li>⟨u + v, w⟩ = ⟨u, w⟩ + ⟨v, w⟩.</li><li>⟨cu, v⟩ = c⟨u, v⟩.</li><li>⟨u, u⟩ ≥ 0, with ⟨u, u⟩ = 0 only for u = 0.</li></ol><p class='trap'>Axiom 4 (positivity) is the one that usually fails.</p>"],
["la3","Inner product spaces","On P₂ use ⟨p, q⟩ = p(−1)q(−1) + p(0)q(0) + p(1)q(1). Compute ⟨t, t²⟩, ‖1‖, ‖t‖.","<ol><li>⟨t, t²⟩ = (−1)(1) + 0 + (1)(1) = <b>0</b>: orthogonal.</li><li>‖1‖² = 3, so ‖1‖ = √3.</li><li>‖t‖² = 1 + 0 + 1 = 2, ‖t‖ = √2.</li></ol><span class='lb'>Why it’s an inner product</span><p>A nonzero degree-≤2 polynomial can’t vanish at 3 points, so ⟨p, p⟩ &gt; 0.</p>"],
["la3","Inner product spaces","Why is ⟨p, q⟩ = p(0)q(0) + p(1)q(1) NOT an inner product on P₂?","<p>Positivity fails: p = t² − t is nonzero but p(0) = p(1) = 0, so ⟨p, p⟩ = 0.</p><p class='trap'>Evaluation at k points works on Pₙ only when k ≥ n + 1.</p>"],
["la3","Inner product spaces","Integral inner product on C[a, b]; Gram–Schmidt on 1, t over [0, 1].","<span class='f'>⟨f, g⟩ = ∫ₐᵇ f(t)g(t) dt</span><ol><li>⟨1, t⟩ = 1/2, ⟨1, 1⟩ = 1.</li><li>v₂ = t − (1/2)/1·1 = <b>t − 1/2</b>.</li></ol><p class='ex'>Orthogonal basis of P₁ on [0, 1]: {1, t − 1/2}.</p>"],
["la3","Inner product spaces","Best approximation in a function space: project t² onto span{1, t} with ∫₋₁¹.","<ol><li>1 and t are orthogonal on [−1, 1] (t is odd).</li><li>⟨t², 1⟩/⟨1, 1⟩ = (2/3)/2 = 1/3; ⟨t², t⟩ = 0.</li></ol><p class='ex'>Best linear approximation: <b>1/3</b> (a constant!).</p><p>Same projection formula as ℝⁿ; only the inner product changed.</p>"],
["la3","Inner product spaces","Cauchy–Schwarz and triangle inequalities.","<span class='f'>|⟨u, v⟩| ≤ ‖u‖‖v‖, &nbsp; ‖u + v‖ ≤ ‖u‖ + ‖v‖</span><p>Hold in every inner product space. Equality in Cauchy–Schwarz ⟺ u, v are parallel.</p><p><b>Why:</b> ‖proj_u v‖ ≤ ‖v‖ since v = proj + orthogonal part.</p>"],
["la3","Symmetric matrices","Why are eigenvectors of a symmetric matrix from different eigenvalues orthogonal?","<p>λ₁v₁·v₂ = (Av₁)·v₂ = v₁·(Aᵀv₂) = v₁·(Av₂) = λ₂v₁·v₂. With λ₁ ≠ λ₂, v₁·v₂ = 0.</p><p class='trap'>Within one eigenspace they need not be orthogonal: use Gram–Schmidt there.</p>"],
["la3","Spectral theorem","Spectral theorem for real symmetric matrices.","<p>For A = Aᵀ (n×n real):</p><ul><li>n real eigenvalues (with multiplicity).</li><li>Each eigenspace has dimension = multiplicity.</li><li>Eigenspaces are mutually orthogonal.</li><li>A is <b>orthogonally diagonalizable</b>: A = PDPᵀ.</li></ul><p>Conversely, orthogonally diagonalizable ⟹ symmetric.</p>"],
["la3","Spectral theorem","Recipe to orthogonally diagonalize a symmetric A.","<ol><li>Find eigenvalues.</li><li>Basis of each eigenspace.</li><li>Gram–Schmidt inside each eigenspace (different eigenspaces are already orthogonal).</li><li>Normalize; P = [u₁ ⋯ uₙ], D = diag(λ’s) in the same order.</li></ol><span class='f'>A = PDPᵀ, &nbsp; P⁻¹ = Pᵀ</span>"],
["la3","Spectral theorem","Orthogonally diagonalize A = [3 1; 1 3] and write its spectral decomposition.","<ol><li>λ = 4: (1, 1); λ = 2: (1, −1).</li><li>P = (1/√2)[1 1; 1 −1], D = diag(4, 2).</li></ol><span class='f'>A = 4u₁u₁ᵀ + 2u₂u₂ᵀ = 4·½[1 1; 1 1] + 2·½[1 −1; −1 1]</span><p>Each uᵢuᵢᵀ is the projection onto that eigenline.</p>"],
["la3","Spectral theorem","Diagonalizable vs orthogonally diagonalizable.","<p>Diagonalizable: A = PDP⁻¹ with any invertible P (needs n independent eigenvectors).</p><p>Orthogonally diagonalizable: P orthogonal; happens <b>exactly</b> for symmetric A.</p><p class='ex'>[1 1; 0 2] is diagonalizable (distinct eigenvalues) but not orthogonally: eigenvectors (1, 0), (1, 1) aren’t orthogonal.</p>"],
["la3","SVD","What is the singular value decomposition?","<span class='f'>A = UΣVᵀ</span><p>A is m×n; U (m×m) and V (n×n) orthogonal; Σ is m×n with σ₁ ≥ σ₂ ≥ ⋯ ≥ σᵣ &gt; 0 on the diagonal, zeros elsewhere.</p><p>Every matrix has one, not just square or symmetric ones.</p><p>Meaning: A maps the orthonormal vᵢ to σᵢuᵢ.</p>"],
["la3","SVD","Why are singular values √(eigenvalues of AᵀA), and why is that legal?","<p>AᵀA is symmetric, so it has an orthonormal eigenbasis v₁, …, vₙ. For a unit eigenvector,</p><span class='f'>‖Avᵢ‖² = vᵢᵀAᵀAvᵢ = λᵢ ≥ 0</span><p>So σᵢ = √λᵢ = ‖Avᵢ‖ is the stretch in direction vᵢ.</p>"],
["la3","SVD","Recipe for the SVD.","<ol><li>Eigenvalues of AᵀA, in decreasing order; σᵢ = √λᵢ.</li><li>Orthonormal eigenvectors v₁, …, vₙ → V.</li><li>uᵢ = Avᵢ/σᵢ for σᵢ &gt; 0.</li><li>Extend u’s to an orthonormal basis of ℝᵐ (e.g. via Nul Aᵀ) → U.</li></ol><p class='trap'>Don’t compute U independently from AAᵀ eigenvectors: the signs may not match. Use uᵢ = Avᵢ/σᵢ.</p>"],
["la3","SVD","Find the SVD of A = [2 2; 1 −1].","<ol><li>AᵀA = [5 3; 3 5], eigenvalues 8, 2: σ₁ = 2√2, σ₂ = √2.</li><li>v₁ = (1, 1)/√2, v₂ = (1, −1)/√2.</li><li>Av₁ = (4, 0)/√2 → u₁ = (1, 0); Av₂ = (0, 2)/√2 → u₂ = (0, 1).</li></ol><p class='ex'>A = I · diag(2√2, √2) · Vᵀ.</p>"],
["la3","SVD","SVD of the 1×2 matrix A = [3 4].","<ol><li>AᵀA = [9 12; 12 16], eigenvalues 25, 0: σ₁ = 5.</li><li>v₁ = (3, 4)/5, v₂ = (−4, 3)/5.</li><li>u₁ = Av₁/5 = 1.</li></ol><p class='ex'>A = [1]·[5 0]·Vᵀ. Rank 1.</p>"],
["la3","SVD","What does the SVD tell you about rank and the four fundamental subspaces?","<p>r = rank A = number of nonzero singular values.</p><ul><li>u₁, …, uᵣ: orthonormal basis of Col A.</li><li>uᵣ₊₁, …, uₘ: Nul Aᵀ.</li><li>v₁, …, vᵣ: Row A.</li><li>vᵣ₊₁, …, vₙ: Nul A.</li></ul>"],
["la3","SVD","Singular values vs eigenvalues.","<p>Different in general.</p><p class='ex'>[0 1; 0 0]: eigenvalues 0, 0, but singular values 1, 0.</p><p>For symmetric A, σᵢ = |λᵢ|. Also: max ‖Ax‖ over unit x is σ₁ (attained at v₁).</p><p class='trap'>Singular values are never negative.</p>"],
["la3","SVD","Pseudoinverse and minimum-length least squares; condition number.","<span class='f'>A⁺ = VᵣDᵣ⁻¹Uᵣᵀ, &nbsp; x̂ = A⁺b</span><p>x̂ is the least-squares solution of smallest length (Ax̂ = proj of b onto Col A).</p><p><b>Condition number</b> (square invertible A): σ₁/σₙ. Large means sensitive to errors.</p><p class='ex'>[2 2; 1 −1]: condition number 2√2/√2 = 2.</p>"],
// ================= cards61b.js =================
["j1","Java basics","Compile error vs runtime error: what’s the difference?","<span class='lb'>Meaning</span><p>A <b>compile error</b> is found by the compiler using only static types; nothing runs at all. A <b>runtime error</b> is an exception thrown while the program runs.</p><span class='f'>type mismatches, missing methods → compile; null, bad index, bad cast → runtime</span><p class='ex'><code>int x = &quot;hi&quot;;</code> compile error. <code>int[] a = new int[2]; a[5] = 1;</code> ArrayIndexOutOfBoundsException.</p><p class='trap'>A type error on a line that would never execute still stops the whole program from compiling.</p>"],
["j1","Java basics","What do <code>7 / 2</code>, <code>-7 / 2</code>, <code>-7 % 3</code>, <code>7 / 2.0</code> evaluate to?","<span class='f'>3, −3, −1, 3.5</span><p>Integer division truncates <b>toward zero</b>. The remainder takes the sign of the left operand. If either side is a double, you get real division.</p><p class='trap'><code>-1 % 8</code> is −1, not 7. Use <code>Math.floorMod</code> for wrap-around indices.</p>"],
["j1","Java basics","What does <code>System.out.println(1 + 2 + &quot;3&quot; + 4 + 5);</code> print?","<span class='f'>3345</span><p>+ is evaluated left to right. 1 + 2 is int addition (3). Once a String joins in, every later + is concatenation: &quot;3&quot; + &quot;3&quot; → &quot;33&quot;, then &quot;334&quot;, then &quot;3345&quot;.</p><p class='ex'><code>'a' + 1</code> is the int 98; <code>(char) ('a' + 1)</code> is b.</p>"],
["j1","Static vs instance","What is the difference between a static and an instance variable?","<span class='lb'>Meaning</span><p><b>Instance</b>: each object has its own copy. <b>Static</b>: one copy shared by the whole class.</p><span class='lb'>Why</span><p>Some facts belong to the class (a species name, a counter of objects made), not to any one object.</p><p class='ex'><code>d2.binomen = &quot;Lupus&quot;;</code> changes <code>Dog.binomen</code> for every Dog, even though it was written through d2.</p><p class='trap'>Unassigned object fields default to null (ints to 0), so <code>d2.name</code> prints null.</p>"],
["j1","Static vs instance","Why can’t a static method use an instance variable directly?","<span class='lb'>Why</span><p>A static method is called on the class, with no object, so there is no <code>this</code>. Which dog’s <code>weight</code> would it mean?</p><span class='f'>static context → no this → compile error</span><p class='ex'><code>static void f() { weight = 3; }</code> fails: non-static variable cannot be referenced from a static context. Fix: take a Dog parameter, <code>d.weight = 3</code>.</p>"],
["j1","Golden Rule of Equals","State the Golden Rule of Equals.","<span class='f'>y = x copies the bits in x into y</span><p>For a <b>primitive</b> the bits are the value, so y is an independent copy. For a <b>reference</b> the bits are an address, so y and x now point at the <b>same object</b>.</p><p class='ex'><code>Walrus b = a; b.weight = 5;</code> → <code>a.weight</code> is also 5.</p><p class='trap'>Parameter passing follows the same rule: Java is always pass-by-value.</p>"],
["j1","Golden Rule of Equals","What are Java’s 8 primitive types, and what is everything else?","<span class='f'>byte short int long float double boolean char</span><p>Everything else (arrays, Strings, every class, Integer) is a <b>reference type</b>: the variable holds an address or null.</p><p><code>new</code> builds an object and returns its address; that address is what gets stored.</p><p class='trap'>String is a reference type. <code>==</code> on Strings compares addresses.</p>"],
["j1","Golden Rule of Equals","A method does <code>k = k + 1; arr[0]++;</code> on parameters <code>int k, int[] arr</code>. Which change does the caller see?","<span class='f'>only arr[0]++</span><p>k is a copy of the caller’s int, so changing it is invisible. arr is a copy of the caller’s <b>arrow</b>; following it reaches the caller’s actual array.</p><p class='ex'>n = 3, arr = {3} → after the call: n is 3, arr[0] is 4.</p><p class='trap'><code>w = new Walrus(99);</code> inside a method re-aims only the local copy. The caller’s variable never changes where it points.</p>"],
["j1","Box-and-pointer","How do you draw a box-and-pointer diagram?","<ol><li>Each variable is a box. Primitive: write the value inside.</li><li>Each <code>new</code> makes an object (with its own field boxes); draw an arrow from wherever its address is stored.</li><li>Each assignment copies what’s in the right-hand box: a number, or an arrow to the <b>same</b> place.</li><li>null is a slash. Unreachable objects are garbage.</li></ol><p class='trap'>Never draw a copy of an object unless the code says <code>new</code>.</p>"],
["j1","Arrays","What do <code>new int[3]</code>, <code>new Dog[3]</code> and <code>new int[3][]</code> create?","<ul><li><code>new int[3]</code>: three int boxes, all 0.</li><li><code>new Dog[3]</code>: three <b>null arrows</b>. No dogs are built.</li><li><code>new int[3][]</code>: an array of three null arrows to (not yet created) int arrays.</li></ul><span class='f'>arrays are objects with a fixed length field</span><p class='trap'>Rows of a 2D array can be shared: after <code>m[2] = m[1]</code>, writing <code>m[2][0]</code> changes row 1 too.</p>"],
["j1","Arrays","Does <code>a == b</code> tell you two arrays have the same contents?","<span class='f'>No: == compares addresses</span><p>Two separately created arrays {1, 2} and {1, 2} are != . Use <code>Arrays.equals(a, b)</code> for contents.</p><p class='ex'><code>int[] p = {1,2,3}; int[] q = p; q = new int[]{7,8}; q[0] = 0;</code> → p[0] is still 1: q was re-aimed before the write.</p>"],
