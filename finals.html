function renderMethod(){
  view.innerHTML=`<div class="sect">
<h2>How every block works</h2>
<div class="card"><p><b>The loop for every unit:</b> Day 0 <b>Learn</b> → Day 1 <b>Hard set</b> (closed book, timed) → Day 3 and Day 7 <b>Recall</b> (blank page + redo a miss) → <b>Mock exams</b> in the last week. Every unit goes through all four steps, so nothing is learned once and then forgotten.</p></div>
<h3>Learn (≈ 60 min)</h3>
<ol><li>Skim the lecture notes’ headings (5 min) so you know where it’s going.</li><li>Work through the notes/section actively: for each definition or theorem, write it, one example, and <b>why it’s true</b> in your own words.</li><li>Cover the worked examples and redo 2 of them cold.</li><li>Close everything and write a 3-sentence summary. Anything you can’t write goes in the error log now.</li></ol>
<h3>Hard set (75–90 min) — this is where cracks show up</h3>
<ol><li><b>Closed book, timed</b>, like an exam. No peeking at notes or solutions until you’ve committed to an answer.</li><li>Sources are listed on each block, in priority order: homework (Math 55: ~¼ of exam problems are near-verbatim homework), that unit’s quiz, midterm/practice-exam problems, then the hardest textbook or exam-archive problems.</li><li>Answer the block’s <b>crack check</b> in writing. If you can’t explain <i>why</i>, you’ve memorized a procedure, not learned it.</li><li>Grade yourself honestly. Below ~80%: log every miss and redo those problems cold in 2 days.</li></ol>
<h3>Crack checks: proving it’s understanding, not memory</h3>
<ul><li><b>Explain why</b> the method works, out loud, in 2 minutes, without notes.</li><li><b>Change one thing:</b> alter a condition (singular matrix, repeated root, negative edge weight) and predict what breaks before computing.</li><li><b>True/False with a reason:</b> every T needs a one-line justification, every F a counterexample. Math 54 tests this heavily.</li><li><b>Run it backwards:</b> build a matrix with given eigenvalues, a recurrence with a given solution, an input that makes quicksort quadratic.</li><li><b>Trace by hand (61B):</b> predict output, draw box-and-pointer, step through the PQ in Dijkstra, before running anything.</li><li><b>Mixed sets:</b> in mocks the topic isn’t labeled, so you practice choosing the method, which is what the final tests.</li></ul>
<h3>Recall (≈ 20–30 min, every day)</h3>
<p>The day view lists the units you learned 3 and 7 days ago. For each: blank page, 5 minutes, write the definitions, the key theorem, and one worked problem. Then check against the notes. Also redo every error-log problem that’s due (+2 days and +7 days after you missed it). Math 55 decks on this site (<a href="cards.html">flashcards</a>) also count as recall.</p>
<h3>Error log (one per course)</h3>
<p>Columns: date · course/unit · problem · <b>why I missed it</b> (concept / misread / algebra / ran out of time) · the rule that prevents it · redo +2d ✓ · redo +7d ✓. Before each mock and each final, reread the “rule” column. Your Math 54 cheat sheet comes from this log.</p>
<h3>A unit counts as ✓ only when</h3>
<ol><li>You solved an exam-level problem on it cold and got it right,</li><li>you can explain its core idea out loud without notes, and</li><li>every miss from its hard set was redone correctly at least 48 hours later.</li></ol>
<h3>If you fall behind</h3>
<ul><li>Never skip hard sets or recall; those are what make it stick. Shorten <b>Learn</b> first (lecture notes only, skip the textbook).</li><li>Dec 11 is the buffer day: anything unchecked moves there.</li><li>Math 55 must be fully done by Sunday Dec 13: its final is 10 hours after Math 54 ends.</li><li>Sleep 7–8 hours. Memory consolidates during sleep; an all-nighter erases the recall work.</li></ul>
<h3>Time budget</h3>
<p>About 6–8 hours a day on class days and 8–9 on break days, plus your homework and Project 5. Thanksgiving week carries the most new units on purpose. If a day is too heavy, do the hard sets and recall, and move one Learn block to Dec 11.</p>
</div>`;
}

function show(v){
  pick.value=v;
  if(v==='method') renderMethod(); else if(v==='units') renderUnits(); else if(v==='materials') renderMaterials(); else renderDay(v);
  const opts=[...pick.options].map(o=>o.value), i=opts.indexOf(v);
  document.getElementById('prev').disabled=i<=0; document.getElementById('next').disabled=i>=opts.length-1;
  try{ sessionStorage.setItem(KEY+'-view',v); }catch(e){}
  window.scrollTo(0,0);
}
buildPicker(); examsBox();
pick.onchange=()=>show(pick.value);
document.getElementById('prev').onclick=()=>{const o=[...pick.options].map(o=>o.value);const i=o.indexOf(pick.value);if(i>0)show(o[i-1]);};
document.getElementById('next').onclick=()=>{const o=[...pick.options].map(o=>o.value);const i=o.indexOf(pick.value);if(i<o.length-1)show(o[i+1]);};
(function(){
  let v=null; try{ v=sessionStorage.getItem(KEY+'-view'); }catch(e){}
  const t=localISO(), days=DAYS.map(x=>x[0]);
  if(!v||![...pick.options].some(o=>o.value===v)) v=days.includes(t)?t:(t<days[0]?days[0]:days[days.length-1]);
  show(v);
})();
</script>
