<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315773a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia,serif'%3E%E2%96%B6%3C/text%3E%3C/svg%3E">
<title>Today’s Study</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#17202b;--muted:#5a6473;--rule:#dde2e9;--accent:#1f4cc9;--accent-bg:#edf2ff;--ok:#15773a;--ok-bg:#ecf8f0;--bad:#c02a2a;--bad-bg:#fff0ef;--warn:#b4520a;--warn-bg:#fff4e6;--c54:#7a3fb8;--c54-bg:#f4edfc;--c55:#1f4cc9;--c55-bg:#edf2ff;--cb:#15773a;--cb-bg:#ecf8f0;--math:"STIX Two Text","Cambria Math",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--surface:#181d25;--ink:#e6eaf0;--muted:#9aa4b3;--rule:#2a313c;--accent:#8fb0ff;--accent-bg:#1c2640;--ok:#7fd39b;--ok-bg:#16261c;--bad:#ff8f8a;--bad-bg:#2d1718;--warn:#f2b26b;--warn-bg:#2a2016;--c54:#c9a2f5;--c54-bg:#251c33;--c55:#8fb0ff;--c55-bg:#1c2640;--cb:#7fd39b;--cb-bg:#16261c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--surface:#181d25;--ink:#e6eaf0;--muted:#9aa4b3;--rule:#2a313c;--accent:#8fb0ff;--accent-bg:#1c2640;--ok:#7fd39b;--ok-bg:#16261c;--bad:#ff8f8a;--bad-bg:#2d1718;--warn:#f2b26b;--warn-bg:#2a2016;--c54:#c9a2f5;--c54-bg:#251c33;--c55:#8fb0ff;--c55-bg:#1c2640;--cb:#7fd39b;--cb-bg:#16261c;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 48px);overflow-wrap:break-word}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1{font-size:1.35rem;margin:0;flex:1}
.top a{font-size:.85rem;color:var(--muted)}
.prog{height:8px;background:var(--rule);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.banner{border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.9rem}
.banner.warn{background:var(--warn-bg)} .banner.info{background:var(--accent-bg)} .banner.ok{background:var(--ok-bg)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;margin-top:12px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px}
.t54{background:var(--c54-bg);color:var(--c54)} .t55{background:var(--c55-bg);color:var(--c55)} .tB{background:var(--cb-bg);color:var(--cb)} .tA{background:var(--rule);color:var(--ink)}
.step{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-size:1.2rem;line-height:1.3;margin:6px 0 4px}
.instr h3{font-size:1rem;margin:12px 0 6px}
.instr p{margin:5px 0}
.instr li.qt{margin:3px 0 3px 18px;font-size:.93rem}
.btn{display:block;width:100%;font:700 1rem system-ui,sans-serif;border:0;border-radius:14px;min-height:52px;margin-top:14px;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--accent-bg);color:var(--accent)}
.btn.ok{background:var(--ok);color:var(--surface)}
.timer{font:700 1.6rem ui-monospace,Menlo,monospace;text-align:center;margin:12px 0 0}
.timer small{display:block;font:500 .8rem system-ui;color:var(--muted)}
.req{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.req span{font-size:.75rem;border-radius:99px;padding:3px 9px;background:var(--rule);color:var(--muted)}
.req span.done{background:var(--ok-bg);color:var(--ok)}
.req span.cur{outline:2px solid var(--accent)}
.q{font-size:1.02rem;overflow-x:auto}
.q code,.fb code{overflow-wrap:anywhere;word-break:break-word}
.fb .sol{overflow-x:auto}
.q .mathish,.q table.mat{font-family:var(--math)}
.q table{border-collapse:collapse;margin:8px 0}
.q table.mat td{padding:2px 9px;text-align:center}
.q table.mat{border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:4px}
.q pre,.q pre.code{background:var(--accent-bg);border-radius:10px;padding:10px;overflow-x:auto;font-size:.85rem}
input.ans,textarea{width:100%;font:1.05rem system-ui;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:10px}
textarea{min-height:90px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.choice input{margin-top:4px;width:18px;height:18px;flex:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{border-radius:12px;padding:12px;margin-top:12px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb .sol{margin-top:8px;font-size:.95rem}
.small{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:10px}
.row input{flex:1}
label.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
details.instrbox summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:10px}
footer{margin-top:28px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="h">Today</h1><a href="finals.html">Plan</a><a href="#" id="logLink">Error log</a></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="meta"><span id="m1"></span><span id="m2"></span></div>
  <div id="main"></div>
  <footer>Questions are generated fresh every attempt, so memorized answers don’t carry over. Progress is saved in this browser on this device.</footer>
</div>
<script src="plan-data.js"></script>
<script src="gen54.js"></script>
<script src="gen55.js"></script>
<script src="gen61b.js"></script>
<script>
"use strict";
const P=window.PLAN, G=window.GEN||{};
const KEY='study-app-v1';
let S={done:{},start:{},err:[],check:{},notes:[],q:null};
try{ S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
const $=id=>document.getElementById(id);
const TAG={'54':'<span class="tag t54">Math 54</span>','55':'<span class="tag t55">Math 55</span>','B':'<span class="tag tB">CS 61B</span>','A':'<span class="tag tA">All</span>'};
const OVR=new URLSearchParams(location.search).get('date');
const today=()=>{if(OVR&&/^\d{4}-\d{2}-\d{2}$/.test(OVR))return OVR;const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const fm=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- RNG ----------
function makeRng(seed){ let a=seed>>>0||1;
  const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const r={float:f,int:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),pick:a=>a[Math.floor(f()*a.length)],bool:()=>f()<.5,
    shuffle:a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}};
  r.sample=(a,k)=>r.shuffle(a).slice(0,k); return r; }
const freshSeed=()=>{const u=new Uint32Array(1);(crypto||window.msCrypto).getRandomValues(u);return u[0];};

// ---------- answer checking ----------
function parseNum(s){ s=String(s).trim().replace(/−/g,'-').replace(/\s+/g,'');
  if(!s) return NaN;
  let m=s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/); if(m) return parseFloat(m[1])/parseFloat(m[2]);
  if(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return parseFloat(s);
  return NaN; }
function numEq(given,ans){ const a=typeof ans==='string'?parseNum(ans):ans, g=parseNum(given);
  if(!isFinite(g)||!isFinite(a)) return false;
  const exact=typeof ans==='string'||Number.isInteger(a)||Math.abs(a*1e4-Math.round(a*1e4))<1e-7;
  if(Number.isInteger(a)) return Math.abs(g-a)<1e-9;
  return exact? Math.abs(g-a)<=1e-9*Math.max(1,Math.abs(a)) : Math.abs(g-a)<=5e-4*Math.max(1,Math.abs(a)); }
const norm=s=>String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/[\s·*]/g,'').replace(/θ/g,'θ');
function check(Q,input){
  switch(Q.kind){
    case 'num': return numEq(input,Q.answer);
    case 'list': { const g=String(input).split(/[,;\s]+/).filter(Boolean); const a=Q.answer.slice();
      if(g.length!==a.length) return false;
      if(Q.unordered){ const gs=g.map(parseNum).sort((x,y)=>x-y), as=a.map(x=>typeof x==='string'?parseNum(x):x).sort((x,y)=>x-y); return gs.every((v,i)=>numEq(String(v),as[i])); }
      return g.every((v,i)=>numEq(v,a[i])); }
    case 'mc': return Number(input)===Q.answer;
    case 'multi': { const g=(input||[]).slice().sort(), a=Q.answer.slice().sort(); return g.length===a.length&&g.every((v,i)=>v===a[i]); }
    case 'tf': return input===Q.answer;
    case 'text': { const g=norm(input); return (Array.isArray(Q.answer)?Q.answer:[Q.answer]).some(a=>norm(a)===g); }
  } return false; }

// ---------- generators ----------
const gensFor=(unit,type)=>(G[unit]||[]).filter(g=>!type||g.type===type);
function makeQ(unit,type,genId){
  let gens=genId?(G[unit]||[]).filter(g=>g.id===genId):gensFor(unit,type);
  if(!gens.length) gens=gensFor(unit); if(!gens.length) return null;
  for(let tries=0;tries<20;tries++){
    const g=makeRng(freshSeed()).pick(gens);
    try{ const Q=g.make(makeRng(freshSeed())); if(Q&&Q.prompt){ delete Q._d; delete Q._chk; delete Q._java; delete Q.meta; Q.gen=g.id; Q.unit=unit; Q.type=g.type;
      if(Q.kind==='mc'){ const order=makeRng(freshSeed()).shuffle(Q.choices.map((c,i)=>i)); Q.order=order; }
      return JSON.parse(JSON.stringify(Q)); } }catch(e){ console.warn(g.id,e); } }
  return null; }
const typesWithGens=unit=>[...new Set((G[unit]||[]).map(g=>g.type))];

// ---------- queue ----------
function allTasks(){ const out=[]; P.days.forEach(day=>day.tasks.forEach((t,i)=>out.push(Object.assign({key:day.d+'#'+i,d:day.d},t)))); return out; }
function queue(){ const td=today(); return allTasks().filter(t=>t.d<=td && !S.done[t.key] && t.t!=='K'); }

// ---------- requirements per task ----------
function reqsFor(t){
  // returns list of {unit,type,need,genId?}
  const R=[]; const r=makeRng(hashStr(t.key));
  const addUnit=(u,need,maxTypes)=>{ let ts=typesWithGens(u); if(maxTypes) ts=r.sample(ts,Math.min(maxTypes,ts.length)); ts.forEach(ty=>R.push({unit:u,type:ty,need})); };
  if(t.t==='L') addUnit(t.u,1);
  else if(t.t==='H') addUnit(t.u,2);
  else if(t.t==='R') t.units.forEach(u=>addUnit(u,1,2));
  if(t.t==='R'||(t.t==='T'&&/error-log|ERROR-LOG|error log/i.test(t.title))) dueErrors(t).forEach(e=>R.push({unit:e.unit,type:e.type,need:1,genId:e.gen,err:e.id}));
  if(t.t==='M'){ const c=S.check[t.key]; if(c&&c.missedUnits) c.missedUnits.forEach(u=>addUnit(u,1,2)); }
  return R; }
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function dueErrors(t){ const course=t.c; return S.err.filter(e=>!e.cleared && e.due<=t.d && (course==='A'||e.unit.startsWith(course==='B'?'B-':course))); }

// ---------- render ----------
let tick=null;
function render(){
  clearInterval(tick);
  const td=today(), q=queue(), todays=allTasks().filter(t=>t.d===td&&t.t!=='K');
  const doneToday=todays.filter(t=>S.done[t.key]).length;
  $('h').textContent=fmt(td);
  $('bar').style.width=(todays.length?100*doneToday/todays.length:100)+'%';
  const left=q.reduce((s,t)=>s+(t.min||0),0);
  $('m1').textContent=doneToday+' of '+todays.length+' tasks done today';
  $('m2').textContent=q.length?('≈ '+fm(left)+' left'):'';
  const main=$('main');
  const milestone=allTasks().filter(t=>t.d===td&&t.t==='K');
  let pre=milestone.map(k=>`<div class="banner ok">🎯 ${esc(k.title)}</div>`).join('');
  const catchup=q.filter(t=>t.d<td).length;
  if(catchup) pre+=`<div class="banner warn">Catch-up first: ${catchup} unfinished task${catchup>1?'s':''} from earlier days.</div>`;
  if(!q.length){ main.innerHTML=pre+`<div class="card"><h2>All done for today ✓</h2><p>Every task passed its check. Sleep is part of the plan: memory consolidates overnight.</p><p class="small">Tomorrow’s tasks unlock at midnight.</p></div>`; return; }
  const t=q[0]; renderTask(t,pre); }

function renderTask(t,pre){
  const main=$('main'); const st=S.start[t.key];
  const minFrac={L:.6,H:.7,M:.8,T:.6,R:0}[t.t]??.6;
  const needMs=Math.round((t.min||0)*minFrac*60000);
  const head=`${pre}<div class="card"><div class="step">${t.d<today()?'Catch-up · '+fmt(t.d):'Task'} · ${fm(t.min||0)}</div>${TAG[t.c]||''}<h2>${esc(t.title)}</h2>`;
  const instr=`<div class="instr">${t.html||''}</div>`;
  const C=S.check[t.key];
  if(!st){ main.innerHTML=head+instr+`<button class="btn" id="go">Start this task</button></div>`;
    $('go').onclick=()=>{ S.start[t.key]=Date.now(); save(); render(); }; return; }
  if(!C||!C.phase){
    main.innerHTML=head+`<details class="instrbox" open><summary>Instructions</summary>${instr}</details><div class="timer" id="tm"></div><div id="after"></div></div>`;
    const draw=()=>{ const el=Date.now()-st, rem=needMs-el;
      $('tm').innerHTML=`${clock(el)}<small>${rem>0?'check unlocks in '+clock(rem):'check unlocked'} · planned ${fm(t.min||0)}</small>`;
      if(rem<=0 && !$('ck')){ $('after').innerHTML=preCheckForm(t); bindPreCheck(t); } };
    draw(); tick=setInterval(draw,1000); return; }
  renderCheck(t,head); }
const clock=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return (s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

function preCheckForm(t){
  if(t.t==='H') return `<p><b>Report honestly</b>: this decides what comes back in your review.</p>
   <div class="row"><input class="ans" id="att" inputmode="numeric" placeholder="# problems attempted"><input class="ans" id="cor" inputmode="numeric" placeholder="# fully correct"></div>
   <textarea id="why" placeholder="Every problem you missed: which one, what went wrong, the rule that prevents it"></textarea>
   <button class="btn" id="ck">Prove it: start the check</button>`;
  if(t.t==='M'){ const units=Object.keys(P.U).filter(u=>t.c==='B'?u.startsWith('B-'):u.startsWith(t.c+'-'));
   return `<p><b>Grade it strictly first</b> (partial = wrong). Then report:</p>
   <div class="row"><input class="ans" id="pts" inputmode="decimal" placeholder="points earned"><input class="ans" id="tot" inputmode="decimal" placeholder="points possible"></div>
   <input class="ans" id="sure" inputmode="numeric" placeholder="# answers marked SURE that were wrong">
   <p class="small">Tick every unit where you lost points:</p>${units.map(u=>`<label class="chk"><input type="checkbox" value="${u}"> ${esc(P.U[u].n)}</label>`).join('')}
   <textarea id="why" placeholder="Each lost point: what went wrong + the rule"></textarea>
   <button class="btn" id="ck">Submit and start the check</button>`; }
  if(t.t==='T') return `<textarea id="why" placeholder="What did you do / what did you log? (be specific)"></textarea><button class="btn" id="ck">Done: continue</button>`;
  return `<button class="btn" id="ck">I’m ready: start the mastery check</button>`; }
function bindPreCheck(t){
  $('ck').onclick=()=>{
    const C=S.check[t.key]={phase:'check',streak:{},asked:0,wrong:0};
    if(t.t==='H'){ const a=+$('att').value, c=+$('cor').value, w=$('why').value.trim();
      if(!(a>0)||!(c>=0)||c>a){ alert('Enter how many you attempted and how many were fully correct.'); delete S.check[t.key]; return; }
      if(c<a && w.length<15){ alert('Write down what you missed and why: this is the error log.'); delete S.check[t.key]; return; }
      S.notes.push({d:today(),key:t.key,title:t.title,att:a,cor:c,why:w});
      if(c/a<0.8){ C.extraNeed=1; } }
    if(t.t==='M'){ const pts=+$('pts').value, tot=+$('tot').value, w=$('why').value.trim();
      if(!(tot>0)||!(pts>=0)||pts>tot){ alert('Enter points earned and points possible.'); delete S.check[t.key]; return; }
      C.missedUnits=[...document.querySelectorAll('.chk input:checked')].map(x=>x.value);
      if(pts<tot && (!C.missedUnits.length||w.length<15)){ alert('Tick the units where you lost points and log what went wrong.'); delete S.check[t.key]; return; }
      S.notes.push({d:today(),key:t.key,title:t.title,pts,tot,sure:+$('sure').value||0,why:w});
      C.missedUnits.forEach(u=>S.err.push({id:'m'+Date.now()+u,unit:u,gen:null,type:null,d:today(),due:addDays(today(),1),cleared:false,from:'mock'})); }
    if(t.t==='T'){ const w=$('why').value.trim(); if(w.length<20){ alert('Write a real summary (20+ characters).'); delete S.check[t.key]; return; }
      S.notes.push({d:today(),key:t.key,title:t.title,why:w}); }
    C.reqs=reqsFor(t); if(C.extraNeed) C.reqs.forEach(r=>r.need+=1);
    save(); render(); }; }

function renderCheck(t,head){
  const C=S.check[t.key]; const reqs=C.reqs||[];
  const open=reqs.filter(r=>(C.streak[rk(r)]||0)<r.need);
  if(!open.length){ finish(t); return; }
  if(!S.q || S.q.task!==t.key){ const r=makeRng(freshSeed()).pick(open); const Q=makeQ(r.unit,r.type,r.genId);
    if(!Q){ C.streak[rk(r)]=r.need; save(); return render(); }
    S.q={task:t.key,req:rk(r),Q,answered:false}; save(); }
  const {Q}=S.q;
  const chips=reqs.map(r=>`<span class="${(C.streak[rk(r)]||0)>=r.need?'done':''} ${rk(r)===S.q.req?'cur':''}">${esc(shortType(r))} ${Math.min(C.streak[rk(r)]||0,r.need)}/${r.need}</span>`).join('');
  const done=reqs.filter(r=>(C.streak[rk(r)]||0)>=r.need).length;
  let input='';
  if(Q.kind==='mc') input=Q.order.map(i=>`<label class="choice"><input type="radio" name="c" value="${i}"><span>${Q.choices[i]}</span></label>`).join('');
  else if(Q.kind==='multi') input=Q.choices.map((c,i)=>`<label class="choice"><input type="checkbox" name="c" value="${i}"><span>${c}</span></label>`).join('')+'<p class="small">Select all that apply (possibly none).</p>';
  else if(Q.kind==='tf') input=`<div class="tf"><button class="btn sec" data-tf="1">True</button><button class="btn sec" data-tf="0">False</button></div>`;
  else input=`<input class="ans" id="a" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${Q.kind==='list'?'comma-separated, e.g. 3, -1/2, 4':Q.kind==='num'?'number or fraction like -7/3':'answer'}" ${Q.kind==='num'?'inputmode="text"':''}>`;
  $('main').innerHTML=head+`<div class="step">Mastery check · ${done}/${reqs.length} types passed</div><div class="req">${chips}</div>
   <div class="q"><div class="small">${esc(P.U[Q.unit]?P.U[Q.unit].n:Q.unit)} · ${esc(Q.type||'')}</div>${Q.prompt}</div>${input}
   ${Q.kind==='tf'?'':'<button class="btn" id="sub">Submit</button>'}<div id="fb"></div></div>`;
  const submit=val=>{ if(S.q.answered) return; const ok=check(Q,val); S.q.answered=true;
    const key=S.q.req; C.asked++;
    if(ok){ C.streak[key]=(C.streak[key]||0)+1;
      const r=reqs.find(x=>rk(x)===key); if(r&&r.err){ const e=S.err.find(x=>x.id===r.err); if(e){ e.hits=(e.hits||0)+1; e.due=addDays(today(),e.hits>=2?99:5); if(e.hits>=2) e.cleared=true; } } }
    else { C.streak[key]=0; C.wrong++;
      S.err.push({id:'e'+Date.now(),unit:Q.unit,gen:Q.gen,type:Q.type,d:today(),due:addDays(today(),2),cleared:false,hits:0});
      // also schedule a +7 recheck
      S.err.push({id:'f'+Date.now(),unit:Q.unit,gen:Q.gen,type:Q.type,d:today(),due:addDays(today(),7),cleared:false,hits:0}); }
    save();
    const fb=$('fb'); fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct ✓':'Not quite ✗'}</b>${ok?'':' The streak for this type resets; a new problem of this type will come back, and it returns in your review in 2 and 7 days.'}
      ${!ok&&Q.hint?'<p><b>Hint:</b> '+Q.hint+'</p>':''}<div class="sol"><b>Solution:</b> ${Q.solution||''}</div></div>
      <button class="btn ${ok?'ok':''}" id="nx" ${ok?'':'disabled'}>${ok?'Next':'Read the solution…'}</button>`;
    document.querySelectorAll('.choice input,.tf button,#a,#sub').forEach(x=>x.disabled=true);
    if(!ok){ let n=20; const b=$('nx'); const iv=setInterval(()=>{ n--; b.textContent=n>0?'Read the solution… '+n:'Got it: next problem'; if(n<=0){clearInterval(iv);b.disabled=false;} },1000); }
    $('nx').onclick=()=>{ S.q=null; save(); render(); };
    fb.scrollIntoView({behavior:'smooth',block:'start'}); };
  if(Q.kind==='tf') document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>submit(b.dataset.tf==='1'));
  else $('sub').onclick=()=>{ let v;
    if(Q.kind==='mc'){ const c=document.querySelector('input[name=c]:checked'); if(!c) return; v=c.value; }
    else if(Q.kind==='multi') v=[...document.querySelectorAll('input[name=c]:checked')].map(x=>+x.value);
    else { v=$('a').value; if(!v.trim()) return; }
    submit(v); };
  if(S.q.answered){ S.q=null; save(); render(); } }
const rk=r=>r.unit+'|'+(r.type||'')+'|'+(r.genId||'')+'|'+(r.err||'');
const shortType=r=>{ const s=(r.err?'Redo: ':'')+(r.type||'mixed'); return s.length>34?s.slice(0,32)+'…':s; };
function finish(t){
  S.done[t.key]=Date.now(); delete S.check[t.key]; S.q=null; save();
  $('main').innerHTML=`<div class="card"><h2>Passed ✓</h2><p>${esc(t.title)}</p><button class="btn ok" id="nx">Next task</button></div>`;
  $('nx').onclick=render; }

$('logLink').onclick=e=>{ e.preventDefault(); clearInterval(tick);
  const open=S.err.filter(x=>!x.cleared);
  $('main').innerHTML=`<div class="card"><h2>Error log</h2><p class="small">Every wrong answer comes back with fresh numbers in 2 and 7 days. It clears after you get it right twice.</p>
   ${open.length?'<ul>'+open.map(x=>`<li>${esc(P.U[x.unit]?P.U[x.unit].n:x.unit)} · ${esc(x.type||'missed on a timed exam')} · due ${fmt(x.due)}</li>`).join('')+'</ul>':'<p>Empty.</p>'}
   <h2>Your notes</h2>${S.notes.slice(-30).reverse().map(n=>`<p class="small"><b>${fmt(n.d)} · ${esc(n.title)}</b>${n.att?` · ${n.cor}/${n.att} correct`:''}${n.tot?` · ${n.pts}/${n.tot} pts`:''}<br>${esc(n.why||'')}</p>`).join('')||'<p>None yet.</p>'}
   <button class="btn sec" id="back">Back to today</button></div>`;
  $('back').onclick=render; };
render();
</script>
</body>
</html>
